# Faction banner + site - hourly (tools/should_run.py decides full / war / chain run).
#
# The code is here (public repo); config.json + data/ are in the PRIVATE data repo (DATA_REPO), checked out
# at ./store and linked in (tools/store.sh). generate.py builds ./site, changed data is pushed back to the data
# repo, and the site is uploaded to Cloudflare together with the gatekeeper (tools/deploy_site.sh) - nothing is
# published from GitHub. The data repo's notify workflow starts this one when a leader saves a payout receipt,
# a Message Builder panel or the Site Panels settings.
name: Faction banner

on:
  # Hourly, started by the gatekeeper's Cloudflare timer (gate/worker.js scheduled) with scheduled=1 - GitHub's
  # own schedule never fired for this repo. tools/should_run.py then lets through:
  #   - a FULL run every 3 hours (everything refreshes, ~10 API calls)
  #   - an hourly WAR run while a ranked war is ongoing / starting within 3 h (~2 API calls)
  #   - every other hour, a CHAIN run: newly finished chains -> Discord Chain Reports (no deploy)
  # Without scheduled=1 ("Run workflow" button, the data repo's notify workflow) it's always a full run.
  workflow_dispatch:
    inputs:
      scheduled:
        description: "1 = hourly timer run (leave empty for a full update)"
        required: false
        default: ""
  push:
    branches: [main]           # redeploy whenever the code/design changes
    paths:
      - "generate.py"
      - "fonts/**"
      - "art/**"
      - "tools/**"
      - "gate/**"
      - ".github/workflows/banner.yml"

permissions:
  contents: read
  actions: write               # starting a full run after a chain run's new report

concurrency:
  group: site
  cancel-in-progress: false

env:
  DATA_REPO: S1SEVEN17/HeartBreakersLogo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the private data
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          path: store

      - name: Link data
        run: tools/store.sh link

      - name: Decide run type
        id: gate
        env:
          HB_SCHEDULED: ${{ inputs.scheduled }}
        run: python3 tools/should_run.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip                 # packages restored from GitHub's cache - quicker start

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Generate banner
        if: steps.gate.outputs.run == 'true'
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
          RUN_KIND: ${{ steps.gate.outputs.kind }}
          HB_SLOT_RUN: ${{ steps.gate.outputs.scheduled }}      # true = the scheduled run of a clock slot
          DISCORD_WEBHOOK_SLACKERS: ${{ secrets.DISCORD_WEBHOOK_SLACKERS }}
          DISCORD_WEBHOOK_CHAINS: ${{ secrets.DISCORD_WEBHOOK_CHAINS }}
          DISCORD_WEBHOOK_CRIMES: ${{ secrets.DISCORD_WEBHOOK_CRIMES }}
          DISCORD_WEBHOOK_RECAP: ${{ secrets.DISCORD_WEBHOOK_RECAP }}
          MEMBER_DIR: ${{ secrets.MEMBER_DIR }}
          LEADER_DIR: ${{ secrets.LEADER_DIR }}
          DISCORD_WEBHOOK_PAYOUTS: ${{ secrets.DISCORD_WEBHOOK_PAYOUTS }}
          DISCORD_WEBHOOK_LEADERS: ${{ secrets.DISCORD_WEBHOOK_LEADERS }}
          # opt-in stats: deletes keys of members who left / whose key is gone (data/optin.json, via GitHub's API)
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: python generate.py --out site

      # a chain run that posted a new report asks for a full run so its page/newsletter go live now
      - name: Save data
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY: ${{ steps.gate.outputs.deploy }}
        run: |
          REQ=0
          if [ -f data/.deploy_request ]; then rm -f data/.deploy_request; [ "$DEPLOY" != "true" ] && REQ=1; fi
          tools/store.sh save "Update saved faction data"
          if [ "$REQ" = 1 ]; then gh workflow run banner.yml --ref main && echo "Requested a full run (new report)"; fi

      # Deploy only when something a visitor sees changed (Nov 2026): a fingerprint of the built site + gatekeeper
      # (build-time stamps blanked - tools/site_hash.py) + the leader positions setting is compared with the one
      # saved after the last successful deploy (data/site_fingerprint.txt). Images keep their "Last updated" time
      # unless their content changed (data/stamps.json), so an unchanged rebuild gives the same fingerprint.
      - name: Check for site changes
        id: fp
        if: steps.gate.outputs.deploy == 'true'
        run: |
          LEADERS=$(python3 -c "import json;print(','.join(json.load(open('config.json')).get('gate',{}).get('leader_positions',['Leader','Co-leader'])))")
          FP=$( (python3 tools/site_hash.py site gate --manifest "$RUNNER_TEMP/site_manifest.json"; echo "$LEADERS") | sha256sum | cut -c1-64)
          OLD=$(cat data/site_fingerprint.txt 2>/dev/null || true)
          echo "fp=$FP" >> "$GITHUB_OUTPUT"
          if [ "$FP" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Site unchanged since the last deploy - upload skipped"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.deploy == 'true' && steps.fp.outputs.changed == 'true'
        with:
          node-version: "22"

      - name: Deploy site + gatekeeper to Cloudflare
        if: steps.gate.outputs.deploy == 'true' && steps.fp.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}      # -> Worker secret HUB_TORN_KEY (OC data feed pull)
        run: tools/deploy_site.sh

      - name: Save site fingerprint
        if: steps.gate.outputs.deploy == 'true' && steps.fp.outputs.changed == 'true'
        run: |
          # OC storage not set up yet (Cloudflare token without D1 permission): save a fingerprint that never
          # matches, so the next update deploys again and retries the setup - stops once it's ready
          if [ "$(cat "$RUNNER_TEMP/oc_storage" 2>/dev/null)" = "off" ]; then
            echo "${{ steps.fp.outputs.fp }}:oc-off" > data/site_fingerprint.txt
          else
            echo "${{ steps.fp.outputs.fp }}" > data/site_fingerprint.txt
          fi
          cp "$RUNNER_TEMP/site_manifest.json" data/site_manifest.json     # per-file list, for checking what changed
          tools/store.sh save "Site fingerprint" data/site_fingerprint.txt data/site_manifest.json

      # Monthly (Nov 2026): squash the data repo's history to one commit so it stops growing - on the 1st of the
      # month, in the scheduled 03:00 TCT full update (quiet hour; this workflow's concurrency group means no other
      # site update is running). The previous history is kept on the "previous-history" branch until next month.
      - name: Monthly data history squash
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.scheduled == 'true' && steps.gate.outputs.kind == 'full'
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "03" ]; then tools/squash_data.sh; fi
