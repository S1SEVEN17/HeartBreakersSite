# Temporary: Discord ID check (counts / types only) - removed after one run
name: q
on: workflow_dispatch
permissions:
  contents: read
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOOK: ${{ secrets.DISCORD_WEBHOOK_CRIMES }}
        run: |
          cd gate && npm install --no-save --silent wrangler@4 >/dev/null 2>&1
          npx wrangler d1 execute hb-oc --remote --json --command "SELECT msg_id, created FROM oc_ping WHERE msg_id IS NOT NULL ORDER BY created" 2>/dev/null > /tmp/p.json
          node -e '
            const rows=JSON.parse(require("fs").readFileSync("/tmp/p.json","utf8"))[0].results;
            (async()=>{for(const r of rows){const u=new URL(process.env.HOOK.trim());u.pathname=u.pathname.replace(/\/$/,"")+"/messages/"+r.msg_id;
              const res=await fetch(u);const m=await res.json().catch(()=>({}));
              const ids=(m.content||"").match(/<@!?(\d+)>/g)||[];
              console.log("MSG", new Date(r.created).toISOString().slice(11,16), "status",res.status,"mention tokens",ids.length,"resolved mentions",(m.mentions||[]).length,
                "shape:", (m.content||"").replace(/\d{6,}/g,"#").replace(/\*\*[^*]+\*\*/g,"**x**").slice(0,90));}})()'
