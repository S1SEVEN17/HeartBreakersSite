# TEMPORARY (Nov 12 2026): size up tornprobability.com /api/scenarios?name= (recorded scenario outcomes) for payouts.
# Prints counts / reward stats only. Delete after use.
name: tp probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          B=https://tornprobability.com:3000
          for n in "Blast from the Past" "Stage Fright" "Crane Reaction" "Leave No Trace"; do
            curl -s -m 60 -G --data-urlencode "name=$n" "$B/api/scenarios" -o s.json -w "$n: %{http_code} %{size_download} bytes %{time_total}s\n"
            python3 - "$n" <<'PY'
          import json,sys,statistics as S
          try: d=json.load(open('s.json'))
          except Exception as e: print('  parse fail',e); sys.exit()
          print('  type',type(d).__name__,'records',len(d) if isinstance(d,list) else '-')
          if isinstance(d,list) and d:
              print('  keys',sorted(d[0].keys()))
              r=[x.get('rewards') or {} for x in d]
              m=[x.get('money') or 0 for x in r]; pos=[v for v in m if v>0]
              print('  money>0',len(pos),'min',min(pos) if pos else 0,'avg',int(S.mean(pos)) if pos else 0,'max',max(pos) if pos else 0)
              its=[x.get('items') for x in r if x.get('items')]
              print('  with items',len(its),'sample',json.dumps(its[:2])[:300])
              print('  scope sample',[x.get('scope') for x in r[:8]], 'respect', [x.get('respect') for x in r[:8]])
              other=[k for k in d[0].keys() if k not in('events','rewards')]
              print('  other fields sample',{k:d[0][k] for k in other if k!='_id'})
              ts=[x.get('createdAt') or x.get('date') or x.get('timestamp') for x in d[:3]]; print('  time fields',ts)
          PY
          done
