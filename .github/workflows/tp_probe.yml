# TEMPORARY (Nov 12 2026): find which tornprobability.com API the /scenarios page reads its payout data from.
# Prints endpoint paths and response shapes only. Delete after use.
name: tp probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          B=https://tornprobability.com:3000
          curl -s -m 20 -A "Mozilla/5.0" $B/scenarios -o page.html
          echo "---- page (scripts / fetch calls) ----"
          grep -oE "fetch\([^)]{0,160}" page.html | head -20
          grep -oE "/api/[A-Za-z0-9_/?=&.-]+" page.html | sort -u | head -30
          grep -oE '<script[^>]*src="[^"]+"' page.html | head
          echo "---- tries ----"
          for q in "scenarios?name=Blast%20from%20the%20Past" "scenarios?scenario=Blast%20from%20the%20Past" "scenarios/Blast%20from%20the%20Past" "scenarios?scenarioName=Blast%20from%20the%20Past"; do
            code=$(curl -s -m 20 -o r.json -w '%{http_code}' "$B/api/$q"); echo "$q -> $code $(wc -c < r.json)"; head -c 1500 r.json | tr '\n' ' '; echo
          done
