# Organized Crime check - every 15 minutes (RUN_KIND=crimes: overview post, delay pings, leader escalation).
# Data (alert state, Discord IDs, delay log) lives in the private data repo - see banner.yml.
name: Crime delay check

on:
  workflow_dispatch:           # every 15 min by the gatekeeper's Cloudflare timer (gate/worker.js scheduled)
    inputs:
      oc_refresh:                # "1" = started by OC Management's Refresh button: always rewrite data/oc_active.json
        required: false          #       (with a new time) so the page sees the check finished, even with no changes
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: crimes
  cancel-in-progress: false

env:
  DATA_REPO: S1SEVEN17/HeartBreakersLogo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the private data
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          path: store

      - name: Link data
        run: tools/store.sh link

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # the deployed OC plan (who's assigned to which role) for the Recruiting post - read from D1 (Nov 13 2026);
      # a failure just leaves the post without assignments
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read the OC plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd gate && npm install --no-save --silent wrangler@4 >/dev/null 2>&1 || true
          npx wrangler d1 execute hb-oc --remote --json --command "SELECT v FROM oc_config WHERE env = 'prod' AND k = 'plan'" 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s)[0].results[0];process.stdout.write(r?r.v:"")}catch(e){}})' > "$RUNNER_TEMP/oc_plan.json" || true
          echo "OC plan: $(wc -c < "$RUNNER_TEMP/oc_plan.json") bytes"

      - name: Check for delayed crimes
        env:
          OC_PLAN_FILE: ${{ runner.temp }}/oc_plan.json
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
          RUN_KIND: crimes
          OC_FORCE_ACTIVE: ${{ inputs.oc_refresh }}
          DISCORD_WEBHOOK_CRIMES: ${{ secrets.DISCORD_WEBHOOK_CRIMES }}
          DISCORD_WEBHOOK_LEADERS: ${{ secrets.DISCORD_WEBHOOK_LEADERS }}
          MEMBER_DIR: ${{ secrets.MEMBER_DIR }}
        run: python generate.py --out site

      - name: Save alert state
        run: >
          tools/store.sh save "Update crime alert state"
          data/discord_crime_state.json data/leader_alerts.json data/discord_messages_crimes.json
          data/item_names.json data/crime_delays.json data/oc_active.json data/oc_pool.json
