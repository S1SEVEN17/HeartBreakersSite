# Temporary: FFScouter CORS probe (no key used) - removed after one run
name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 20 -D - -o body.txt -H "Origin: https://hb.example" "https://ffscouter.com/api/v1/get-stats?key=invalidkey000000&targets=1" | grep -iE "^HTTP|access-control|content-type"
          head -c 200 body.txt; echo
          curl -sS -m 20 -D - -o /dev/null -X OPTIONS -H "Origin: https://hb.example" -H "Access-Control-Request-Method: GET" "https://ffscouter.com/api/v1/get-stats" | grep -iE "^HTTP|access-control"
