# OC Payout Optimizer storage check (manual, Nov 2026): how many members have shared pass rates in the D1
# database hb-oc, per env (test / prod), and how long ago the newest / oldest write was.
# PUBLIC LOG: counts and ages only - never names, player ids or rates.
name: OC storage check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Count shared rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir w && cd w && npm init -y >/dev/null && npm install --silent wrangler@4 >/dev/null 2>&1
          printf 'name = "oc-check"\ncompatibility_date = "2025-06-01"\n' > wrangler.toml
          if ! npx wrangler d1 execute hb-oc --remote --json --command \
              "SELECT env, COUNT(*) AS members, MAX(ts) AS newest, MIN(ts) AS oldest FROM oc_cpr GROUP BY env" > out.json 2> err.log; then
            echo "::error::couldn't query the database"; grep -iE "error|auth|not found" err.log | head -5; exit 1
          fi
          python3 - <<'PY'
          import json, time
          d = json.load(open("out.json"))
          rows = d[0]["results"] if isinstance(d, list) else d.get("results", [])
          now = time.time() * 1000
          def ago(t):
              if not t: return "-"
              m = (now - t) / 60000
              return f"{m:.0f} min ago" if m < 120 else f"{m / 60:.1f} h ago"
          print("Table oc_cpr exists.")
          if not rows: print("No pass rates stored yet (0 rows in test and prod).")
          for r in rows:
              print(f"env={r['env']}: {r['members']} member(s) sharing - newest write {ago(r['newest'])}, oldest {ago(r['oldest'])}")
          PY
      - name: OC data feed status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # dataset ages + sizes only (who wrote it: 'hub' or 'member' - never names)
          cd w
          npx wrangler d1 execute hb-oc --remote --json --command \
            "SELECT env, ds, as_of, CASE WHEN ds IN ('pull:errors', 'backfill') THEN data ELSE LENGTH(data) END AS bytes, CASE WHEN by = 'hub' THEN 'hub' ELSE 'member' END AS src FROM oc_snap WHERE env != 'hub' OR ds IN ('pull:errors', 'backfill') UNION ALL SELECT env, 'history', MAX(as_of), COUNT(*), 'rows' FROM oc_hist GROUP BY env ORDER BY 1, 2" > feed.json 2> err.log \
            || { echo "::warning::feed tables not there yet"; exit 0; }
          python3 - <<'PY'
          import json, time
          d = json.load(open("feed.json")); rows = d[0]["results"] if isinstance(d, list) else d.get("results", [])
          now = time.time() * 1000
          for r in rows:
              m = (now - (r["as_of"] or 0)) / 60000
              print(f"{r['env']:5} {r['ds']:8} {m:7.1f} min old  {r['bytes']:>8} {'rows' if r['src'] == 'rows' else 'bytes'}  ({r['src']})")
          if not rows: print("No feed data yet.")
          PY
      - name: Feed timer + key present?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # yes/no answers only - no values
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/hb-gate/schedules" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('timers:', [s.get('cron') for s in (d.get('result') or {}).get('schedules',[])], 'ok' if d.get('success') else d.get('errors'))"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/hb-gate/secrets" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('feed key set:', any(s.get('name')=='HUB_TORN_KEY' for s in (d.get('result') or [])), 'ok' if d.get('success') else d.get('errors'))"
      - name: Item prices coverage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # counts only: reward item ids in history vs priced (and priced at 0 = no market price)
          cd w
          npx wrangler d1 execute hb-oc --remote --json --command \
            "SELECT (SELECT COUNT(DISTINCT json_extract(j.value, '\$.id')) FROM oc_hist, json_each(oc_hist.data, '\$.rewards.items') AS j WHERE oc_hist.env = 'prod') AS ids, (SELECT COUNT(*) FROM oc_snap, json_each(oc_snap.data) WHERE oc_snap.env = 'prod' AND oc_snap.ds = 'prices') AS priced, (SELECT COUNT(*) FROM oc_snap, json_each(oc_snap.data) AS p WHERE oc_snap.env = 'prod' AND oc_snap.ds = 'prices' AND json_extract(p.value, '\$.price') = 0) AS zero" > pr.json 2> err.log \
            || { echo "::warning::couldn't read prices"; exit 0; }
          python3 -c "import json;d=json.load(open('pr.json'));r=(d[0]['results'] if isinstance(d,list) else d['results'])[0];print(f\"reward item ids in history: {r['ids']} · priced: {r['priced']} · priced at 0 (no market price): {r['zero']}\")"
          npx wrangler d1 execute hb-oc --remote --json --command \
            "SELECT p.key AS id, json_extract(p.value, '\$.name') AS name FROM oc_snap, json_each(oc_snap.data) AS p WHERE oc_snap.env = 'prod' AND oc_snap.ds = 'prices' AND json_extract(p.value, '\$.price') = 0" > z.json 2>/dev/null \
            && python3 -c "import json;d=json.load(open('z.json'));print('no market price:', ', '.join(f\"{r['name'] or '?'} [{r['id']}]\" for r in (d[0]['results'] if isinstance(d,list) else d['results'])) or '-')"
      - name: Deployed plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # counts only: teams live / spawn, members placed, when + by whom it last changed (auto or a leader's Deploy)
          cd w
          npx wrangler d1 execute hb-oc --remote --json --command \
            "SELECT ts, CASE WHEN by LIKE 'auto%' THEN 'auto (Hub)' ELSE 'a leader' END AS who, v, (SELECT data FROM oc_snap WHERE env = 'hub' AND ds = 'plan:stats') AS stats FROM oc_config WHERE env = 'prod' AND k = 'plan'" > plan.json 2>/dev/null || exit 0
          python3 - <<'PY'
          import json, time
          d = json.load(open("plan.json")); rows = d[0]["results"] if isinstance(d, list) else d.get("results", [])
          if not rows: print("No plan deployed yet."); raise SystemExit
          r = rows[0]; v = json.loads(r["v"] or "{}"); t = v.get("teams") or []
          live = sum(1 for x in t if x.get("kind") == "live"); placed = sum(1 for x in t for y in x.get("roles", []) if y.get("pid") and not y.get("existing")); queued = sum(1 for x in t for y in x.get("roles", []) if y.get("queued"))
          print(f"Plan: {len(t)} teams ({live} in recruiting crimes, {len(t) - live} to spawn) · {placed} members placed ({queued} queued) · "
                f"last change {(time.time() * 1000 - r['ts']) / 60000:.0f} min ago by {r['who']}" + (f" · planner {v['auto'].get('ms')} ms" if v.get('auto') else ""))
          # recruiting crimes the planner left open and why (crime names + rates only - no member names or IDs)
          ss = json.loads(r.get("stats") or "null") or {}
          print(f"  script data: pay per day for {len(ss.get('pay_day') or {})} crimes, required items for {sum(len(x) for x in (ss.get('items') or {}).values())} roles")
          for k in (json.loads(r.get("stats") or "null") or {}).get("rotation") or []:
              print(f"  rotation: {k.get('crime')} - pool {k.get('pool')} for {k.get('seats')} seats, up to {k.get('max')} at once, {k.get('live')} recruiting now")
          for k in (json.loads(r.get("stats") or "null") or v.get("auto") or {}).get("skipped") or []:
              print(f"  open: {k.get('crime')} [{k.get('filled')}] - {k.get('reason')}" + (f" · new members need avg {k['need']}% · in crime {k.get('inCrime')} · best per role {k.get('best')}" if k.get("need") is not None else ""))
          PY
      - name: Planning order probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Rotation planning (Nov 2026): does planning run in JOIN order? For each Planning/Recruiting crime, per slot
          # (slot order): join rank, hours since joining, planning progress. Crime names + numbers only - no member ids.
          cd w
          npx wrangler d1 execute hb-oc --remote --json --command \
            "SELECT data FROM oc_snap WHERE env = 'prod' AND ds = 'crimes'" > cr.json 2>/dev/null || exit 0
          python3 - <<'PY'
          import json, time
          d = json.load(open("cr.json")); rows = d[0]["results"] if isinstance(d, list) else d.get("results", [])
          if not rows: print("no crimes"); raise SystemExit
          crimes = json.loads(rows[0]["data"]); now = time.time()
          keys = set()
          for c in crimes:
              for s in c.get("slots") or []:
                  if s.get("user"): keys |= set(s["user"].keys())
          print("slot.user fields:", sorted(keys))
          for c in crimes:
              if c.get("status") not in ("Planning", "Recruiting"): continue
              us = [(i, s["user"]) for i, s in enumerate(c.get("slots") or []) if s.get("user")]
              if len(us) < 2: continue
              order = sorted(us, key=lambda x: x[1].get("joined_at") or 0)
              rank = {i: k + 1 for k, (i, _) in enumerate(order)}
              ra = c.get("ready_at")
              print(f"{c['status']:10} {c['name']:26} ready in {((ra or now) - now) / 3600:6.1f}h  slots " + " | ".join(
                  f"#{i + 1}: join{rank[i]} {(now - (u.get('joined_at') or now)) / 3600:5.1f}h ago prog {u.get('progress')}" for i, u in us))
          PY
