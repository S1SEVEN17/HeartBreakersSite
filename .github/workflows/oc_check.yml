# OC Payout Optimizer storage check (manual, Nov 2026): how many members have shared pass rates in the D1
# database hb-oc, per env (test / prod), and how long ago the newest / oldest write was.
# PUBLIC LOG: counts and ages only - never names, player ids or rates.
name: OC storage check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Count shared rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir w && cd w && npm init -y >/dev/null && npm install --silent wrangler@4 >/dev/null 2>&1
          printf 'name = "oc-check"\ncompatibility_date = "2025-06-01"\n' > wrangler.toml
          if ! npx wrangler d1 execute hb-oc --remote --json --command \
              "SELECT env, COUNT(*) AS members, MAX(ts) AS newest, MIN(ts) AS oldest FROM oc_cpr GROUP BY env" > out.json 2> err.log; then
            echo "::error::couldn't query the database"; grep -iE "error|auth|not found" err.log | head -5; exit 1
          fi
          python3 - <<'PY'
          import json, time
          d = json.load(open("out.json"))
          rows = d[0]["results"] if isinstance(d, list) else d.get("results", [])
          now = time.time() * 1000
          def ago(t):
              if not t: return "-"
              m = (now - t) / 60000
              return f"{m:.0f} min ago" if m < 120 else f"{m / 60:.1f} h ago"
          print("Table oc_cpr exists.")
          if not rows: print("No pass rates stored yet (0 rows in test and prod).")
          for r in rows:
              print(f"env={r['env']}: {r['members']} member(s) sharing - newest write {ago(r['newest'])}, oldest {ago(r['oldest'])}")
          PY
      - name: OC data feed status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # dataset ages + sizes only (who wrote it: 'hub' or 'member' - never names)
          cd w
          npx wrangler d1 execute hb-oc --remote --json --command \
            "SELECT env, ds, as_of, CASE WHEN ds IN ('pull:errors', 'backfill') THEN data ELSE LENGTH(data) END AS bytes, CASE WHEN by = 'hub' THEN 'hub' ELSE 'member' END AS src FROM oc_snap WHERE env != 'hub' OR ds IN ('pull:errors', 'backfill') UNION ALL SELECT env, 'history', MAX(as_of), COUNT(*), 'rows' FROM oc_hist GROUP BY env ORDER BY 1, 2" > feed.json 2> err.log \
            || { echo "::warning::feed tables not there yet"; exit 0; }
          python3 - <<'PY'
          import json, time
          d = json.load(open("feed.json")); rows = d[0]["results"] if isinstance(d, list) else d.get("results", [])
          now = time.time() * 1000
          for r in rows:
              m = (now - (r["as_of"] or 0)) / 60000
              print(f"{r['env']:5} {r['ds']:8} {m:7.1f} min old  {r['bytes']:>8} {'rows' if r['src'] == 'rows' else 'bytes'}  ({r['src']})")
          if not rows: print("No feed data yet.")
          PY
      - name: Chain Watch Discord pings waiting to be deleted
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # counts only (no message ids, no webhook)
          cd w
          npx wrangler d1 execute hb-oc --remote --json --command \
            "SELECT COUNT(*) AS n, SUM(CASE WHEN end_at <= unixepoch() THEN 1 ELSE 0 END) AS due, MAX(tries) AS tries, (SELECT COUNT(*) FROM cw_att) AS att FROM cw_ping" > ping.json 2> /dev/null \
            || { echo "cw_ping table not there yet"; exit 0; }
          python3 -c "import json; d=json.load(open('ping.json')); r=(d[0] if isinstance(d,list) else d)['results'][0]; print(f\"shift pings kept: {r['n']} (slot ended, awaiting delete: {r['due'] or 0}, max tries: {r['tries'] or 0}); shift attendance rows: {r['att']}\")"
      - name: Torn chain timer fields (numbers only - timeout vs end vs server clock)
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        run: |
          # API: Heart Breakers Hub - chain timer check (faction/chain, key in the Authorization header, never printed)
          for i in 1 2 3; do
            curl -s -D h.txt -H "Authorization: ApiKey ${TORN_API_KEY}" \
              "https://api.torn.com/v2/faction/chain?comment=Heart%20Breakers%20Hub" -o c.json
            python3 - <<'PY'
          import json, email.utils, time
          d = json.load(open("c.json")); c = d.get("chain") or {}
          hdr = {l.split(":",1)[0].lower(): l.split(":",1)[1].strip() for l in open("h.txt") if ":" in l}
          srv = int(email.utils.parsedate_to_datetime(hdr["date"]).timestamp()) if "date" in hdr else None
          print("chain fields:", sorted(c.keys()), "| current", c.get("current"), "timeout", c.get("timeout"),
                "start", c.get("start"), "end", c.get("end"), "cooldown", c.get("cooldown"),
                "| server now", srv, "| local now", int(time.time()),
                "| end - server now", (c.get("end") - srv) if (c.get("end") and srv) else None,
                "| cache-control", hdr.get("cache-control"), "age", hdr.get("age"), "error" if d.get("error") else "")
          PY
            sleep 4
          done
      - name: Chain Watch saved settings (alert numbers only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd w
          npx wrangler d1 execute hb-oc --remote --json --command \
            "SELECT v, ts FROM oc_config WHERE env = 'prod' AND k = 'chainwatch'" > cwcfg.json 2> /dev/null || { echo "no saved settings"; exit 0; }
          python3 -c "import json; d=json.load(open('cwcfg.json')); r=((d[0] if isinstance(d,list) else d)['results'] or [{}])[0]; v=json.loads(r.get('v') or '{}'); print('saved chainwatch settings:', {k: v.get(k) for k in ('minChain','topAlertSeconds','restAlertSeconds','thirdAlertSeconds','firstAlertPrimaryOnly','bonusWarnHits')}, 'saved at', r.get('ts'))"
      - name: Feed timer + key present?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # yes/no answers only - no values
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/hb-gate/schedules" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('timers:', [s.get('cron') for s in (d.get('result') or {}).get('schedules',[])], 'ok' if d.get('success') else d.get('errors'))"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/hb-gate/secrets" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('feed key set:', any(s.get('name')=='HUB_TORN_KEY' for s in (d.get('result') or [])), 'ok' if d.get('success') else d.get('errors'))"
      - name: Item prices coverage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # counts only: reward item ids in history vs priced (and priced at 0 = no market price)
          cd w
          npx wrangler d1 execute hb-oc --remote --json --command \
            "SELECT (SELECT COUNT(DISTINCT json_extract(j.value, '\$.id')) FROM oc_hist, json_each(oc_hist.data, '\$.rewards.items') AS j WHERE oc_hist.env = 'prod') AS ids, (SELECT COUNT(*) FROM oc_snap, json_each(oc_snap.data) WHERE oc_snap.env = 'prod' AND oc_snap.ds = 'prices') AS priced, (SELECT COUNT(*) FROM oc_snap, json_each(oc_snap.data) AS p WHERE oc_snap.env = 'prod' AND oc_snap.ds = 'prices' AND json_extract(p.value, '\$.price') = 0) AS zero" > pr.json 2> err.log \
            || { echo "::warning::couldn't read prices"; exit 0; }
          python3 -c "import json;d=json.load(open('pr.json'));r=(d[0]['results'] if isinstance(d,list) else d['results'])[0];print(f\"reward item ids in history: {r['ids']} · priced: {r['priced']} · priced at 0 (no market price): {r['zero']}\")"
          npx wrangler d1 execute hb-oc --remote --json --command \
            "SELECT p.key AS id, json_extract(p.value, '\$.name') AS name FROM oc_snap, json_each(oc_snap.data) AS p WHERE oc_snap.env = 'prod' AND oc_snap.ds = 'prices' AND json_extract(p.value, '\$.price') = 0" > z.json 2>/dev/null \
            && python3 -c "import json;d=json.load(open('z.json'));print('no market price:', ', '.join(f\"{r['name'] or '?'} [{r['id']}]\" for r in (d[0]['results'] if isinstance(d,list) else d['results'])) or '-')"
      - name: Automatic team building (setting + last runs)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # is the Hub's automatic planner on, and did it run? counts / times only (no names)
          cd w
          npx wrangler d1 execute hb-oc --remote --json --command \
            "SELECT (SELECT v FROM oc_config WHERE env = 'prod' AND k = 'opts') AS opts, (SELECT ts FROM oc_config WHERE env = 'prod' AND k = 'opts') AS opts_ts, (SELECT CASE WHEN by LIKE 'auto%' THEN 'auto' ELSE 'a leader' END FROM oc_config WHERE env = 'prod' AND k = 'opts') AS opts_by, (SELECT as_of FROM oc_snap WHERE env = 'hub' AND ds = 'plan:stats') AS stats_at, (SELECT as_of FROM oc_snap WHERE env = 'prod' AND ds = 'crimes') AS crimes_at, (SELECT as_of FROM oc_snap WHERE env = 'hub' AND ds = 'plan:reconfigured') AS reconf_at" > auto.json 2>/dev/null || exit 0
          python3 - <<'PY'
          import json, time
          d = json.load(open("auto.json")); r = (d[0]["results"] if isinstance(d, list) else d.get("results", []))[0]
          now = time.time() * 1000
          o = json.loads(r["opts"] or "{}")
          age = lambda t: ("%.1f min ago" % ((now - float(t)) / 60000)) if t else "never"
          print("Automatic:", "OFF" if o.get("auto") is False else "on", "| settings saved", age(r["opts_ts"]), "by", r["opts_by"] or "-",
                "| includeBusy (drafts):", bool(o.get("includeBusy")), "| queueHours:", o.get("queueHours"))
          print("Planner last ran:", age(r["stats_at"]), "| crimes feed:", age(r["crimes_at"]), "| last reconfigure:", age(r["reconf_at"]))
          PY
      - name: Deployed plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # counts only: teams live / spawn, members placed, when + by whom it last changed (auto or a leader's Deploy)
          cd w
          npx wrangler d1 execute hb-oc --remote --json --command \
            "SELECT ts, CASE WHEN by LIKE 'auto%' THEN 'auto (Hub)' ELSE 'a leader' END AS who, v, (SELECT data FROM oc_snap WHERE env = 'hub' AND ds = 'plan:stats') AS stats, (SELECT data FROM oc_snap WHERE env = 'hub' AND ds = 'delay-stats') AS dl FROM oc_config WHERE env = 'prod' AND k = 'plan'" > plan.json 2>/dev/null || exit 0
          python3 - <<'PY'
          import json, time
          d = json.load(open("plan.json")); rows = d[0]["results"] if isinstance(d, list) else d.get("results", [])
          if not rows: print("No plan deployed yet."); raise SystemExit
          r = rows[0]; v = json.loads(r["v"] or "{}"); t = v.get("teams") or []
          live = sum(1 for x in t if x.get("kind") == "live"); placed = sum(1 for x in t for y in x.get("roles", []) if y.get("pid") and not y.get("existing")); queued = sum(1 for x in t for y in x.get("roles", []) if y.get("queued"))
          print(f"Plan: {len(t)} teams ({live} in recruiting crimes, {len(t) - live} to spawn) · {placed} members placed ({queued} queued) · "
                f"last change {(time.time() * 1000 - r['ts']) / 60000:.0f} min ago by {r['who']}" + (f" · planner {v['auto'].get('ms')} ms" if v.get('auto') else ""))
          # every team: crime, Torn crime id, kind, slots in the crime / planned / queued / empty (no names or ids of members)
          for x in t:
              ro = x.get("roles", [])
              print(f"  team: {x.get('crime')} #{x.get('crime_id') or '-'} {x.get('kind')} · in crime {sum(1 for y in ro if y.get('existing'))} · planned {sum(1 for y in ro if y.get('pid') and not y.get('existing') and not y.get('queued'))} · queued {sum(1 for y in ro if y.get('queued'))} · empty {sum(1 for y in ro if not y.get('pid'))}")
          # recruiting crimes the planner left open and why (crime names + rates only - no member names or IDs)
          ss = json.loads(r.get("stats") or "null") or {}
          dl = json.loads(r.get("dl") or "null") or {}
          print(f"  delay record: {len(dl)} members held up a crime in 30 days, {sum(1 for x in dl.values() if x.get('long'))} for 2h+")
          print(f"  script data: pay per day for {len(ss.get('pay_day') or {})} crimes, required items for {sum(len(x) for x in (ss.get('items') or {}).values())} roles")
          print(f"  pay ranges for {len(ss.get('pay_day_min') or {})} crimes")
          for k in (json.loads(r.get("stats") or "null") or {}).get("rotation") or []:
              print(f"  rotation: {k.get('crime')} - pool {k.get('pool')} for {k.get('seats')} seats, up to {k.get('max')} at once, {k.get('live')} recruiting now")
          for k in (json.loads(r.get("stats") or "null") or v.get("auto") or {}).get("skipped") or []:
              print(f"  open: {k.get('crime')} [{k.get('filled')}] - {k.get('reason')}" + (f" · new members need avg {k['need']}% · in crime {k.get('inCrime')} · best per role {k.get('best')}" if k.get("need") is not None else ""))
          PY
      - name: Planning order probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Rotation planning (Nov 2026): does planning run in JOIN order? For each Planning/Recruiting crime, per slot
          # (slot order): join rank, hours since joining, planning progress. Crime names + numbers only - no member ids.
          cd w
          npx wrangler d1 execute hb-oc --remote --json --command \
            "SELECT data FROM oc_snap WHERE env = 'prod' AND ds = 'crimes'" > cr.json 2>/dev/null || exit 0
          python3 - <<'PY'
          import json, time
          d = json.load(open("cr.json")); rows = d[0]["results"] if isinstance(d, list) else d.get("results", [])
          if not rows: print("no crimes"); raise SystemExit
          crimes = json.loads(rows[0]["data"]); now = time.time()
          keys = set()
          for c in crimes:
              for s in c.get("slots") or []:
                  if s.get("user"): keys |= set(s["user"].keys())
          print("slot.user fields:", sorted(keys))
          for c in crimes:
              if c.get("status") not in ("Planning", "Recruiting"): continue
              us = [(i, s["user"]) for i, s in enumerate(c.get("slots") or []) if s.get("user")]
              if len(us) < 2: continue
              order = sorted(us, key=lambda x: x[1].get("joined_at") or 0)
              rank = {i: k + 1 for k, (i, _) in enumerate(order)}
              ra = c.get("ready_at")
              print(f"{c['status']:10} {c['name']:26} ready in {((ra or now) - now) / 3600:6.1f}h  slots " + " | ".join(
                  f"#{i + 1}: join{rank[i]} {(now - (u.get('joined_at') or now)) / 3600:5.1f}h ago prog {u.get('progress')}" for i, u in us))
          PY
      - name: Net payout values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # net-payout addendum (Nov 2026): how many crimes in the summaries carry valueMin/Avg/Max - counts only
          cd w
          npx wrangler d1 execute hb-oc --remote --json --command \
            "SELECT as_of, data FROM oc_snap WHERE env = 'prod' AND ds = 'summaries'" > su.json 2>/dev/null || exit 0
          python3 - <<'PY'
          import json, time
          d = json.load(open("su.json")); rows = d[0]["results"] if isinstance(d, list) else d.get("results", [])
          if not rows: print("no summaries"); raise SystemExit
          p = json.loads(rows[0]["data"]).get("payouts") or {}
          n = sum(1 for x in p.values() if x.get("valueMax") is not None); ib = sum(1 for x in p.values() if x.get("itemBased") and (x.get("valueMax") or 0) > 0)
          print(f"summaries {(time.time() * 1000 - rows[0]['as_of']) / 60000:.0f} min old: {len(p)} crimes, {n} with net values, {ib} item-reward crimes valued")
          PY
      - name: Identity check (status codes only)
        run: |
          # client-reported identity (Nov 2026): a roster member 200, unknown pid 403, wrong faction 403
          B=https://hb-gate.heartbreakers.workers.dev
          for body in '{"pid":974757,"faction":51384,"env":"prod"}' '{"pid":1,"faction":51384,"env":"prod"}' '{"pid":974757,"faction":1,"env":"prod"}'; do
            code=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST $B/oc/plan -H 'Content-Type: application/json' -d "$body")
            ok=$(python3 -c "import json;d=json.load(open('/tmp/r.json'));print(d.get('ok'), (d.get('error') or '')[:60], 'teams=%s' % len(d.get('teams') or []))" 2>/dev/null)
            echo "plan $code $ok"
            [ "$code" = 200 ] && cp /tmp/r.json /tmp/plan_ok.json
          done
          # live-instance binding (crime-id addendum): per crime, teams bound to an instance vs instances vs left as spawn
          python3 - <<'PY'
          import json, collections
          d = json.load(open('/tmp/plan_ok.json')); by = collections.defaultdict(lambda: [0, 0, set()])
          for t in d.get('teams') or []:
              b = by[t['crime']]
              if t.get('crime_id'): b[0] += 1; b[2].add(t['crime_id'])
              else: b[1] += 1
          dup = any(len(v[2]) != v[0] for v in by.values())
          import time
          w = d.get('weights_at'); tw = [t.get('success_weighted') for t in d.get('teams') or [] if t.get('success_weighted') is not None]
          print('weights:', ('fetched %.1f h ago' % ((time.time()*1000 - w) / 3600e3)) if w else 'none yet', '| teams with weighted success:', len(tw),
                '| with calculated success:', sum(1 for t in d.get('teams') or [] if t.get('success')))
          print('binding:', '; '.join('%s live %d spawn %d' % (k, v[0], v[1]) for k, v in sorted(by.items())), '| shared ids:', dup)
          PY
      - name: Chain Watch check (status codes + counts only)
        run: |
          # /cw/hello: member 200 (+ token, never printed), unknown pid 403, wrong faction 403; then one /cw/sync snapshot
          B=https://hb-gate.heartbreakers.workers.dev
          for body in '{"pid":974757,"faction":51384,"name":"check"}' '{"pid":1,"faction":51384,"name":"x"}' '{"pid":974757,"faction":1,"name":"x"}'; do
            code=$(curl -s -o /tmp/h.json -w "%{http_code}" -X POST $B/cw/hello -H 'Content-Type: application/json' -d "$body")
            python3 -c "import json;d=json.load(open('/tmp/h.json'));print('hello', '$code', d.get('ok'), d.get('error') or '', 'leader=%s' % d.get('is_leader'), 'token=%s' % bool(d.get('token')))" 2>/dev/null || echo "hello $code (not json)"
            [ "$code" = 200 ] && cp /tmp/h.json /tmp/good.json
          done
          python3 - <<'PY' > /tmp/sync.json
          import json; print(json.dumps({"token": json.load(open("/tmp/good.json")).get("token", ""), "out": []}))
          PY
          curl -s -o /dev/null -X POST $B/cw/sync -H 'Content-Type: application/json' --data @/tmp/sync.json
          sleep 8   # the room's first Torn reads (chain / members) run ~1 s after a device appears
          code=$(curl -s -o /tmp/s.json -w "%{http_code}" -X POST $B/cw/sync -H 'Content-Type: application/json' --data @/tmp/sync.json)
          python3 -c "
          import json; d=json.load(open('/tmp/s.json')); s=(d.get('in') or [{}])[0]
          c=s.get('chain') or {}
          print('sync', '$code', d.get('ok'), s.get('t'), 'chain=%s src=%s' % (c.get('current'), c.get('src')), 'queue=%d' % len(s.get('queue') or []),
                'retals=%d' % len(s.get('retals') or []), 'mode=%s' % s.get('mode'), 'minChain=%s' % (s.get('config') or {}).get('minChain'),
                'leader=%s' % (s.get('me') or {}).get('is_leader'),
                'hub_timer_left=%s' % (round((c.get('expires_at') - s.get('now')) / 1000) if c.get('expires_at') and s.get('now') else None),
                'hub_now=%s' % (int(s.get('now') / 1000) if s.get('now') else None),
                'schedule=%s' % ('none' if s.get('schedule') is None else len((s.get('schedule') or {}).get('shifts') or [])))" || echo "sync $code (not json)"
          rm -f /tmp/h.json /tmp/good.json /tmp/sync.json /tmp/s.json
          # homepage "Right Now" chain readings: signed-in members only (expect 401 here, no pass)
          echo "homepage reading without sign-in: $(curl -s -o /dev/null -w '%{http_code}' -X POST $B/m/cw/reading -H 'Content-Type: application/json' -d '{"current":10,"timeout":200}')"
          # Chain Watching Schedule: signed-in members only (expect 401 here)
          echo "schedule without sign-in: $(curl -s -o /dev/null -w '%{http_code}' $B/m/cw/schedule.json)"
          echo "live board without sign-in: $(curl -s -o /dev/null -w '%{http_code}' $B/m/cw/live.json)"
          echo "scripts list without sign-in: $(curl -s -o /dev/null -w '%{http_code}' $B/m/scripts.json)"
          # Heart Breakers Hub userscript (/sx): no session / a bad one -> 401; hello: wrong faction / not a member -> 403
          echo "hub script without code: $(curl -s -o /dev/null -w '%{http_code}' -X POST $B/sx -H 'Content-Type: application/json' -d '{"op":"whoami"}')"
          echo "hub script bad code: $(curl -s -o /dev/null -w '%{http_code}' -X POST $B/sx -H 'Content-Type: application/json' -d '{"op":"whoami","code":"hbsx2.1.1.x"}')"
          echo "hub script hello wrong faction: $(curl -s -o /dev/null -w '%{http_code}' -X POST $B/sx -H 'Content-Type: application/json' -d '{"op":"hello","pid":1,"faction":1}')"
          echo "hub script hello not a member: $(curl -s -o /dev/null -w '%{http_code}' -X POST $B/sx -H 'Content-Type: application/json' -d '{"op":"hello","pid":1,"faction":51384}')"
          echo "hub script GET: $(curl -s -o /dev/null -w '%{http_code}' $B/sx)"
          # signed-in reads (Hub script v2): one session from a client-reported identity (the Hub's own leader), then
          # status codes + counts only - the session itself is never printed
          SXC=$(curl -s -X POST $B/sx -H 'Content-Type: application/json' -d '{"op":"hello","pid":974757,"faction":51384,"name":"check"}' | python3 -c "import sys,json; print(json.load(sys.stdin).get('code',''))" 2>/dev/null)
          sx() { curl -s -o /tmp/sx.json -w '%{http_code}' -X POST $B/sx -H 'Content-Type: application/json' -d "{\"code\":\"$SXC\",$1}"; }
          echo "hub script session: $([ -n "$SXC" ] && echo yes || echo no)"
          echo "hub script feed: $(sx '"op":"read","area":"m","path":"db/script_feed.json"') wars=$(python3 -c "import json; d=json.load(open('/tmp/sx.json')); print(len(d.get('wars',[])), 'chains', len(d.get('chains',[])), 'recaps', len(d.get('recaps',[])))" 2>/dev/null)"
          echo "hub script armory: $(sx '"op":"read","area":"l","path":"db/armory.json"')  payout cfg: $(sx '"op":"read","area":"l","path":"db/payout_cfg.json"')  payout index: $(sx '"op":"read","area":"l","path":"payout_data/index.json"')"
          echo "hub script mine: $(sx '"op":"mine"')  board: $(sx '"op":"live","what":"board"')  schedule: $(sx '"op":"live","what":"schedule"')  scripts: $(sx '"op":"live","what":"scripts"')  config: $(sx '"op":"gh","method":"GET","path":"config.json","ref":"main"')"
          echo "hub script bad path: $(sx '"op":"read","area":"m","path":"../x.json"')"
          echo "hub script share_get: $(sx '"op":"share_get"')  share_ping: $(sx '"op":"share_ping"')  export without proof: $(curl -s -o /dev/null -w '%{http_code}' $B/sx/export)"
          echo "hub script scripts from Greasy Fork: $(sx '"op":"live","what":"scripts"' >/dev/null; python3 -c "import json,urllib.parse as u; d=json.load(open('/tmp/sx.json')); s=d.get('scripts',[]); print(sum(1 for x in s if x.get('gf')), 'of', len(s), 'install hosts:', sorted({u.urlsplit(x.get('install_url') or '').netloc or 'none' for x in s}), 'paths:', sorted({'/'.join(u.urlsplit(x.get('install_url') or '').path.split('/')[:3]) for x in s}), 'errors:', sorted({x.get('gf_err') for x in s if x.get('gf_err')}))" 2>/dev/null)"
          echo "hub script news lists: $(sx '"op":"read","area":"m","path":"db/script_feed.json"' >/dev/null; python3 -c "import json; d=json.load(open('/tmp/sx.json')); print({k: len(d.get(k) or []) for k in ('newsletters','war_reports','chain_reports','payouts','recap_items')})" 2>/dev/null)"
          echo "hub script loans: $(sx '"op":"read","area":"l","path":"db/armory.json"' >/dev/null; python3 -c "import json; d=json.load(open('/tmp/sx.json')); l=d.get('loans') or {}; print(len(l), 'members,', sum(len(v) for m in l.values() for v in m.values()), 'items, read at', d.get('loans_at'))" 2>/dev/null)"
          echo "hub script sharing sources: $(sx '"op":"read","area":"l","path":"db/private.json"' >/dev/null; python3 -c "import json,collections; d=json.load(open('/tmp/sx.json')); v=[(x.get('optin') or {}).get('via') for x in (d.get('members') or {}).values()]; v=[x for x in v if x]; c=collections.Counter(s for x in v for s in set(t for l in x.values() for t in l)); print(len(v), 'members with sources', dict(c))" 2>/dev/null)"
          echo "hub script levels: $(sx '"op":"read","area":"m","path":"db/members.json"' >/dev/null; python3 -c "import json; d=json.load(open('/tmp/sx.json')); c=[m for m in d.get('members',[]) if m.get('current')]; print(sum(1 for m in c if m.get('level') is not None), 'of', len(c), 'current members have a level')" 2>/dev/null)"
          rm -f /tmp/sx.json
