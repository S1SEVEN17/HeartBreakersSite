# Heart Breakers gatekeeper + site - deployed by tools/deploy_site.sh (from the "Faction banner" workflow).
# The built site (site/) is uploaded WITH the worker as static assets; run_worker_first sends every request
# through worker.js, so nothing in site/ can be opened without passing the gate.
name = "hb-gate"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"          # exact paths only (worker.js adds index.html itself)
not_found_handling = "none"

# timer that starts the update workflows (see worker.js scheduled)
[triggers]
crons = ["0,15,30,45 * * * *", "7,22,37,52 * * * *", "*/3 * * * *"]   # last: OC data feed pull (worker.js ocFeedPull)

[vars]
FACTION_ID = "51384"
# LEADER_POSITIONS comes from config.json gate.leader_positions (passed by the deploy)
# Secrets (wrangler secret put, by the Gatekeeper secrets workflow): MEMBER_DIR, LEADER_DIR, SESSION_SECRET (optional)

# Faction Chain Watch (Nov 2026): one ChainRoom Durable Object per faction (gate/chainroom.js). SQLite-backed,
# which is what the Workers Free plan allows. The migration tag must never change once deployed.
[[durable_objects.bindings]]
name = "CHAINROOM"
class_name = "ChainRoom"

[[migrations]]
tag = "v-chainwatch-1"
new_sqlite_classes = ["ChainRoom"]
