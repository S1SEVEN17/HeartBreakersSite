<title>OC Management - Heart Breakers</title>
<!--
  OC MANAGEMENT (leaders' folder: oc.html, published by generate.py write_oc_management). Nov 2026.
  Three tabs:
    CRIMES       turn each Organized Crime on/off for the OC Optimizer script's suggestions (saved as the 'disabled'
                 list - the script reads it from the gatekeeper's POST /oc/plan and stops suggesting those crimes)
    TEAM BUILDER build teams here, then DEPLOY them: every member on a deployed team is told by the script which crime
                 and role leadership assigned them (POST /oc/plan returns ONLY the caller's own assignment).
                 Ported from the OC Optimizer's Team Builder simulator (exact crime+role rates only, each member used
                 once across the board) plus an automatic multi-team builder:
                   for each crime that's switched on, HARDEST first: build the best possible team from the members
                   still free (maximise the team's WEIGHTED success - role weights, Nov 2026 - every role at or above
                   "Lowest role %"); keep it if it reaches the target (default 75%), then try another team of the same crime;
                   when it can't, move to the next-hardest crime. So the hardest crimes get the strongest members, and
                   as many teams as the faction can staff at 75%+ are built.
                 Crimes with a prerequisite (e.g. Bidding War after No Reserve) are only auto-built when "Include chain
                 finals" is on - they can only start after their prerequisite. Locked teams (🔒) are kept by Auto-build.
    DEPLOYED     the plan that's live for the script, with each member's progress from the active crimes
                 (✅ in their assigned role · ⏳ not joined yet · 🕒 queued - joins when their current crime pays out · ⚠️ in a different crime).
  PASS RATES (a member's checkpoint pass rate for one crime + role - the same "Crime|Role" keys as the script):
    live      the OC Optimizer's shared rates (D1, /l/oc/rates.json) + members' rates in the active crimes right now
    history   their latest rate for that crime + role from completed crimes (CFG.hist, rebuilt every full update)
    A rate in a crime they're in now wins; otherwise the NEWEST of shared and history (no age limit, Nov 2026). Members with no rate for a crime + role
    are never placed in it (a rate from an easier crime would overstate what they'd manage).
  BUSY: members already in an active crime are left out (unless queued). The old "Include members already in a crime"
  draft option was REMOVED (Nov 11 2026, user) - OPT.includeBusy is always false, same as the automatic assignment.
  ENV: always prod (LIVE) - the Test data set was removed when the OC tools went live (Nov 2026). The Worker still
  keeps a separate 'test' env for the script's test fork; this page no longer shows or edits it.
  Data: CFG (__CONFIG__: catalog, hist, members, ghproxy) + live reads through the gatekeeper (leaders' pass):
    oc/config.json?env=  oc/rates.json?env=  (D1)   and   data/oc_active.json + data/oc_pool.json (leaders' gh/contents proxy).
    🔄 Refresh: POST oc/refresh (once a minute) starts a crime check that rewrites both files; the page polls for them.
  The working board (draft) is kept in this browser only until it's deployed. __MENU__ = the site menu.
-->

__MENU__
<h1>OC Management</h1>
<div class="sub">Choose which crimes the OC Optimizer suggests, build teams and deploy them to members using the script</div>
<div class="bar"><button id="refresh" style="margin-left:auto" title="Re-check Torn now: members, active crimes, newly completed crimes, shared rates and the deployed plan (once a minute)">🔄 Refresh</button></div>
<div class="status" id="st">Loading…</div>
<div class="tabs"><button data-tab="crimes">🕵️ Crimes</button><button data-tab="builder">🧩 Team Builder</button><button data-tab="deployed">🚀 Deployed</button><button data-tab="sharing">📡 Rate sharing</button></div>
<div id="view"></div>
<script>
// ---- shared OC team planner (gate/oc_planner.js, inlined by generate.py) ----
/*__PLANNER__*/
</script>
<script>
const CFG = __CONFIG__;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const LS = {get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
            set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
// "Muscle #2" -> "Muscle" (the script's baseRole - one rate per role)
const baseRole = l => String(l || "").replace(/#\s*\d+/g, "").replace(/\s+/g, " ").trim();
const rkey = (crime, pos) => crime + "|" + baseRole(pos);
const nameOf = pid => CFG.members[String(pid)] || ("[" + pid + "]");
const col = r => r == null ? "" : r >= 75 ? "ok" : r >= 65 ? "mid" : "bad";
const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); return m < 60 ? m + " min ago" : m < 2880 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " days ago"; };

const ENV = "prod";
let TAB = LS.get("hb_oc_tab", "builder");
let D = {config: {disabled: [], plan: null}, rates: {}, active: [], activeT: null};
const OPT = Object.assign({target: 75, minRole: 65, cap: 85, includeBusy: false, chains: false, share: null, queueHours: 12, auto: true, autoMinutes: 3}, LS.get("hb_oc_opts", {}));
OPT.includeBusy = false;          // option removed (Nov 11 2026) - a saved "on" from before is ignored
// settings are kept in this browser AND saved for the gatekeeper's automatic plan (oc_config 'opts'), so the live
// plan uses the same target / lowest role / cap / chains / busy rules
let optTimer = null;
const saveOpts = () => { LS.set("hb_oc_opts", OPT); clearTimeout(optTimer);
  optTimer = setTimeout(() => saveConfig("opts", OPT).catch(e => st("Settings not saved for the live plan: " + e.message, true)), 800); };
const boardKey = () => "hb_oc_board_" + ENV;
// a draft built on the old Test data set carries over once (Test was removed - Nov 2026)
if (!LS.get(boardKey(), null) && LS.get("hb_oc_board_test", null)) LS.set(boardKey(), LS.get("hb_oc_board_test", {teams: []}));
let BOARD = LS.get(boardKey(), {teams: []});
const saveBoard = () => LS.set(boardKey(), BOARD);
const st = (m, err) => { $("st").textContent = m; $("st").classList.toggle("err", !!err); };

// ---------- data ----------
async function getJSON(u) { const r = await fetch(u, {cache: "no-store"}); if (!r.ok) throw new Error(u.split("?")[0] + " " + r.status); return r.json(); }
// a data-repo file through the leaders' gh/contents proxy (base64 JSON) -> object, or null
async function ghJSON(path) {
  try {
    const r = await fetch(CFG.ghproxy + path + "?ref=" + CFG.branch, {cache: "no-store"});
    if (!r.ok) return null;
    const j = await r.json();
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(String(j.content || "").replace(/\n/g, "")), c => c.charCodeAt(0))));
  } catch (e) { return null; }
}
async function load() {
  st("Loading…");
  try {
    const [cfg, rates, act, pool, feed, sums] = await Promise.all([
      getJSON("oc/config.json?env=" + ENV), getJSON("oc/rates.json?env=" + ENV),
      // active crimes (who's in what, right now) - the crime check saves it every 15 minutes
      ghJSON("data/oc_active.json"),
      // members + history rates from the last Refresh - used when newer than the copy built into this page
      ghJSON("data/oc_pool.json"),
      // the OC data feed's crimes (recruiting + planning, every 3 minutes) - "needs to be spawned" warnings
      getJSON("oc/crimes.json?env=" + ENV).catch(() => null),
      // payout summaries + item prices (the script's data - pay per day shown here matches the script)
      getJSON("oc/summaries.json?env=" + ENV).catch(() => null)]);
    D.sums = (sums && sums.summaries) || null; D.prices = (sums && sums.prices) || {};
    D.config = cfg; D.rates = rates || {};
    if (cfg.opts && typeof cfg.opts === "object") Object.assign(OPT, cfg.opts);       // the live plan's settings
    D.active = (act && act.crimes) || []; D.activeT = (act && act.t) || null;
    D.feed = (feed && feed.crimes) || null; D.feedT = (feed && feed.as_of) || null;
    // Active crimes (who's in what) come from the OC DATA FEED when it has them (Nov 2026): the Hub's own Torn pull
    // every 3 minutes PLUS members' OC Optimizer refreshes written back - so a script refresh shows up here at once.
    // data/oc_active.json (the 15-minute crime check) is only the fallback.
    if (D.feed && D.feed.length) {
      D.active = D.feed.filter(c => c && (c.status === "Recruiting" || c.status === "Planning")).map(c => ({
        id: c.id, name: c.name, difficulty: c.difficulty, status: c.status, ready_at: c.ready_at,
        slots: (c.slots || []).map(sl => [sl.user ? sl.user.id : 0, (sl.position_info && sl.position_info.label) || sl.position,
                                          sl.user && typeof sl.checkpoint_pass_rate === "number" ? Math.round(sl.checkpoint_pass_rate) : 0])}));
      D.activeT = Math.floor(D.feedT / 1000);
    }
    if (pool && pool.t > (CFG.built || 0) && pool.members && Object.keys(pool.members).length) {
      CFG.members = pool.members; CFG.hist = pool.hist || {}; CFG.built = pool.t;
    }
    const shared = Object.keys(D.rates).length;
    st(`${shared} member${shared === 1 ? "" : "s"} sharing rates · ${D.active.length} active crime${D.active.length === 1 ? "" : "s"}`
      + (D.activeT ? ` (checked ${ago(D.activeT * 1000)})` : ""));
  } catch (e) { st("Couldn't load: " + e.message, true); }
  draw();
}
async function saveConfig(k, v) {
  const r = await fetch("oc/config", {method: "PUT", headers: {"Content-Type": "application/json", "X-HB-Save": "1"}, body: JSON.stringify({env: ENV, k, v})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) throw new Error(j.error || ("save failed " + r.status));
}

// ---------- pass rates ----------
// busy = in an active crime right now; activeRate = their rate in that crime (live)
function busyMap() { const b = {}; D.active.forEach(c => (c.slots || []).forEach(([pid, pos, rate]) => { if (pid) b[pid] = {crime: c.name, cid: c.id, pos, rate, status: c.status}; })); return b; }   // cid: which crime (Nov 2026)
// ---------- spawn warnings (Nov 2026) ----------
// Teams are built whether or not their crime is recruiting. A team can only start once Torn has a Recruiting instance
// of that crime with its roles open, so each team is matched to one (the feed's crimes, every 3 min): teams of the
// same crime share that crime's recruiting instances in board order; a team left without one, or whose instance
// is missing some of its roles, gets "needs to be spawned". null = no feed data (no warning shown).
function spawnMap(teams) {
  if (!D.feed) return null;
  const pool = {};                                      // crime -> [[open base roles], ...] recruiting instances
  D.feed.forEach(c => { if (c && c.status === "Recruiting") {
    const open = (c.slots || []).filter(sl => !sl.user).map(sl => baseRole((sl.position_info && sl.position_info.label) || sl.position));
    if (open.length) (pool[c.name] || (pool[c.name] = [])).push(open); } });
  const out = new Map();
  teams.forEach(t => {
    const inst = (pool[t.crime] || []).shift();
    if (!inst) { out.set(t.id, {ok: false, why: "no " + t.crime + " is recruiting - it needs to be spawned"}); return; }
    const left = inst.slice(), miss = [];
    t.roles.forEach(r => { const i = left.indexOf(baseRole(r.position)); if (i >= 0) left.splice(i, 1); else miss.push(baseRole(r.position)); });
    out.set(t.id, miss.length ? {ok: false, why: `the recruiting ${t.crime} has no open ${[...new Set(miss)].join(", ")} - another needs to be spawned`}
                              : {ok: true});
  });
  return out;
}
const spawnHtml = sp => sp && !sp.ok ? `<div class="hn" style="color:var(--gold)">⚠️ Not available: ${esc(sp.why)}.</div>` : "";
function spawnSummary(teams, sm) {
  if (!sm) return "";
  const need = {};
  teams.forEach(t => { const x = sm.get(t.id); if (x && !x.ok) need[t.crime] = (need[t.crime] || 0) + 1; });
  const list = Object.entries(need).map(([c, n]) => esc(c) + (n > 1 ? " ×" + n : ""));
  return list.length ? `<div class="hn" style="color:var(--gold)">⚠️ ${list.length === 1 && Object.values(need)[0] === 1 ? "This crime needs" : "These crimes need"} to be spawned before the team can join: <b>${list.join(", ")}</b>.</div>` : "";
}

// the best known rate for member pid in crime + role: live (shared / active crime) when fresh, else history
function rateOf(pid, crime, pos) {
  // (Nov 2026) the rate in a crime they're in NOW, else the NEWEST of their shared rate (any age) and history rate
  const k = rkey(crime, pos);
  for (const c of D.active) if (c.name === crime) for (const [p, ps, r] of c.slots || []) if (String(p) === String(pid) && baseRole(ps) === baseRole(pos) && r != null) return {rate: r, src: "live"};
  const s0 = D.rates[String(pid)], h0 = (CFG.hist[k] || {})[String(pid)];
  // when THIS role's rate was read (rates.json t, Nov 2026), else the member's last share - the newest rate wins
  const sh = s0 && s0.roles && s0.roles[k] != null ? {rate: s0.roles[k], src: "live", t: Number((s0.t || {})[k]) || Number(s0.ts) || 0} : null;
  const h = h0 ? {rate: h0[0], src: "history", t: (Number(h0[1]) || 0) * 1000} : null;   // history time is in seconds
  if (sh && h) return sh.t >= h.t ? sh : h;
  return sh || h;
}
// everyone (current members) with a rate for this crime + role, best first
function candidates(crime, pos) {
  const out = [];
  Object.keys(CFG.members).forEach(pid => { const r = rateOf(pid, crime, pos); if (r) out.push(Object.assign({pid: +pid, name: nameOf(pid)}, r)); });
  return out.sort((a, b) => b.rate - a.rate);
}
const rolesOf = crime => ((CFG.catalog[crime] || {}).roles || []);
const diffOf = crime => (CFG.catalog[crime] || {}).difficulty;
// ROLE WEIGHTS (Nov 2026, tornprobability.com via the Hub - config.json weights): team success = the WEIGHTED average
// of its members' rates, the same as the planner (gate/oc_planner.js wOf). No weights for a crime = plain average.
const tpK = v => String(v || "").toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
function roleW(crime, label) {
  const W = D.config.weights; if (!W) return 1;
  const e = Object.entries(W).find(([k]) => tpK(k) === tpK(crime)); if (!e) return 1;
  const m = {}; Object.entries(e[1] || {}).forEach(([r, v]) => { m[tpK(r)] = Math.max(0, Number(v) || 0); });
  const look = l => { const k = tpK(l); return m[k] ?? (/\d+$/.test(k) ? m[k.replace(/\d+$/, "")] : undefined); };   // "Enforcer #1" = "Enforcer"
  const roles = rolesOf(crime), all = roles.map(look);
  if (!roles.length || all.some(v => v == null)) return 1;
  const mean = all.reduce((a, v) => a + v, 0) / all.length;
  return mean > 0 ? (look(label) ?? mean) / mean : 1;
}
const teamAvg = t => { const r = t.roles.filter(x => x.pid != null && x.rate != null); if (!r.length) return null;
  const ws = r.reduce((a, x) => a + roleW(t.crime, x.position), 0); return ws > 0 ? r.reduce((a, x) => a + x.rate * roleW(t.crime, x.position), 0) / ws : null; };
// the calculated success chance (tornprobability.com CalculateSuccess, worked out by the Hub for full teams) or null
function teamSuccess(t) {
  const N = D.config.tp_names, S = D.config.success; if (!N || !S) return null;
  const e = Object.entries(N).find(([k]) => tpK(k) === tpK(t.crime)); if (!e) return null;
  const ps = Object.keys(e[1]).sort((a, b) => Number(a.slice(1)) - Number(b.slice(1))).map(p => tpK(e[1][p]));
  const same = (pos, k) => { const q = tpK(pos); return q === k || q.replace(/\d+$/, "") === k; };

// DELAY RECORD (Nov 2026): config.json delays {pid: {n, long, hrs, runs}} - crimes held up in the last 30 days
const delayTag = pid => { const d = ((D.config || {}).delays || {})[String(pid)];

  const sig = JSON.stringify([BOARD.teams.map(t => t.roles.map(r => r.pid)), OPT, D.config.disabled, D.activeT, Object.keys(D.rates).length, CFG.built, ENV]);
  if (SUGG.sig === sig) return SUGG.list;
  const pool = new Set(Object.keys(CFG.members).map(Number).filter(p => !blocked.has(p) && (OPT.includeBusy || !busy[p])));
  const list = [];
  Object.keys(CFG.catalog).filter(crimeOk).forEach(c => { const t = teamFor(c, pool, 0, {}); if (t) list.push({crime: c, team: t, pay: teamExp(t) || 0}); });
  list.sort((a, b) => b.pay - a.pay || (diffOf(b.crime) || 0) - (diffOf(a.crime) || 0));
  SUGG = {sig, list};
  return list;
}

  $("deploy").onclick = deploy;

const freeIn = ms => { const h = (ms - Date.now()) / 3600e3; return h <= 0 ? "any moment" : h < 1 ? Math.max(1, Math.round(h * 60)) + "m" : (Math.round(h * 10) / 10) + "h"; };

      return p == null ? "" : v.pot ? `💰 ${payRange(t.crime)}/day each · ${v.days} days${v.chain ? ` (with ${esc(v.chain)})` : ""} · ${fmt$(p)}/day team`

// planning progress of the member holding this slot in Torn (the feed's slot user.progress), e.g. "40%", or ""
function planPct(t, r) {
  const c = (D.feed || []).find(x => String(x.id) === String(t.crime_id));
  const sl = c && (c.slots || []).find(x => ((x.position_info && x.position_info.label) || x.position) === r.position);
  const p = sl && sl.user && Number(sl.user.progress);
  return p > 0 ? Math.round(p) + "%" : "";
}
function wireTeams() {
  document.querySelectorAll("select[data-t]").forEach(s => s.onchange = () => {
    const t = BOARD.teams.find(x => x.id === s.dataset.t), r = t.roles[+s.dataset.r];
    // REPLACING a member already in the crime (Nov 2026): warn first - their planning is lost and the crime delayed
    const held = r.existing ? {pid: +r.pid, name: r.name || nameOf(r.pid)} : r.replaces ? {pid: +r.replaces.pid, name: r.replaces.name || nameOf(r.replaces.pid)} : null;
    if (held) {
      if (+s.value === held.pid) {                        // back to the member in the crime
        const rt = r.existing ? {} : (rateOf(held.pid, t.crime, r.position) || {});
        if (!r.existing) Object.assign(r, {pid: held.pid, name: held.name, rate: rt.rate ?? r.rate, src: "in crime", existing: true});
        delete r.replaces; saveBoard(); draw(); return;
      }
      if (r.existing) {
        const pc = planPct(t, r);
        if (!confirm(`${held.name} is already in ${t.crime}${pc ? ` and ${pc} through planning` : " and their planning has begun"}.\n\nReplacing them will DELAY the crime and WASTE their current planning progress. They'll need to leave the crime before the new member can join.\n\nReplace them?`)) { draw(); return; }
        r.replaces = held; r.existing = false; r.joined = false;
      }
    }
    if (!s.value) Object.assign(r, {pid: null, name: "", rate: null, src: null});
    else { const pid = +s.value, rt = rateOf(pid, t.crime, r.position) || {};
      Object.assign(r, {pid, name: nameOf(pid), rate: rt.rate ?? null, src: rt.src || null}); }
    saveBoard(); draw();
  });
  document.querySelectorAll("[data-lock]").forEach(b => b.onclick = () => { const t = BOARD.teams.find(x => x.id === b.dataset.lock); t.lock = !t.lock; saveBoard(); draw(); });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { BOARD.teams = BOARD.teams.filter(x => x.id !== b.dataset.del); saveBoard(); draw(); });

    const i = BOARD.teams.findIndex(x => x.id === b.dataset.fill), t = BOARD.teams[i];
    BOARD.teams.splice(i, 1); addTeam(t.crime);
    const nt = BOARD.teams.pop(); nt.lock = t.lock; nt.id = t.id; BOARD.teams.splice(i, 0, nt); saveBoard(); draw(); });
}
async function deploy() {
  const n = BOARD.teams.reduce((a, t) => a + t.roles.filter(r => r.pid != null).length, 0);
  if (!confirm(`Deploy ${BOARD.teams.length} team${BOARD.teams.length === 1 ? "" : "s"} (${n} members) to LIVE?\nMembers using the OC Optimizer will be shown their assigned role. This replaces the plan that's deployed now.`)) return;
  const plan = {teams: BOARD.teams.map(t => ({id: t.id, crime: t.crime, difficulty: t.difficulty, kind: t.kind || "spawn", crime_id: t.crime_id || null, lock: !!t.lock,
    roles: t.roles.map(r => ({position: r.position, pid: r.pid, name: r.pid != null ? nameOf(r.pid) : "", rate: r.rate, src: r.src || null, existing: !!r.existing,
      queued: !!r.queued, free_at: r.queued ? r.free_at || null : null, replaces: r.replaces || null}))}))};
  try { st("Deploying…"); await saveConfig("plan", plan); D.config.plan = plan; D.config.plan_ts = Date.now(); st(`Deployed ✓ - ${n} members on ${plan.teams.length} teams (Live).`); TAB = "deployed"; LS.set("hb_oc_tab", TAB); draw(); }

      if (r.pid == null) return `<tr><td>${esc(r.position)}</td><td class="tag">empty</td><td></td><td></td></tr>`;
      total++;
      const b = busy[r.pid];
      // JOINED vs QUEUED (Nov 2026): a live team's member has joined only when they're in THAT crime id; a queued
      // member who is still in another crime of the same type is queued, not joined
      const ok = b && (t.crime_id && b.cid != null ? String(b.cid) === String(t.crime_id) : (!r.queued && b.crime === t.crime && baseRole(b.pos) === baseRole(r.position)));
      const nq = nextQ[r.pid], nextOn = ok && nq && String(nq.id || "") !== String(t.crime_id || "");   // in this crime + queued for the next
      ALL.add(r.pid);
      if (nextOn || (!ok && r.queued)) QUEUE.add(r.pid); else if (ok) JOIN.add(r.pid);
      const stt = (nextOn ? `<span class="qd" title="In this crime now - queued for their next crime, joins it when this one pays out">🕒 Queued · next: ${esc(nq.crime)}${nq.id ? " #" + esc(nq.id) : " (to spawn)"} · free in ${freeIn(nq.free_at)}</span>`
        : ok ? '<span class="ok">✅ Joined</span>' : r.queued ? queueTag(r, b) : b ? `<span class="mid">⚠️ in ${esc(b.crime)}</span>` : '<span class="tag">⏳ Not joined yet</span>')
        + (r.replaces && !ok ? ` <span class="bad">🔁 replacing ${esc(r.replaces.name || nameOf(r.replaces.pid))}</span>` : "");
      return `<tr><td>${esc(r.position)}</td><td><b>${esc(r.name || nameOf(r.pid))}</b></td><td class="${col(r.rate)}">${r.rate == null ? "-" : r.rate + "%"}</td><td>${stt}</td></tr>`;
    }).join("");
    const av = teamAvg(t);
    return `<div class="team${t.lock ? " lock" : ""}"><div class="th"><span class="dif">D${t.difficulty ?? "?"}</span><b>${esc(t.crime)}</b>
      ${t.kind === "live" ? `<span class="kind live">🎯 #${esc(t.crime_id)}</span>` : `<span class="kind spawn">🧪 spawn</span>`}${t.lock ? " 🔒" : ""}${(D.config.rotate || []).includes(t.crime) ? ' <span class="tag" title="A rotated crime">🔁</span>' : ""}
      <span class="sr ${col(av)}" title="Weighted team success (role weights)">${av == null ? "-" : Math.round(av) + "%"}</span>${(() => { const sc = teamSuccess(t); return sc == null ? "" : ` <span class="tag" title="Calculated success chance (tornprobability.com)">🎲 ${sc}%</span>`; })()}</div>
      ${t.kind === "live" ? "" : spawnHtml(sm && sm.get(t.id))}
      <table><tr><th>Role</th><th>Member</th><th>Rate</th><th>Status</th></tr>${rows}</table></div>`;
  }).join("");
  $("view").innerHTML = `<div class="panel">${autoHtml()}${OPT.auto === false ? "" : `<div class="hn">🔄 <b>Kept up to date automatically</b> every ${OPT.autoMinutes || 3} minutes from the crimes in Torn: open slots in recruiting crimes (🎯) are filled when the crime reaches ${OPT.target}%, members left over get crimes to spawn (🧪). Slots are only reserved for members who haven't joined a crime or are queued (their crime is ready within ${OPT.queueHours} h) - members already in a crime stay where they are. Nothing that's still valid is moved - except when someone takes a slot that was reserved for another member: then every reservation (free and queued members only) is placed again for the best fit. 🔒 locked teams are never changed.</div>`}<div class="hn">Last change ${ago(D.config.plan_ts)}${D.config.plan_by ? " by " + esc(D.config.plan_by) : ""} · status from the active crimes${D.activeT ? " (checked " + ago(D.activeT * 1000) + ")" : ""}.</div>
    <div class="stat"><div><b>${plan.teams.length}</b><span>Teams</span></div><div><b class="ok">${[...JOIN].filter(p => !QUEUE.has(p)).length}</b><span>✅ Joined</span></div><div><b class="qd">${QUEUE.size}</b><span>🕒 Queued</span></div><div><b>${[...ALL].filter(p => !QUEUE.has(p) && !JOIN.has(p)).length}</b><span>⏳ Not joined yet</span></div></div>
    <div class="hn">✅ <b>Joined</b> = in this crime now · 🕒 <b>Queued</b> = finishing a crime and already lined up for the next one (shown in both) · ⏳ <b>Not joined yet</b> = free, hasn't joined. Counted once per member.</div>
    <div class="bar" style="justify-content:flex-start"><button id="toboard">✏️ Load into the Team Builder</button><button id="undeploy">Withdraw plan</button></div>
    ${spawnSummary(plan.teams, sm)}
    <div class="teams">${cards}</div></div>`;
  wireAuto();
  $("toboard").onclick = () => { if (BOARD.teams.length && !confirm("Replace the Team Builder board with the deployed plan?")) return;
    BOARD = {teams: plan.teams.map(t => ({id: t.id, crime: t.crime, difficulty: t.difficulty, kind: t.kind || "spawn", crime_id: t.crime_id || null, lock: !!t.lock,
      roles: t.roles.map(r => r.existing ? Object.assign({}, r) : Object.assign({}, r, rateOf(r.pid, t.crime, r.position) || {}))}))}; saveBoard(); TAB = "builder"; LS.set("hb_oc_tab", TAB); draw(); };
  $("undeploy").onclick = async () => { if (!confirm("Withdraw the deployed plan? Members stop seeing their assigned roles.")) return;
    try { await saveConfig("plan", {teams: []}); D.config.plan = {teams: []}; st("Plan withdrawn."); draw(); } catch (e) { st("Failed: " + e.message, true); } };
}

// ---------- Refresh (once a minute - the gatekeeper enforces it for all leaders together) ----------
// Reloads the shared rates + deployed plan at once, and asks the gatekeeper to start a crime check now; that check
// saves the active crimes, current members and newest completed crimes' rates - polled here until they arrive.
const REFRESH_GAP = 60 * 1000;
let polling = false;
function refreshBtn() {
  const left = Math.ceil((LS.get("hb_oc_refresh_at", 0) + REFRESH_GAP - Date.now()) / 1000);
  const b = $("refresh");
  b.disabled = polling || left > 0;
  b.textContent = polling ? "⏳ Checking Torn…" : left > 0 ? `🔄 Refresh (${left}s)` : "🔄 Refresh";
}
setInterval(refreshBtn, 1000);
$("refresh").onclick = async () => {
  if ($("refresh").disabled) return;
  const startT = Math.floor(Date.now() / 1000);
  LS.set("hb_oc_refresh_at", Date.now()); polling = true; refreshBtn();
  try {
    const r = await fetch("oc/refresh", {method: "POST", headers: {"X-HB-Save": "1"}});
    const j = await r.json().catch(() => ({}));
    if (r.status === 429) {                      // another leader refreshed in the last minute
      LS.set("hb_oc_refresh_at", Date.now() - REFRESH_GAP + (j.retry_in || 60) * 1000);
      polling = false; refreshBtn(); await load();
      st(`Refreshed shared rates and plan. Torn was re-checked under a minute ago - try again in ${j.retry_in || 60}s.`);
      return;
    }
    if (!r.ok || !j.ok) throw new Error(j.error || ("refresh " + r.status));
    await load();
    st("Rates and plan refreshed - checking Torn for members and crimes (about 1-2 minutes)…");
    // the crime check takes ~1-2 min on GitHub; poll every 10 s for up to 4 min
    for (let i = 0; i < 24; i++) {
      await new Promise(res => setTimeout(res, 10000));
      const pool = await ghJSON("data/oc_pool.json");
      if (pool && pool.t >= startT) { polling = false; await load(); st($("st").textContent + " · refreshed from Torn just now"); refreshBtn(); return; }
    }
    throw new Error("the crime check hasn't finished yet - the page will show it on the next load");
  } catch (e) { st("Refresh: " + e.message, true); }
  polling = false; refreshBtn();
};
refreshBtn();

document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { TAB = b.dataset.tab; LS.set("hb_oc_tab", TAB); draw(); });
load();
</script>
</body></html>
