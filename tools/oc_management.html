<title>OC Management - Heart Breakers</title>
<!--
  OC MANAGEMENT (leaders' folder: oc.html, published by generate.py write_oc_management). Nov 2026.
  Three tabs:
    CRIMES       turn each Organized Crime on/off for the OC Optimizer script's suggestions (saved as the 'disabled'
                 list - the script reads it from the gatekeeper's POST /oc/plan and stops suggesting those crimes)
    TEAM BUILDER build teams here, then DEPLOY them: every member on a deployed team is told by the script which crime
                 and role leadership assigned them (POST /oc/plan returns ONLY the caller's own assignment).
                 Ported from the OC Optimizer's Team Builder simulator (exact crime+role rates only, each member used
                 once across the board) plus an automatic multi-team builder:
                   for each crime that's switched on, HARDEST first: build the best possible team from the members
                   still free (maximise the team's WEIGHTED success - role weights, Nov 2026 - every role at or above
                   "Lowest role %"); keep it if it reaches the target (default 75%), then try another team of the same crime;
                   when it can't, move to the next-hardest crime. So the hardest crimes get the strongest members, and
                   as many teams as the faction can staff at 75%+ are built.
                 Chains (e.g. No Reserve -> Bidding War): the final crime's payout, after the faction's cut, is split
                 evenly over every member of every crime in the chain; pay/day counts the days from joining to the payout
                 (valueOf / chainOf). Switch a chain off in the Crimes tab. Locked teams (🔒) are kept by Auto-build.
    DEPLOYED     the plan that's live for the script, with each member's progress from the active crimes
                 (✅ in their assigned role · ⏳ not joined yet · 🕒 queued - joins when their current crime pays out · ⚠️ in a different crime).
  PASS RATES (a member's checkpoint pass rate for one crime + role - the same "Crime|Role" keys as the script):
    live      the OC Optimizer's shared rates (D1, /l/oc/rates.json) + members' rates in the active crimes right now
    history   their latest rate for that crime + role from completed crimes (CFG.hist, rebuilt every full update)
    A rate in a crime they're in now wins; otherwise the NEWEST of shared and history (no age limit, Nov 2026). Members with no rate for a crime + role
    are never placed in it (a rate from an easier crime would overstate what they'd manage).
  BUSY: members already in an active crime are left out (unless queued). The old "Include members already in a crime"
  draft option was REMOVED (Nov 11 2026, user) - OPT.includeBusy is always false, same as the automatic assignment.
  ENV: always prod (LIVE) - the Test data set was removed when the OC tools went live (Nov 2026). The Worker still
  keeps a separate 'test' env for the script's test fork; this page no longer shows or edits it.
  Data: CFG (__CONFIG__: catalog, hist, members, ghproxy) + live reads through the gatekeeper (leaders' pass):
    oc/config.json?env=  oc/rates.json?env=  (D1)   and   data/oc_active.json + data/oc_pool.json (leaders' gh/contents proxy).
    🔄 Refresh: POST oc/refresh (once a minute) starts a crime check that rewrites both files; the page polls for them.
  The working board (draft) is kept in this browser only until it's deployed. __MENU__ = the site menu.
-->
<style>

__MENU__
<h1>OC Management</h1>
<div class="sub">Choose which crimes the OC Optimizer suggests, build teams and deploy them to members using the script</div>
<div class="bar"><button id="refresh" style="margin-left:auto" title="Re-check Torn now: members, active crimes, newly completed crimes, shared rates and the deployed plan (once a minute)">🔄 Refresh</button></div>
<div class="status" id="st">Loading…</div>
<div class="tabs"><button data-tab="crimes">🕵️ Crimes</button><button data-tab="builder">🧩 Team Builder</button><button data-tab="deployed">🚀 Deployed</button><button data-tab="planning">📋 Planning</button><button data-tab="notify">📣 Notify</button><button data-tab="sharing">📡 Rate sharing</button></div>
<div id="view"></div>
<script>
// ---- shared OC team planner (gate/oc_planner.js, inlined by generate.py) ----
/*__PLANNER__*/
</script>
<script>
const CFG = __CONFIG__;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const LS = {get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
            set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
// "Muscle #2" -> "Muscle" (the script's baseRole - one rate per role)
const baseRole = l => String(l || "").replace(/#\s*\d+/g, "").replace(/\s+/g, " ").trim();
const rkey = (crime, pos) => crime + "|" + baseRole(pos);
const nameOf = pid => CFG.members[String(pid)] || ("[" + pid + "]");
const col = r => r == null ? "" : r >= 75 ? "ok" : r >= 65 ? "mid" : "bad";
const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); return m < 60 ? m + " min ago" : m < 2880 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " days ago"; };

const ENV = "prod";
let TAB = LS.get("hb_oc_tab", "builder");
let D = {config: {disabled: [], plan: null}, rates: {}, active: [], activeT: null};
const OPT = Object.assign({target: 75, minRole: 65, minZero: null, cap: 85, holdHours: 0, noShowHours: 6, includeBusy: false, share: null, queueHours: 0, auto: true, autoMinutes: 3}, LS.get("hb_oc_opts", {}));
OPT.queueHours = 0; OPT.holdHours = 0;   // QUEUE + SPAWN HOLDS REMOVED (Nov 13 2026, user) - old saved values ignored
OPT.includeBusy = false;          // option removed (Nov 11 2026) - a saved "on" from before is ignored
delete OPT.chains;                // "Chain finals" option removed (Nov 12 2026) - prerequisite crimes are planned like any other
// settings are kept in this browser AND saved for the gatekeeper's automatic plan (oc_config 'opts'), so the live
// plan uses the same target / lowest role / cap / queue rules
let optTimer = null;
const saveOpts = () => { LS.set("hb_oc_opts", OPT); clearTimeout(optTimer);
  optTimer = setTimeout(() => saveConfig("opts", OPT).catch(e => st("Settings not saved for the live plan: " + e.message, true)), 800); };
const boardKey = () => "hb_oc_board_" + ENV;
// a draft built on the old Test data set carries over once (Test was removed - Nov 2026)
if (!LS.get(boardKey(), null) && LS.get("hb_oc_board_test", null)) LS.set(boardKey(), LS.get("hb_oc_board_test", {teams: []}));
let BOARD = LS.get(boardKey(), {teams: []});
const saveBoard = () => LS.set(boardKey(), BOARD);
const st = (m, err) => { $("st").textContent = m; $("st").classList.toggle("err", !!err); };

// ---------- data ----------
async function getJSON(u) { const r = await fetch(u, {cache: "no-store"}); if (!r.ok) throw new Error(u.split("?")[0] + " " + r.status); return r.json(); }
// a data-repo file through the leaders' gh/contents proxy (base64 JSON) -> object, or null
async function ghJSON(path) {
  try {
    const r = await fetch(CFG.ghproxy + path + "?ref=" + CFG.branch, {cache: "no-store"});
    if (!r.ok) return null;
    const j = await r.json();
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(String(j.content || "").replace(/\n/g, "")), c => c.charCodeAt(0))));
  } catch (e) { return null; }
}
async function load() {
  st("Loading…");
  try {
    const [cfg, rates, act, pool, feed, sums] = await Promise.all([
      getJSON("oc/config.json?env=" + ENV), getJSON("oc/rates.json?env=" + ENV),
      // active crimes (who's in what, right now) - the crime check saves it every 15 minutes
      ghJSON("data/oc_active.json"),
      // members + history rates from the last Refresh - used when newer than the copy built into this page
      ghJSON("data/oc_pool.json"),
      // the OC data feed's crimes (recruiting + planning, every 3 minutes) - "needs to be spawned" warnings
      getJSON("oc/crimes.json?env=" + ENV).catch(() => null),
      // payout summaries + item prices (the script's data - pay per day shown here matches the script)
      getJSON("oc/summaries.json?env=" + ENV).catch(() => null)]);
    D.sums = (sums && sums.summaries) || null; D.prices = (sums && sums.prices) || {};
    D.config = cfg; D.rates = rates || {};
    if (cfg.opts && typeof cfg.opts === "object") Object.assign(OPT, cfg.opts);       // the live plan's settings
    OPT.queueHours = 0; OPT.holdHours = 0;   // removed Nov 13 2026 (user)
    D.active = (act && act.crimes) || []; D.activeT = (act && act.t) || null;
    D.feed = (feed && feed.crimes) || null; D.feedT = (feed && feed.as_of) || null;
    // Active crimes (who's in what) come from the OC DATA FEED when it has them (Nov 2026): the Hub's own Torn pull
    // every 3 minutes PLUS members' OC Optimizer refreshes written back - so a script refresh shows up here at once.
    // data/oc_active.json (the 15-minute crime check) is only the fallback.
    if (D.feed && D.feed.length) {
      D.active = D.feed.filter(c => c && (c.status === "Recruiting" || c.status === "Planning")).map(c => ({
        id: c.id, name: c.name, difficulty: c.difficulty, status: c.status, ready_at: c.ready_at,
        slots: (c.slots || []).map(sl => [sl.user ? sl.user.id : 0, (sl.position_info && sl.position_info.label) || sl.position,
                                          sl.user && typeof sl.checkpoint_pass_rate === "number" ? Math.round(sl.checkpoint_pass_rate) : 0])}));
      D.activeT = Math.floor(D.feedT / 1000);
    }
    if (pool && pool.t > (CFG.built || 0) && pool.members && Object.keys(pool.members).length) {
      CFG.members = pool.members; CFG.hist = pool.hist || {}; CFG.built = pool.t;
    }
    const shared = Object.keys(D.rates).length;
    st(`${shared} member${shared === 1 ? "" : "s"} sharing rates · ${D.active.length} active crime${D.active.length === 1 ? "" : "s"}`
      + (D.activeT ? ` (checked ${ago(D.activeT * 1000)})` : ""));
  } catch (e) { st("Couldn't load: " + e.message, true); }
  draw();
}
async function saveConfig(k, v) {
  const r = await fetch("oc/config", {method: "PUT", headers: {"Content-Type": "application/json", "X-HB-Save": "1"}, body: JSON.stringify({env: ENV, k, v})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) throw new Error(j.error || ("save failed " + r.status));
}

// ---------- pass rates ----------
// busy = in an active crime right now; activeRate = their rate in that crime (live)
function busyMap() { const b = {}; D.active.forEach(c => (c.slots || []).forEach(([pid, pos, rate]) => { if (pid) b[pid] = {crime: c.name, cid: c.id, pos, rate, status: c.status}; })); return b; }   // cid: which crime (Nov 2026)
// ---------- spawn warnings (Nov 2026) ----------
// Teams are built whether or not their crime is recruiting. A team can only start once Torn has a Recruiting instance
// of that crime with its roles open, so each team is matched to one (the feed's crimes, every 3 min): teams of the
// same crime share that crime's recruiting instances in board order; a team left without one, or whose instance
// is missing some of its roles, gets "needs to be spawned". null = no feed data (no warning shown).
function spawnMap(teams) {
  if (!D.feed) return null;
  const pool = {};                                      // crime -> [[open base roles], ...] recruiting instances
  D.feed.forEach(c => { if (c && c.status === "Recruiting") {
    const open = (c.slots || []).filter(sl => !sl.user).map(sl => baseRole((sl.position_info && sl.position_info.label) || sl.position));
    if (open.length) (pool[c.name] || (pool[c.name] = [])).push(open); } });
  const out = new Map();
  teams.forEach(t => {
    const inst = (pool[t.crime] || []).shift();
    if (!inst) { out.set(t.id, {ok: false, why: "no " + t.crime + " is recruiting - it needs to be spawned"}); return; }
    const left = inst.slice(), miss = [];
    t.roles.forEach(r => { const i = left.indexOf(baseRole(r.position)); if (i >= 0) left.splice(i, 1); else miss.push(baseRole(r.position)); });
    out.set(t.id, miss.length ? {ok: false, why: `the recruiting ${t.crime} has no open ${[...new Set(miss)].join(", ")} - another needs to be spawned`}
                              : {ok: true});
  });
  return out;
}
// SPAWN ALERTS (Nov 12 2026, user: "Give alerts to spawn higher paying jobs when members who qualify are available or
// becoming available ... alert leadership to try spawning it"): the deployed plan's spawn teams whose crime isn't
// recruiting, best pay per member per day first - how many of the team are free now / still finishing a crime, and
// a HOLD (members kept for it instead of a lower-paying recruiting crime, opts.holdHours) with its end time.
const hhmm = ms => new Date(ms).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const heldTag = t => t.hold && Number(t.hold.until) > Date.now() ? ` <span class="tag mid" title="These members are held for this crime instead of a lower-paying recruiting crime - spawn it before then">⏳ held until ${hhmm(t.hold.until)}</span>` : "";
// the hold on a team card goes on its own line under the header (Nov 12 2026, user: it crowded the crime name)
const heldLine = t => t.hold && Number(t.hold.until) > Date.now() ? `<div class="hn" style="color:var(--gold)">⏳ Members held for this crime until <b>${hhmm(t.hold.until)}</b> - spawn it before then.</div>` : "";
function spawnAlertsHtml(teams, sm) {
  if (!sm) return "";
  const list = teams.filter(t => t.kind !== "live" && sm.get(t.id) && !sm.get(t.id).ok && t.roles.length && t.roles.every(r => r.pid != null))
    .sort((a, b) => eachPay(b.crime) - eachPay(a.crime));
  if (!list.length) return "";
  const rows = list.map(t => { const q = t.roles.filter(r => r.queued), ready = t.roles.length - q.length;
    const nf = q.length ? Math.min(...q.map(r => Number(r.free_at) || Date.now())) : null;
    return `<tr><td><span class="dif">D${t.difficulty ?? "?"}</span> <b>${esc(t.crime)}</b>${heldTag(t)}</td><td>${fmt$(eachPay(t.crime))}/day each</td>
      <td>${ready ? `<span class="ok">${ready} ready now</span>` : ""}${ready && q.length ? " · " : ""}${q.length ? `<span class="qd">${q.length} free in ${freeIn(nf)}${q.length > 1 ? "+" : ""}</span>` : ""}</td>
      <td class="tag">${t.roles.map(r => esc(r.name || nameOf(r.pid))).join(", ")}</td></tr>`; }).join("");
  return `<div class="hn" style="color:var(--gold);margin-top:8px">🧪 <b>Spawn alerts</b> - these members' pass rates are too high (above the ${OPT.cap}% cap) for every open crime, so they need a harder crime. Spawn it in Torn (best pay first); the plan moves the team in on its next run.</div>
    <table class="spawnal"><tr><th>Crime</th><th>Pay</th><th>Members</th><th>Team</th></tr>${rows}</table>`;
}
const spawnHtml = sp => sp && !sp.ok ? `<div class="hn" style="color:var(--gold)">⚠️ Not available: ${esc(sp.why)}.</div>` : "";
function spawnSummary(teams, sm) {

  const maxSc = order.map((_, j) => order.slice(j).reduce((s, i) => s + cands[i][0].sc, 0));
  const maxRt = order.map((_, j) => order.slice(j).reduce((s, i) => s + Math.max(...cands[i].map(c => c.wr)), 0));
  let best = null, bestSc = -Infinity, nodes = 0;
  const pick = new Array(roles.length), used = new Set();
  (function dfs(j, sc, rt) {
    if (++nodes > 40000) return;                                      // safety cap per call
    if (sc + (maxSc[j] || 0) <= bestSc || rt + (maxRt[j] || 0) < need) return;
    if (j === order.length) { bestSc = sc; best = pick.slice(); return; }
    const i = order[j];
    for (const c of cands[i]) {
      if (used.has(c.pid)) continue;
      used.add(c.pid); pick[i] = c;
      dfs(j + 1, sc + c.sc, rt + c.wr);
      used.delete(c.pid);
    }
  })(0, 0, 0);
  if (!best) return null;
  return {id: uid(), crime, difficulty: diffOf(crime), lock: false,

}
// total for comparing whole plans: members' pay per day, then more crimes running, then harder crimes
const planScore = teams => teams.reduce((s, t) => s + (teamExp(t) || 0) + 1 + (t.difficulty || 0) * 0.1, 0);

// Auto-build (Nov 2026): MOST PAY PER DAY for all members together, every team at the target average or better.
//   1. every switched-on crime ranked by pay per member-day; several passes (different α and crime orders) fill
//      teams greedily from the free members
//   2. improve each plan: (a) STEAL - build another team using members from existing teams when their team can
//      backfill them from the free members and still reach the target (strong members move to easier roles if
//      that adds an extra crime), (b) UPGRADE - swap a free member into a role where they pass better
//   3. keep the plan with the highest pay per day (ties: more crimes running, then harder crimes)
// Locked teams are kept as they are. Difficulty only breaks ties - pay per day decides.
// Auto-build (Nov 2026): the SHARED planner (gate/oc_planner.js) - exactly what the gatekeeper runs every 3 minutes
// on the deployed plan, here from scratch (locked teams kept): open slots of RECRUITING crimes first (skipped when the
// crime can't reach the target), then "needs spawn" teams for members left over (pay-per-day optimizer, ~1 s).
function autoBuild() {
  const keep = BOARD.teams.filter(t => t.lock);
  const lastRuns = {}; Object.entries(D.config.last_runs || {}).forEach(([k, v]) => { lastRuns[k] = (v || []).map(l => new Set(l)); });
  const r = ocPlan({crimes: D.feed || [], prev: keep, fresh: true, catalog: CFG.catalog, members: CFG.members,
    rotate: new Set(),   // rotation removed Nov 13 2026 lastRuns, delays: D.config.delays || {},
    opts: OPT, disabled: new Set(D.config.disabled || []), rateOf: (pid, crime, label) => rateOf(pid, crime, label),
    payOf: crime => valueOf(crime), budgetMs: 900, weights: D.config.weights || null,
    holdLog: D.config.hold_log || {},
    // CALCULATED SUCCESS (Nov 12 2026, the user: "Target + pay"): tornprobability's chance for a full team when the Hub
    // has checked it - the target applies to it (gate/oc_planner.js succOf)
    succOf: (crime, roles) => teamSuccess({crime, roles}), scriptUsers: scriptKnown() ? new Set(Object.keys(D.config.script_seen).filter(usesScript).map(Number)) : null});
  BOARD.teams = r.teams;
  saveBoard();
  const busy = busyMap(), busyN = Object.keys(CFG.members).filter(p => busy[p]).length, total = Object.keys(CFG.members).length;
  const made = r.teams.length - keep.length;
  st(made ? `Built ${r.stats.live} team${r.stats.live === 1 ? "" : "s"} in recruiting crimes + ${r.stats.spawn} to spawn · about ${fmt$(r.stats.pay)}/day for members${keep.length ? ` (${keep.length} locked kept)` : ""}.`
     : !D.feed ? "No live crime data yet - try Refresh."
     : `No teams: nobody free reaches ${OPT.target}% in an open crime${!OPT.includeBusy && busyN > total / 2 ? ` (${busyN} of ${total} members are already in a crime)` : ""}.`, !made);
}
// step 2 of auto-build (changes teams + free in place)
function improve(teams, free, order, opp) {
  const where = () => { const m = new Map(); teams.forEach((t, ti) => t.roles.forEach((r, ri) => m.set(r.pid, [ti, ri]))); return m; };
  // best free member for one role of team t (other than `not`), keeping the team at the target -> {c, pay} or null
  const backfill = (t, ri, not) => {
    let b = null;
    free.forEach(pid => { if (not && not.has(pid)) return;
      const r = rateOf(pid, t.crime, t.roles[ri].position); if (!r || r.rate < floorOf(t.crime, t.roles[ri].position) || capped(pid, t.crime, r.rate)) return;
      const tt = {crime: t.crime, roles: t.roles.map((x, i) => i === ri ? {rate: r.rate} : x)};
      if (teamAvg(tt) < OPT.target) return;
      const pay = teamExp(tt); if (!b || pay > b.pay) b = {c: {pid, name: nameOf(pid), rate: r.rate, src: r.src}, pay}; });
    return b;
  };
  for (let round = 0; round < 6; round++) {
    let changed = false;
    // (a) STEAL: one more team, using members from other teams that can be backfilled
    for (const crime of order) {
      const pos = where();
      const lossOf = new Map();
      const cost = pid => { if (free.has(pid)) return 0; if (lossOf.has(pid)) return lossOf.get(pid);
        const [ti, ri] = pos.get(pid), t = teams[ti], bf = backfill(t, ri);
        const l = bf ? (teamExp(t) || 0) - bf.pay : Infinity; lossOf.set(pid, l); return l; };
      const pool = new Set([...free, ...pos.keys()]);
      const nt = teamFor(crime, pool, 0, opp, cost);
      if (!nt || !nt.roles.some(r => !free.has(r.pid))) continue;          // nothing stolen -> the fill step does it
      // apply: backfill each robbed team (one at a time, the free set shrinking), undo if any fails
      const snap = teams.map(t => t.roles.map(r => Object.assign({}, r))), freeSnap = new Set(free);
      const take = new Set(nt.roles.map(r => r.pid));
      let ok = true;
      nt.roles.forEach(r => free.delete(r.pid));
      for (const r of nt.roles) {
        if (!pos.has(r.pid)) continue;
        const [ti, ri] = pos.get(r.pid), bf = backfill(teams[ti], ri, take);
        if (!bf) { ok = false; break; }
        teams[ti].roles[ri] = Object.assign({}, teams[ti].roles[ri], bf.c); free.delete(bf.c.pid);
      }
      const before = snap.reduce((s, roles, i) => s + (teamExp({crime: teams[i].crime, roles}) || 0), 0);
      const after = teams.reduce((s, t) => s + (teamExp(t) || 0), 0) + (teamExp(nt) || 0);
      if (ok && teams.every(t => teamAvg(t) >= OPT.target) && after + 1 > before) { teams.push(nt); changed = true; }
      else { teams.forEach((t, i) => t.roles = snap[i]); free.clear(); freeSnap.forEach(p => free.add(p)); }
    }
    // (b) UPGRADE: a free member who passes a role better than whoever has it
    teams.forEach(t => t.roles.forEach((r, ri) => {
      const bf = backfill(t, ri);
      if (bf && bf.c.rate > r.rate) { free.add(r.pid); t.roles[ri] = Object.assign({}, r, bf.c); free.delete(bf.c.pid); changed = true; }
    }));
    if (!changed) break;
  }
}
// a team for one chosen crime: best available (even below the target), empty roles where nobody fits
function addTeam(crime) {
  const blocked = usedIds();
  const t = bestTeam(crime, blocked) || {id: uid(), crime, difficulty: diffOf(crime), lock: false,
    roles: rolesOf(crime).map(pos => ({position: pos, pid: null, name: "", rate: null}))};
  if (t.roles.every(r => r.pid != null) === false) {     // partial fill: best member per role, one each
    const busy = busyMap();
    t.roles.forEach(r => { if (r.pid != null) return;
      const c = candidates(crime, r.position).find(c => !blocked.has(c.pid) && (OPT.includeBusy || !busy[c.pid]));
      if (c) { Object.assign(r, {pid: c.pid, name: c.name, rate: c.rate, src: c.src}); blocked.add(c.pid); } });
  }
  BOARD.teams.push(t); saveBoard();
}

// Add-team suggestions: for every switched-on crime, the best FULL team the members not on the board can make at the

let SUGG = {sig: null, list: []};
function suggestions() {

  const sig = JSON.stringify([BOARD.teams.map(t => t.roles.map(r => r.pid)), OPT, D.config.disabled, D.activeT, Object.keys(D.rates).length, CFG.built, ENV]);
  if (SUGG.sig === sig) return SUGG.list;

  const list = [];
  // (a suggestion whose calculated success is known to be below the target is left out - CALCULATED SUCCESS)
  Object.keys(CFG.catalog).filter(crimeOk).forEach(c => { const t = teamFor(c, pool, 0, {}); if (t && !((teamSuccess(t) ?? 100) < OPT.target)) list.push({crime: c, team: t, pay: teamExp(t) || 0}); });

    while ((m = re.exec(par))) { parts.push(esc(par.slice(last, m.index))); parts.push(m[1] ? link(m[2], esc(m[1])) : link(m[3], esc(m[3]))); last = re.lastIndex; }
    parts.push(esc(par.slice(last)));
    return "<p>" + parts.join("").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>") + "</p>";
  }).join("");
}
function notifyMsgs(x) {
  const T = notifyTpl(), mail = notifyFill(T.mail, x);
  return {chat: mdPlain(notifyFill(T.chat, x)), subject: mdPlain(notifyFill(T.subject, x)), mail: mdPlain(mail), mailHtml: mdHtml(mail)};
}
// the editor (Notify tab, collapsible)
function notifyEditor() {
  const T = (D.config && D.config.notify) || {};
  return `<details class="panel" style="margin-top:10px"><summary><b>✏️ Edit the messages</b> <span class="tag">${T.chat || T.subject || T.mail ? "custom wording" : "built-in wording"}</span></summary>
    <div class="hn">Fill-ins: <code>{name}</code> <code>{crime}</code> <code>{role}</code> <code>{crime_id}</code> <code>{link}</code> (their crime) <code>{scripts}</code> (Hub Scripts page) <code>{hub}</code> (the Hub).
      In the mail: a blank line starts a new paragraph, <code>**bold**</code>, <code>[link text](address)</code> - plain addresses become links too. Leave a box empty for the built-in wording.</div>
    <label class="hn">💬 Chat<br><textarea id="ntChat" rows="3" style="width:100%">${esc(T.chat || NOTIFY_DEFAULT.chat)}</textarea></label>
    <label class="hn">✉️ Mail subject<br><input id="ntSubj" style="width:100%" value="${esc(T.subject || NOTIFY_DEFAULT.subject)}"></label>
    <label class="hn">✉️ Mail<br><textarea id="ntMail" rows="9" style="width:100%">${esc(T.mail || NOTIFY_DEFAULT.mail)}</textarea></label>
    <div><button id="ntSave">💾 Save</button> <button id="ntReset">↩️ Back to the built-in wording</button> <span class="hn" id="ntMsg"></span></div></details>`;
}
function notifyEditorWire() {
  const go = async v => { try { $("ntMsg").textContent = "Saving…"; await saveConfig("notify", v); D.config.notify = v; drawNotify(); }
    catch (e) { $("ntMsg").textContent = "Not saved: " + e.message; } };
  // a box left exactly as the built-in wording is saved empty, so later changes to the built-in wording still reach it
  const keep = (val, def) => (val.trim() === def.trim() ? "" : val);
  $("ntSave").onclick = () => go({chat: keep($("ntChat").value, NOTIFY_DEFAULT.chat), subject: keep($("ntSubj").value, NOTIFY_DEFAULT.subject), mail: keep($("ntMail").value, NOTIFY_DEFAULT.mail)});
  $("ntReset").onclick = () => go({chat: "", subject: "", mail: ""});
}
// copy as rich text (HTML + plain text); browsers without ClipboardItem get the HTML copied from a hidden editable box
function copyRich(html, text) {
  try {
    if (navigator.clipboard && window.ClipboardItem)
      return navigator.clipboard.write([new ClipboardItem({"text/html": new Blob([html], {type: "text/html"}), "text/plain": new Blob([text], {type: "text/plain"})})]);
  } catch (e) {}
  try {
    const d = document.createElement("div"); d.contentEditable = "true"; d.innerHTML = html;
    d.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0"; document.body.appendChild(d);
    const r = document.createRange(); r.selectNodeContents(d); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    const ok = document.execCommand("copy"); sel.removeAllRanges(); d.remove();
    return ok ? Promise.resolve() : Promise.reject();
  } catch (e) { return Promise.reject(); }
}
function drawNotify() {
  const L = notifyList();
  let sent = {}; try { sent = JSON.parse(localStorage.getItem(NOTIFY_LS) || "{}") || {}; } catch (e) {}
  const ago = ms => { const m = Math.round((Date.now() - ms) / 60e3); return m < 60 ? m + "m" : Math.round(m / 60) + "h"; };
  const head = `<div class="hn">Members <b>without the OC script</b> can't see their assignment, so tell them. Torn doesn't let the Hub send chats or mails itself - each button copies the message and opens Torn; you paste and press Send.</div>`;
  if (L === null) { $("view").innerHTML = `<div class="panel">${head}<div class="hn">Nobody has used the OC script with the Hub yet, so the Hub can't tell who doesn't have it.</div></div>` + notifyEditor(); notifyEditorWire(); return; }
  if (!L.length) { $("view").innerHTML = `<div class="panel">${head}<div class="hn">✅ Nobody to notify - every member without the script who's placed has joined (or isn't placed in a recruiting crime).</div></div>` + notifyEditor(); notifyEditorWire(); return; }
  $("view").innerHTML = `<div class="panel">${head}<table class="tb"><tr><th>Member</th><th>Crime · role</th><th></th></tr>`
    + L.map((x, i) => { const k = x.pid + ":" + x.crime_id, s = sent[k];
      return `<tr><td><a href="https://www.torn.com/profiles.php?XID=${x.pid}" target="_blank" rel="noopener">${esc(x.name)}</a>${s ? ` <span class="tag ok" title="Marked sent on this device">✓ sent ${ago(s)} ago</span>` : ""}</td>
        <td>${esc(x.crime)} <span class="tag">#${esc(x.crime_id)}</span><br><span class="mid">${esc(x.position)}</span></td>
        <td style="white-space:nowrap"><button data-n="chat" data-i="${i}">💬 Chat</button> <button data-n="mail" data-i="${i}">✉️ Mail</button> <button data-n="sent" data-i="${i}" title="Tick off on this device">✓</button></td></tr>`; }).join("")
    + `</table><div class="hn" id="nmsg"></div></div>` + notifyEditor();
  notifyEditorWire();
  const say = h => { $("nmsg").innerHTML = h; };
  const copy = t => navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject();
  $("view").querySelectorAll("button[data-n]").forEach(b => b.onclick = () => {
    const x = L[+b.dataset.i], m = notifyMsgs(x), k = x.pid + ":" + x.crime_id;
    if (b.dataset.n === "sent") { sent[k] = Date.now(); try { localStorage.setItem(NOTIFY_LS, JSON.stringify(sent)); } catch (e) {} drawNotify(); return; }
    // copy first, then open Torn - both straight from the tap (clipboard + popup rules)
    const cp = b.dataset.n === "chat" ? copy(m.chat) : copyRich(m.mailHtml, m.mail);   // mail: clickable links
    const url = b.dataset.n === "chat" ? `https://www.torn.com/profiles.php?XID=${x.pid}` : `https://www.torn.com/messages.php#/p=compose&XID=${x.pid}`;
    window.open(url, "_blank");
    cp.then(() => say(b.dataset.n === "chat" ? `💬 Message copied ✓ - on <b>${esc(x.name)}</b>'s profile tap <b>Chat</b>, paste and send, then tick ✓.`
                                            : `✉️ Message copied ✓ - set the subject to <b>${esc(m.subject)}</b>, paste the message, send, then tick ✓.`),
            () => say(`Couldn't copy - here's the message:<br><textarea style="width:100%;height:110px">${esc(b.dataset.n === "chat" ? m.chat : m.mail)}</textarea>`));
  });
}

function drawPlanning() {
  const list = (D.feed || []).filter(c => c && c.status === "Planning").sort((a, b) => (a.ready_at || 9e9) - (b.ready_at || 9e9));
  const when = s => s ? new Date(s * 1000).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"}) : "-";
  const cards = list.map(c => {
    const w = weightedOf(c.name, c.slots || []), v = valueOf(c.name), cut = v.pot ? v.pot / (rolesOf(c.name).length || (c.slots || []).length || 1) : 0;
    // calculated full-team chance (tornprobability.com) when the Hub has it for this exact set of rates
    const sc = teamSuccess({crime: c.name, roles: (c.slots || []).map(sl => ({position: feedRole(sl), pid: sl.user ? sl.user.id : null,
      rate: sl.user && typeof sl.checkpoint_pass_rate === "number" ? Math.round(sl.checkpoint_pass_rate) : null}))});
    const rows = (c.slots || []).map(sl => { const pos = feedRole(sl), u = sl.user;
      const rate = u && typeof sl.checkpoint_pass_rate === "number" ? Math.round(sl.checkpoint_pass_rate) : null;
      const min = Math.ceil(floorOf(c.name, pos) - 1e-9), out_ = rate != null && rate < min;
      const pg = u ? Math.round(Number(u.progress) || 0) : 0;
      return `<tr><td>${esc(pos)}${wTag(c.name, pos)}</td><td>${u ? `<b>${esc(nameOf(u.id))}</b>` : '<span class="mid">Unfilled</span>'}</td>`
        + `<td class="${col(rate)}">${rate == null ? "-" : rate + "%"}${out_ ? ` <span title="Below the ${min}% minimum">⚠️</span>` : ""}</td>`
        + `<td>${u ? (pg >= 100 ? '<span class="ok">✅ planned</span>' : pg > 0 ? `<span class="qd">⏳ ${pg}%</span>` : '<span class="tag">waiting</span>') : ""}</td></tr>`; }).join("");
    return `<div class="team"><div class="th"><span class="dif">D${c.difficulty ?? diffOf(c.name) ?? "?"}</span><b>${esc(c.name)}</b>
        <span class="kind live">#${esc(c.id)}</span><span class="sr ${col(w)}" title="Weighted team success (role weights)">${w == null ? "-" : Math.round(w) + "%"}</span>${sc == null ? "" : ` <span class="tag" title="Calculated success chance (tornprobability.com)">🎲 ${sc}%</span>`}</div>
      <div class="tag">🏁 Ready ${c.ready_at ? `<b>${when(c.ready_at)}</b> · in ${freeIn(c.ready_at * 1000)}` : "-"}${cut ? ` · 💰 up to ${fmt2(cut)} each` : ""}${w != null && w < OPT.target ? ` · <span class="bad">below the ${OPT.target}% target</span>` : ""}</div>
      <table><tr><th>Role</th><th>Member</th><th>Rate</th><th>Planning</th></tr>${rows}</table></div>`; }).join("");
  $("view").innerHTML = `<div class="panel">${alertsHtml()}<div class="hn">📋 <b>Planning</b> - crimes with every slot filled, soonest ready first.
    ${D.feedT ? `From the crimes in Torn (checked ${ago(D.feedT)}).` : ""}</div>
    ${list.length ? `<div class="teams">${cards}</div>` : '<div class="hn">No crimes are planning right now.</div>'}</div>`;
}
function drawDeployed() {
  // FILLED crimes aren't shown (Nov 11 2026, user): every slot taken in Torn and no replacement pending - the planner
  // drops them on its next run; hide them now too (a member leaving brings the crime back with an open slot)
  const full = t => t.kind === "live" && t.roles.length && t.roles.every(r => r.existing) && !t.roles.some(r => r.replaces);
  const plan0 = D.config.plan, busy = busyMap();
  // UNPLANNED CRIMES (Nov 12 2026, user: "Crimes that are actively planning but not filled should still show on the
  // deployed list. Just show their empty positions as Unfilled"): a recruiting crime in Torn with members in it but
  // open slots, that the plan has no team for (nobody qualifies for its open roles at the targets) - shown from the
  // crimes feed with its members and "Unfilled" open slots, read-only (t.unplanned)
  const inPlan = new Set(((plan0 && plan0.teams) || []).filter(t => t.crime_id != null).map(t => String(t.crime_id)));
  const unplanned = (D.feed || []).filter(c => c && c.status === "Recruiting" && !inPlan.has(String(c.id))
      && (c.slots || []).some(sl => sl.user) && (c.slots || []).some(sl => !sl.user))
    .map(c => ({id: "feed-" + c.id, crime: c.name, difficulty: c.difficulty ?? diffOf(c.name), kind: "live", crime_id: c.id, lock: false, unplanned: true,
      roles: (c.slots || []).map(sl => { const pos = (sl.position_info && sl.position_info.label) || sl.position;
        return sl.user ? {position: pos, pid: sl.user.id, name: nameOf(sl.user.id), existing: true,
                          rate: typeof sl.checkpoint_pass_rate === "number" ? Math.round(sl.checkpoint_pass_rate) : null}
                       : {position: pos, pid: null, name: "", rate: null}; })}));
  let plan = plan0 || unplanned.length ? Object.assign({}, plan0 || {}, {teams: ((plan0 && plan0.teams) || []).filter(t => !full(t)).concat(unplanned)}) : plan0;
  if (!plan || !(plan.teams || []).length) { $("view").innerHTML = `<div class="panel">${autoHtml()}<div class="hn">Nothing deployed to Live yet - ${OPT.auto !== false ? "the Hub builds the first teams on its next 3-minute run, or " : ""}build teams in the Team Builder and press Deploy.</div></div>`; wireAuto(); return; }
  // ORDER (Nov 13 2026, user: "Move the highest "join now" pay per day crimes to the top of the OC Management Deployed
  // section"): highest JOIN NOW pay per member per day first - a live recruiting crime's rate for whoever joins now
  // (payout / days to payout from now, liveDays), anything else its normal rate (teamDays falls back to full days)
  const joinNowEach = t => { const v = valueOf(t.crime); return v.pot ? v.pot / teamDays(t) / (rolesOf(t.crime).length || t.roles.length || 1) : 0; };
  plan = Object.assign({}, plan, {teams: plan.teams.slice().sort((a, b) => joinNowEach(b) - joinNowEach(a) || (b.difficulty || 0) - (a.difficulty || 0))});
  // NEXT CRIME (Nov 11 2026, user: a member in a crime that's planning AND queued for the next crime (it exists and is
  // re-scheduled for when the first one finishes) shows as Queued, not Joined): pid -> the team they're queued into
  const nextQ = {};
  plan.teams.forEach(t => t.roles.forEach(r => { if (r.queued && r.pid != null) nextQ[r.pid] = {crime: t.crime, id: t.crime_id, free_at: r.free_at}; }));
  // counts are per MEMBER (someone queued for their next crime appears in two teams but counts once, as Queued)
  const JOIN = new Set(), QUEUE = new Set(), ALL = new Set();
  let joined = 0, queued = 0, total = 0;
  const sm = spawnMap(plan.teams);
  const cards = plan.teams.map(t => {
    const rows = t.roles.map(r => {
      if (r.pid == null) return `<tr><td>${esc(r.position)}${wTag(t.crime, r.position)}</td><td class="mid">Unfilled</td><td></td><td></td></tr>`;
      total++;
      const b = busy[r.pid];
      // JOINED vs QUEUED (Nov 2026): a live team's member has joined only when they're in THAT crime id; a queued
      // member who is still in another crime of the same type is queued, not joined
      const ok = b && (t.crime_id && b.cid != null ? String(b.cid) === String(t.crime_id) : (!r.queued && b.crime === t.crime && baseRole(b.pos) === baseRole(r.position)));
      const nq = nextQ[r.pid], nextOn = ok && nq && String(nq.id || "") !== String(t.crime_id || "");   // in this crime + queued for the next
      ALL.add(r.pid);
      if (nextOn || (!ok && r.queued)) QUEUE.add(r.pid); else if (ok) JOIN.add(r.pid);
      const stt = (nextOn ? `<span class="qd" title="In this crime now - queued for their next crime, joins it when this one pays out">🕒 Queued · next: ${esc(nq.crime)}${nq.id ? " #" + esc(nq.id) : " (to spawn)"} · free in ${freeIn(nq.free_at)}</span>`
        : ok ? '<span class="ok">✅ Joined</span>' : r.queued ? queueTag(r, b) : b ? (r.leave && b.cid != null && String(b.cid) === String(r.leave.crime_id)
            // MOVING (Nov 13 2026): planning not started in their current crime - leaving it for this better-paying seat
            ? `<span class="mid" title="Hasn't started planning in ${esc(b.crime)} - leaves it for this seat, which pays more if joined now">↪ moving from ${esc(b.crime)}</span>`
            : `<span class="mid">⚠️ in ${esc(b.crime)}</span>`) : '<span class="tag">⏳ Not joined yet</span>')
        + (r.replaces && !ok ? ` <span class="bad">🔁 replacing ${esc(r.replaces.name || nameOf(r.replaces.pid))}</span>` : "");
      return `<tr><td>${esc(r.position)}${wTag(t.crime, r.position)}</td><td><b>${esc(r.name || nameOf(r.pid))}</b>${ok ? "" : " " + noScrTag(r.pid)}</td><td class="${col(r.rate)}">${r.rate == null ? "-" : r.rate + "%"}</td><td>${stt}</td></tr>`;
    }).join("");
    const av = teamAvg(t);
    return `<div class="team${t.lock ? " lock" : ""}"><div class="th"><span class="dif">D${t.difficulty ?? "?"}</span><b>${esc(t.crime)}</b>
      ${t.kind === "live" ? `<span class="kind live">🎯 #${esc(t.crime_id)}</span>` : `<span class="kind spawn">🧪 spawn</span>`}${t.lock ? " 🔒" : ""}
      <span class="sr ${col(av)}" title="Weighted team success (role weights)">${av == null ? "-" : Math.round(av) + "%"}</span>${(() => { const sc = teamSuccess(t); return sc == null ? "" : ` <span class="tag" title="Calculated success chance (tornprobability.com)">🎲 ${sc}%</span>`; })()}</div>
      <div class="tag">${payLine(t, false)}</div>
      ${t.kind === "live" ? "" : heldLine(t) + spawnHtml(sm && sm.get(t.id))}
      ${t.unplanned ? `<div class="tag">📋 Recruiting in Torn - no planned members yet: nobody free qualifies for its open roles at the current targets.</div>` : ""}
      <table><tr><th>Role</th><th>Member</th><th>Rate</th><th>Status</th></tr>${rows}</table></div>`;
  }).join("");
  $("view").innerHTML = `<div class="panel">${autoHtml()}${OPT.auto === false ? "" : `<div class="hn">🔄 <b>Kept up to date automatically</b> every ${OPT.autoMinutes || 3} minutes from the crimes in Torn: open slots in recruiting crimes (🎯) are filled when the crime reaches ${OPT.target}%, existing crimes are always filled first; a crime to spawn (🧪) is only suggested for members whose pass rates are too high (above the ${OPT.cap}% cap) for every open crime. Slots are only reserved for members who haven't joined a crime - members already in a crime stay where they are, and a member who has started planning is never moved. Nothing that's still valid is moved - except when someone takes a slot that was reserved for another member: then every reservation (members not in a crime) is placed again for the best fit. 🔒 locked teams are never changed.</div>`}<div class="hn">Last change ${ago(D.config.plan_ts)}${D.config.plan_by ? " by " + esc(D.config.plan_by) : ""} · status from the active crimes${D.activeT ? " (checked " + ago(D.activeT * 1000) + ")" : ""}.</div>
    <div class="stat"><div><b>${plan.teams.length}</b><span>Teams</span></div><div><b class="ok">${[...JOIN].filter(p => !QUEUE.has(p)).length}</b><span>✅ Joined</span></div><div><b class="qd">${QUEUE.size}</b><span>🕒 Queued</span></div><div><b>${[...ALL].filter(p => !QUEUE.has(p) && !JOIN.has(p)).length}</b><span>⏳ Not joined yet</span></div></div>
    <div class="hn">✅ <b>Joined</b> = in this crime now · 🕒 <b>Queued</b> = finishing a crime and already lined up for the next one (shown in both) · ⏳ <b>Not joined yet</b> = free, hasn't joined. Counted once per member.</div>
    <div class="bar" style="justify-content:flex-start"><button id="toboard">✏️ Load into the Team Builder</button><button id="undeploy">Withdraw plan</button></div>
    ${alertsHtml()}
    ${spawnAlertsHtml(plan.teams, sm)}
    <div class="teams">${cards}</div></div>`;
  wireAuto();
  $("toboard").onclick = () => { if (BOARD.teams.length && !confirm("Replace the Team Builder board with the deployed plan?")) return;
    BOARD = {teams: plan.teams.filter(t => !t.unplanned).map(t => ({id: t.id, crime: t.crime, difficulty: t.difficulty, kind: t.kind || "spawn", crime_id: t.crime_id || null, lock: !!t.lock,
      roles: t.roles.map(r => r.existing ? Object.assign({}, r) : Object.assign({}, r, rateOf(r.pid, t.crime, r.position) || {}))}))}; saveBoard(); TAB = "builder"; LS.set("hb_oc_tab", TAB); draw(); };
  $("undeploy").onclick = async () => { if (!confirm("Withdraw the deployed plan? Members stop seeing their assigned roles.")) return;
    try { await saveConfig("plan", {teams: []}); D.config.plan = {teams: []}; st("Plan withdrawn."); draw(); } catch (e) { st("Failed: " + e.message, true); } };
}

// ---------- Refresh (once a minute - the gatekeeper enforces it for all leaders together) ----------
// Reloads the shared rates + deployed plan at once, and asks the gatekeeper to start a crime check now; that check
// saves the active crimes, current members and newest completed crimes' rates - polled here until they arrive.
const REFRESH_GAP = 60 * 1000;
let polling = false;
function refreshBtn() {
  const left = Math.ceil((LS.get("hb_oc_refresh_at", 0) + REFRESH_GAP - Date.now()) / 1000);
  const b = $("refresh");
  b.disabled = polling || left > 0;
  b.textContent = polling ? "⏳ Checking Torn…" : left > 0 ? `🔄 Refresh (${left}s)` : "🔄 Refresh";
}
setInterval(refreshBtn, 1000);
$("refresh").onclick = async () => {
  if ($("refresh").disabled) return;
  const startT = Math.floor(Date.now() / 1000);
  LS.set("hb_oc_refresh_at", Date.now()); polling = true; refreshBtn();
  try {
    const r = await fetch("oc/refresh", {method: "POST", headers: {"X-HB-Save": "1"}});
    const j = await r.json().catch(() => ({}));
    if (r.status === 429) {                      // another leader refreshed in the last minute
      LS.set("hb_oc_refresh_at", Date.now() - REFRESH_GAP + (j.retry_in || 60) * 1000);
      polling = false; refreshBtn(); await load();
      st(`Refreshed shared rates and plan. Torn was re-checked under a minute ago - try again in ${j.retry_in || 60}s.`);
      return;
    }
    if (!r.ok || !j.ok) throw new Error(j.error || ("refresh " + r.status));
    await load();
    st("Rates and plan refreshed - checking Torn for members and crimes (about 1-2 minutes)…");
    // the crime check takes ~1-2 min on GitHub; poll every 10 s for up to 4 min
    for (let i = 0; i < 24; i++) {
      await new Promise(res => setTimeout(res, 10000));
      const pool = await ghJSON("data/oc_pool.json");
      if (pool && pool.t >= startT) { polling = false; await load(); st($("st").textContent + " · refreshed from Torn just now"); refreshBtn(); return; }
    }
    throw new Error("the crime check hasn't finished yet - the page will show it on the next load");
  } catch (e) { st("Refresh: " + e.message, true); }
  polling = false; refreshBtn();
};
refreshBtn();

document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { TAB = b.dataset.tab; LS.set("hb_oc_tab", TAB); draw(); });
load();
</script>
