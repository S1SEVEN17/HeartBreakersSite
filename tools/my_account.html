<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My Account - Heart Breakers</title>
<!--
  MY ACCOUNT (members' folder: account.html, published by generate.py write_profiles when the gatekeeper is on)
  Shows the SIGNED-IN member their own information. Who they are comes from whoami.json, which the gatekeeper
  (gate/worker.js) answers from the sign-in pass: {id, name, position, leader, since, until}. Their numbers come
  from the shared databases in db/ (rebuilt every full update), the same ones as the profile page:
    db/members.json  totals per member (wars, chains, crimes, payouts, gym)
    db/payouts.json  current receipt per war, per member [id, pay, war hits, outside]
    db/wars.json     per war, per member [id, hits, respect, assists, hosps, outside]
    db/chains.json   per chain, per member [id, hits, respect, rets]
    db/crimes.json   completed organized crimes (m = list of member ids; split = (1 - tax) / members)
  Sections have ids (#payouts #wars #chains #crimes) - the account menu links straight to them.
  Placeholders filled by generate.py: __MENU__ (site menu), __GATE__ (gatekeeper address: sign out / leaders).
  No libraries, works in Torn PDA.
-->
<style>
:root{--bg:#100a0b;--card:#170d0e;--edge:#5c1c1a;--gold:#e8be5a;--red:#e4382e;--sub:#9a9a9c;--green:#78c878}
*{box-sizing:border-box}body{background:var(--bg);color:#ddd;font:15px system-ui,sans-serif;margin:0 auto;padding:14px;max-width:1100px}
h1{color:var(--red);font-size:26px;letter-spacing:2px;text-transform:uppercase;margin:4px 0 2px;text-align:center}
.sub{color:var(--sub);text-align:center;font-size:13px;margin-bottom:12px}
h2{color:var(--gold);font-size:14px;letter-spacing:1.5px;text-transform:uppercase;margin:26px 0 10px;border-bottom:1px solid var(--edge);padding-bottom:6px;scroll-margin-top:10px}
.badge{display:inline-block;background:#2a1416;border:1px solid var(--edge);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--sub);margin:0 3px}
.badge.ld{color:var(--gold);border-color:var(--gold)}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 4px}
.acts a{background:#1a1012;color:var(--gold);border:1px solid var(--edge);border-radius:8px;padding:9px 14px;text-decoration:none;font-size:14px}
.acts a:hover{border-color:var(--gold)}
.acts a.out{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.pass{color:var(--sub);text-align:center;font-size:12px;margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:10px;text-align:center}
.tile b{display:block;color:#fff;font-size:20px}.tile span{color:var(--sub);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.tile i{display:block;color:var(--gold);font-style:normal;font-size:11px;margin-top:2px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--edge);border-radius:10px;overflow:hidden}
td,th{padding:8px 10px;border-bottom:1px solid #2a1416;text-align:left;font-size:14px;white-space:nowrap}
th{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:1px}
td.n,th.n{text-align:right}.w{color:var(--green)}.d{color:var(--red)}.tag{color:var(--sub);font-size:12px;text-transform:none;letter-spacing:0}
td a{color:var(--gold)}.scroll{overflow-x:auto}.none{color:var(--sub);background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:12px;text-align:center}
.more{text-align:center;margin-top:8px}.more a{color:var(--gold);font-size:13px}
#err{text-align:center;color:var(--sub);margin:30px}#err a{color:var(--gold)}
</style></head><body>
__MENU__
<div id="err">Loading your account…</div>
<div id="p" style="display:none">
  <h1 id="nm"></h1>
  <div class="sub" id="meta"></div>
  <div class="acts" id="acts"></div>
  <div class="pass" id="pass"></div>

  <h2>📊 My totals <span class="tag">(while in the faction)</span></h2>
  <div class="tiles" id="tiles"></div>

  <h2 id="payouts">💰 My war payouts <span class="tag" id="payt"></span></h2>
  <div id="tp"></div>

  <h2 id="wars">⚔️ My recent wars</h2>
  <div id="tw"></div>

  <h2 id="chains">⛓️ My recent chains</h2>
  <div id="tc"></div>

  <h2 id="crimes">🕵️ My organized crimes</h2>
  <div id="to"></div>

  <h2 id="gymh">🏋️ My gym energy this month</h2>
  <div class="tiles" id="gym"></div>
  <div class="more"><a id="full" href="#">Charts and full history → My Profile</a></div>
</div>
<script>
const GATE = "__GATE__";
const SHOW = 10;                                // rows per section (the profile page has everything)
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const num = n => Math.round(n || 0).toLocaleString("en-US");
const money = n => "$" + num(n);
const day = t => t ? new Date(t * 1000).toLocaleDateString("en-US", {month: "short", day: "2-digit", year: "numeric", timeZone: "UTC"}) : "";
const dayMs = t => t ? new Date(t).toLocaleDateString("en-US", {month: "short", day: "2-digit", year: "numeric"}) : "";
const get = f => fetch(f, {cache: "no-store"}).then(r => { if (!r.ok) throw new Error(f + " " + r.status); return r.json(); });
const tile = (v, l, i) => `<div class="tile"><b>${v}</b><span>${l}</span>${i ? `<i>${i}</i>` : ""}</div>`;
const table = (head, rows, empty) => rows.length
  ? `<div class="scroll"><table><tr>${head.map(h => `<th class="${h[1] || ""}">${h[0]}</th>`).join("")}</tr>${rows.join("")}</table></div>`
  : `<div class="none">${empty}</div>`;

(async () => {
  let me;
  try { me = await get("whoami.json"); }
  catch (e) {                                   // pass ran out / not signed in -> back to the sign-in page
    $("err").innerHTML = `You're not signed in. <a href="${GATE}/login?next=%2Fm%2Faccount.html">Sign in</a>`;
    return;
  }
  const [M, P, W, C, O] = await Promise.all(["db/members.json", "db/payouts.json", "db/wars.json", "db/chains.json", "db/crimes.json"]
    .map(f => get(f).catch(() => null)));
  const rec = ((M || {}).members || []).find(m => m.id === me.id) || {t: {}, gym_month: {}};
  const t = rec.t || {};

  // ---- header: who + what they can do ----
  document.title = `${me.name} - My Account - Heart Breakers`;
  $("nm").textContent = me.name;
  $("meta").innerHTML = `[${me.id}]<span class="badge">${esc(me.position || "Member")}</span>`
    + (me.leader ? `<span class="badge ld">🛡️ Leader access</span>` : "")
    + (rec.days != null ? `<span class="badge">${num(rec.days)} days in the faction</span>` : "");
  $("acts").innerHTML = `<a href="member.html?id=${me.id}">📈 My Profile</a>`
    + `<a href="https://www.torn.com/profiles.php?XID=${me.id}" target="_blank" rel="noopener">🌐 My Torn profile</a>`
    + (me.leader ? `<a href="${GATE}/l/">🛡️ Leaders Hub</a>` : "")
    + `<a class="out" href="${GATE}/logout">🚪 Sign out</a>`;
  $("pass").textContent = me.until
    ? `Signed in on this device${me.since ? " since " + dayMs(me.since) : ""} · stays signed in until ${dayMs(me.until)} · Sign out ends it on this device only.`
    : "";
  $("full").href = `member.html?id=${me.id}`;

  // ---- totals ----
  const hitWars = (t.wars || 0) - (t.wars_zero || 0);
  $("tiles").innerHTML = [
    tile(num(t.wars), "Wars", `hit in ${num(hitWars)}`),
    tile(num(t.war_hits), "War hits", `${num(t.war_resp)} respect`),
    tile(num(t.chains), "Chains", `${num(t.chain_hits)} hits`),
    tile(num(t.chain_resp), "Chain respect", `${num(t.rets)} retaliations`),
    tile(`${num(t.crimes_ok)}/${num(t.crimes)}`, "Crimes OK", money(t.crime_money) + " earned"),
    tile(money(t.paid), "War payouts", `${num(t.payouts)} payout${t.payouts === 1 ? "" : "s"}`),
  ].join("");

  // ---- payouts (newest first) ----
  const pc = ((P || {}).payouts || []).map(p => ({p, r: (p.m || []).find(x => x[0] === me.id)}))
    .filter(x => x.r && x.r[1]).sort((a, b) => (b.p.end || 0) - (a.p.end || 0));
  $("payt").textContent = pc.length ? `(${pc.length} total · ${money(pc.reduce((s, x) => s + x.r[1], 0))})` : "";
  $("tp").innerHTML = table([["Date"], ["War vs"], ["War hits", "n"], ["Paid", "n"], [""]],
    pc.slice(0, SHOW).map(({p, r}) => `<tr><td>${day(p.end)}</td><td>${esc(p.opponent || "?")}</td><td class="n">${num(r[2])}</td>`
      + `<td class="n w">${money(r[1])}</td><td><a href="payouts/war-${p.war}.html">Receipt</a></td></tr>`),
    "No war payouts yet.");

  // ---- wars (newest first, ones they were in) ----
  const wc = ((W || {}).wars || []).map(w => ({w, r: (w.m || []).find(x => x[0] === me.id)}))
    .filter(x => x.r).sort((a, b) => (b.w.end || 0) - (a.w.end || 0));
  $("tw").innerHTML = table([["Date"], ["Opponent"], ["Result"], ["Hits", "n"], ["Respect", "n"], ["Assists", "n"]],
    wc.slice(0, SHOW).map(({w, r}) => `<tr><td>${day(w.end)}</td><td>${esc(w.opponent || "?")}</td>`
      + `<td class="${w.won ? "w" : "d"}">${w.won ? "Won" : "Lost"}</td><td class="n${r[1] ? "" : " d"}">${num(r[1])}</td>`
      + `<td class="n">${num(r[2])}</td><td class="n">${num(r[3])}</td></tr>`),
    "No ranked wars on record for you yet.");

  // ---- chains (newest first, ones they hit in) ----
  const cc = ((C || {}).chains || []).map(c => ({c, r: (c.m || []).find(x => x[0] === me.id)}))
    .filter(x => x.r && x.r[1]).sort((a, b) => (b.c.end || 0) - (a.c.end || 0));
  $("tc").innerHTML = table([["Date"], ["Chain", "n"], ["My hits", "n"], ["Respect", "n"], ["Rets", "n"]],
    cc.slice(0, SHOW).map(({c, r}) => `<tr><td>${day(c.end)}</td><td class="n">${num(c.length)}</td><td class="n">${num(r[1])}</td>`
      + `<td class="n">${num(r[2])}</td><td class="n">${num(r[3])}</td></tr>`),
    "No chain hits on record for you yet.");

  // ---- organized crimes (newest first) ----
  const tax = (O || {}).tax || 0;
  const oc = ((O || {}).crimes || []).filter(c => (c.m || []).includes(me.id)).sort((a, b) => (b.t || 0) - (a.t || 0));
  $("to").innerHTML = table([["Date"], ["Crime"], ["Result"], ["My share", "n"]],
    oc.slice(0, SHOW).map(c => {
      const ok = String(c.status).toLowerCase() === "successful";
      const share = ok && c.m.length ? Math.floor((c.money || 0) * (1 - tax) / c.m.length) : 0;
      return `<tr><td>${day(c.t)}</td><td>${esc(c.name || "?")}${c.diff ? ` <span class="tag">lvl ${c.diff}</span>` : ""}</td>`
        + `<td class="${ok ? "w" : "d"}">${ok ? "Success" : esc(c.status || "Failed")}</td><td class="n">${share ? money(share) : "—"}</td></tr>`;
    }),
    "No organized crimes on record for you yet.");

  // ---- gym (this month's gains) ----
  const g = rec.gym_month || {};
  const gk = Object.keys(g);
  if (gk.length) $("gym").innerHTML = gk.map(k => tile(num(g[k]), k.replace(/^gym/, ""), "this month")).join("");
  else { $("gymh").style.display = "none"; $("gym").style.display = "none"; }

  $("err").style.display = "none"; $("p").style.display = "block";
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
})();
</script>
</body></html>
