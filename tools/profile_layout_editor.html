<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Profile Layout - Heart Breakers</title>
<!--
  PROFILE LAYOUT EDITOR (published twice by generate.py write_profile_editors):
    MODE "member"   members' folder profile-editor.html - a member lays out how PROFILES LOOK TO THEM: saved only in
                    their own browser (localStorage hb_profile_layout) and used for every profile they open, theirs
                    and everyone else's. Nothing is sent to the site; other members never see it.
    MODE "default"  leaders' folder profile-default.html - the faction's DEFAULT layout, used for every member who
                    hasn't made their own. Saved to config.json "profile_layout" through the leaders' save route.
  Since Nov 14 2026 it runs on the UNIVERSAL PANEL EDITOR (tools/panelkit.js, inlined at /*__PANELKIT__*/ - read its
  notes); this page only describes the layout (the adapter below): every profile section is a sidebar row - drag ⠿
  to reorder, 👁 to show / hide; tap a section in the preview to select it.
  Layout = {order: [section keys], hidden: [section keys]} - the keys are the <section data-sec> blocks of
  member_profile.html (CFG.sections). The preview is the real profile page with ?layout= (nothing saved until saving).
  Placeholders: __CONFIG__ ({mode, sections, gate, ghproxy, member_base, layouts}), __MENU__.
-->
<style>body{background:#100a0b;margin:0 auto;padding:10px;max-width:1700px}</style></head><body>
__MENU__
<div id="pk"></div>
<script>/*__PANELKIT__*/</script>
<script>
const CFG = __CONFIG__;
const {esc, clone} = PK;
const SEC = CFG.sections;                       // [[key, label, description]]
const KEYS = SEC.map(x => x[0]);
const member = CFG.mode === "member";
const GH = member ? null : PK.gh(Object.assign({branch: "main"}, CFG));
const norm = x => ({order: ((x && x.order) || []).filter(k => KEYS.includes(k)).concat(KEYS.filter(k => !((x && x.order) || []).includes(k))),
                    hidden: ((x && x.hidden) || []).filter(k => KEYS.includes(k))});
let me = null, frame = null;
PK.mount({
  id: member ? "profile_mine" : "profile_default",
  title: member ? "My Profile Layout" : "Default Profile Layout",
  lead: member ? "Choose which sections profiles show, and in what order. Saved in this browser only, and used for every profile you open - nobody else sees your layout."
               : "The layout every member's profile uses until they make their own (members can change theirs from the Me menu).",
  async load() {
    me = await fetch(`${CFG.gate}/m/whoami.json`, {cache: "no-store"}).then(r => r.ok ? r.json() : null).catch(() => null);
    if (member && !me) throw new Error("sign in to edit your profile layout");
    let own = null; try { own = JSON.parse(localStorage.getItem("hb_profile_layout") || "null"); } catch (e) {}
    return {data: norm(member ? (own || (CFG.layouts || {}).default) : (CFG.layouts || {}).default)};
  },
  async save(L) {
    if (member) { try { localStorage.setItem("hb_profile_layout", JSON.stringify(L)); } catch (e) { throw new Error("this browser won't store it"); }
      return "Saved ✓ - open any profile to see it"; }
    await GH.save(null, "Default profile layout edited", c => { c.profile_layout = L; });
    return "Saved ✓ - live in a few minutes";
  },
  saveNote: member ? "Saved on this device straight away (each phone or computer keeps its own)." : "Saved to the site settings - live a few minutes after saving.",
  sections: L => L.order.map(k => { const s = SEC.find(x => x[0] === k) || [k, k, ""]; return {key: k, label: s[1], sub: s[2], shown: !L.hidden.includes(k)}; }),
  move: (L, v, from, to) => { const [x] = L.order.splice(from, 1); L.order.splice(to, 0, x); },
  toggle: (L, v, k, on) => { L.hidden = on ? L.hidden.filter(x => x !== k) : L.hidden.concat(k); },
  remove: () => {},
  form: (L, v, k) => { const s = SEC.find(x => x[0] === k) || [k, k, ""];
    return {obj: {}, title: s[1], help: esc(s[2]) + "<br><br>Drag ⠿ in the list to move it, 👁 to show or hide it.", fields: []}; },
  actions: [{label: member ? "Use the faction default" : "Back to the built-in order", run: async L => {
    if (!confirm(member ? "Go back to the faction's default layout on this device?" : "Remove the default layout? (Profiles go back to the built-in order.)")) return;
    if (member) { try { localStorage.removeItem("hb_profile_layout"); } catch (e) {} return norm((CFG.layouts || {}).default); }
    await GH.save(null, "Default profile layout removed", c => { delete c.profile_layout; }); alert("Saved ✓ - live in a few minutes"); return norm(null); }}],
  preview: {sizes: true, delay: 300, note: member ? "Your own profile, drawn with this layout." : "Your own profile, drawn with this layout.", render: async (L, v, ctx) => {
    if (!frame || !ctx.box.contains(frame)) { ctx.box.innerHTML = ""; frame = document.createElement("iframe"); frame.title = "Preview";
      frame.style.height = "calc(100vh - 190px)"; frame.style.minHeight = "520px"; ctx.box.appendChild(frame); }
    await new Promise(ok => { frame.onload = ok; frame.src = `${CFG.member_base}/member.html?id=${me ? me.id : ""}&layout=${encodeURIComponent(JSON.stringify(L))}`; });
    // same site -> the profile's own <section data-sec> blocks become tappable (#1); quietly skipped if not reachable
    try { const d = frame.contentDocument;
      const st = d.createElement("style"); st.textContent = "[data-pk-sec]{cursor:pointer;outline-offset:3px}[data-pk-sec]:hover{outline:2px dashed rgba(232,190,90,.6)}[data-pk-sec].pk-hl{outline:2px solid #e8be5a}"; d.head.appendChild(st);
      d.querySelectorAll("section[data-sec]").forEach(el => { el.setAttribute("data-pk-sec", el.dataset.sec);
        el.addEventListener("click", e => { if (e.target.closest("a")) return; ctx.select(el.dataset.sec); }); });
    } catch (e) {}
    ctx.status("");
  }}
});
</script>
</body></html>
