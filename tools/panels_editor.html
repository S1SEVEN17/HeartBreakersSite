<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Heart Breakers - Site Panels</title>
<!-- Published twice (leaders' folder): description.html (CFG.only = "D") and announcements.html (CFG.only = "A") -
     each page edits just its own panel. CFG.html = the panel's HTML as it is now. -->
<!--
  SITE PANELS EDITOR (leaders' folder, published by generate.py write_message_builder)
  Edits the text, tiles and buttons of the faction DESCRIPTION banner and the members' ANNOUNCEMENTS panel.
  Since Nov 14 2026 it runs on the UNIVERSAL PANEL EDITOR (tools/panelkit.js, inlined at /*__PANELKIT__*/ - read its
  notes): sections sidebar, click-to-edit preview, placeholders list, undo/redo + device draft, review & save, preview
  sizes, templates. This page only describes the two panels (the adapters below).
  Those panels are drawn by generate.py from config.json, so this page:
    1. loads config.json from the repo through the leaders' save route (CFG.ghproxy - no token on the device; a
       leader's own GitHub token "hb_gh_token" only when the gatekeeper is off),
    2. edits only the parts below - everything else in config.json is left untouched,
    3. saves it back as one commit (with the file's sha, so a newer change is never overwritten).
  Saving config.json starts the "Faction banner" workflow, which redraws both panels in ~3-5 minutes.
  The live preview runs generate.py itself in the page (Pyodide = Python + Pillow): render_image (description - its
  image info "sections" says where each section sits, for click-to-edit) and render_announcement_header (one image
  per part: header / wars / war / chain / gym / slackers).
-->
<style>
body{background:#100a0b;margin:0 auto;padding:10px;max-width:1700px}
</style></head><body>
__MENU__
<div id="pk"></div>
<script>/*__PANELKIT__*/</script>
<script>
const CFG = __CONFIG__;
const {esc, clone} = PK;
const D_ = (CFG.only || "D") === "D";
const GH = PK.gh(CFG);
const ICON = {t: "icon", icons: CFG.icons, base: "builder/icons/"};

// placeholders (#4 - shown as a tappable list in the editor): filled with live faction values when the panel is drawn
const PLACEHOLDERS = [["{faction_name}", "Faction name"], ["{tag}", "Faction tag"], ["{leader}", "Leader's name"], ["{leader_id}", "Leader's ID"],
  ["{co_leader}", "Co-leader's name"], ["{co_leader_id}", "Co-leader's ID"],
  ["{leadership1}", "Leadership slot 1 - name"], ["{leadership1_id}", "Leadership slot 1 - ID"], ["{leadership1_title}", "Leadership slot 1 - title"],
  ["{leadership2}", "Leadership slot 2 - name"], ["{leadership3}", "Leadership slot 3 - name"], ["{leadership4}", "Leadership slot 4 - name"],
  ["{respect}", "Faction respect"], ["{members}", "Members now"], ["{capacity}", "Member capacity"], ["{rank}", "Faction rank"],
  ["{days_old}", "Faction age in days"], ["{best_chain}", "Best chain"], ["{rw_wins}", "Ranked war wins"], ["{updated}", "Last update time"]]
  .concat(D_ ? [] : [["{member_base}", "The members' site address (for button links)"]]);

// ---------------- DESCRIPTION ----------------
const D_NAMES = {faction_info: ["🛡", "Faction Information"], requirements: ["✅", "Requirements"], perks: ["🌳", "Faction Perks"],
                 what_we_offer: ["🎁", "What We Offer"], achievements: ["🏆", "Faction Achievements"]};
const D_ALL = Object.keys(D_NAMES);
const dOrder = C => { let o = Array.isArray(C.section_order) ? C.section_order : (C.section_order = D_ALL.slice(0, 4));
  D_ALL.forEach(k => { if (!o.includes(k)) o.push(k); }); return o; };
const sub = (C, k) => (C[k] = C[k] && typeof C[k] === "object" ? C[k] : {});
const REQ_TPL = [["Level 15+", "15+"], ["Active daily", ""], ["On Discord", ""], ["Joins chains", ""], ["Joins ranked wars", ""], ["Shares OC pass rates", ""]]
  .map(([l, b]) => ({label: l, make: () => ({icon: "gi-checked-shield", badge: b, label: l})}));
const OFFER_TPL = [["Ranked wars", "Paid every war"], ["OC payouts", "High-pay crimes"], ["Armory", "Loans for members"], ["Training help", "Stats advice"], ["Xanax in wars", "Supplied on hits"], ["Active leaders", "Help any time"]]
  .map(([t, x]) => ({label: t, make: () => ({icon: "gi-checked-shield", title: t, text: x})}));
const D_FORMS = {
  faction_info: C => ({obj: sub(C, "faction_info"), help: "The leadership people come from Torn automatically; name each slot's role below.", fields: [
    {k: "title", label: "Section title"},
    {k: "fields", label: "Fields (shown two per row)", t: "list", title: it => it.label, item: [{k: "label", label: "Label"}, {k: "value", label: "Value - text and/or {placeholders}"}],
     make: () => ({label: "New", value: ""}), templates: [["Leader", "{leader}"], ["Respect", "{respect}"], ["Members", "{members} / {capacity}"], ["Rank", "{rank}"], ["Age", "{days_old} days"], ["Best chain", "{best_chain}"]]
       .map(([l, v]) => ({label: l, make: () => ({label: l, value: v})}))},
    {k: "leadership_title", label: "Leadership heading (the divider above the leaders)"},
    {k: "leadership_titles", label: "Leadership titles", t: "strings", ph: "Leadership",
     labels: Array.from({length: Math.max(4, (CFG.leadership || []).length)}, (_, i) => { const w = (CFG.leadership || [])[i];
       return `{leadership${i + 1}} · ${w ? esc(w.name) + " [" + esc(w.id) + "]" : "nobody right now"}`; }),
     note: "Order: longest in the faction first. Leave a title empty to show their Torn position."}]}),
  requirements: C => ({obj: sub(C, "requirements"), help: "3 per row - the section grows a row for every 3.", fields: [
    {k: "title", label: "Section title"},
    {k: "tiles", label: "Requirements", t: "list", title: it => it.label, item: [Object.assign({k: "icon", label: "Icon"}, ICON), {k: "badge", label: "Badge on the icon (optional, e.g. 15+)"}, {k: "label", label: "Text"}],
     make: () => ({icon: "gi-checked-shield", badge: "", label: "New requirement"}), templates: REQ_TPL}]}),
  perks: C => ({obj: sub(C, "perks"), help: "The branches and upgrades themselves come from Torn.", fields: [
    {k: "title", label: "Section title"}, {k: "tree", label: "Which tree to show", t: "select", opts: [["peace", "Peace"], ["war", "War"], ["active", "Active"]]}]}),
  what_we_offer: C => ({obj: sub(C, "what_we_offer"), help: "Two tiles per row.", fields: [
    {k: "title", label: "Section title"},
    {k: "tiles", label: "Tiles", t: "list", title: it => it.title, item: [Object.assign({k: "icon", label: "Icon"}, ICON), {k: "title", label: "Headline (under ~15 characters)"}, {k: "text", label: "Detail (under ~40 characters)"}],
     make: () => ({icon: "gi-checked-shield", title: "New", text: ""}), templates: OFFER_TPL}]}),
  achievements: C => ({obj: sub(C, "achievements"), fields: [{k: "title", label: "Section title"}, {k: "chains_title", label: "Chains heading"}, {k: "goal_text", label: "Text on tiers not reached yet"}]}),
  footer: C => ({obj: sub(C, "footer"), fields: [{k: "text", label: "Footer text ({updated} = last update time)"}]})};
const DESC = {
  sections: C => dOrder(C).map(k => ({key: k, icon: D_NAMES[k][0], label: (C[k] && C[k].title) || D_NAMES[k][1], sub: D_NAMES[k][1], shown: (C[k] || {}).enabled !== false}))
    .concat([{key: "footer", icon: "📝", label: "Footer", sub: "Always last", shown: (C.footer || {}).enabled !== false, fixed: true}]),
  move: (C, v, from, to) => { const o = dOrder(C); const [x] = o.splice(from, 1); o.splice(to, 0, x); },
  toggle: (C, v, k, on) => { sub(C, k).enabled = on; },
  form: (C, v, k) => D_FORMS[k](C)};

// ---------------- ANNOUNCEMENTS ----------------
const ann = C => (C.announcements = C.announcements && typeof C.announcements === "object" ? C.announcements : {});
const lb = C => { const a = ann(C); a.leaderboard = a.leaderboard || {}; const o = Array.isArray(a.leaderboard.order) ? a.leaderboard.order : (a.leaderboard.order = ["war", "chain", "gym"]);
  ["war", "chain", "gym"].forEach(k => { if (!o.includes(k)) o.push(k); }); return a.leaderboard; };
const GROUP_TPL = [["⚔️ War rules", ["Hit only your assigned targets", "Stay online for the war start", "Ask before using armory Xanax"]],
  ["🕵️ OC reminder", ["Install the OC Optimizer script", "Join the crime you're assigned to", "Share your pass rates on the Hub"]],
  ["⛓️ Chain etiquette", ["Sign up for a Chain Watch shift on the Hub", "Don't let the timer drop under 1 minute", "Call out in chat before you hit"]],
  ["👋 New members", ["Welcome to Heart Breakers!", "Read the faction rules on the Hub", "Say hi on Discord"]]]
  .map(([t, l]) => ({label: t, make: () => ({title: t.replace(/^\S+\s/, ""), lines: l.slice()})}));
const BTN_TPL = [["Members Hub", "{member_base}/"], ["Chain Watch schedule", "{member_base}/chainwatch.html"], ["War history", "{member_base}/wars.html"], ["Discord", "https://discord.gg/"]]
  .map(([l, u]) => ({label: l, make: () => ({label: l, url: u, icon: "gi-checked-shield"})}));
const A_FORMS = {
  buttons: C => ({obj: ann(C), title: "Navigation buttons", help: "The picture buttons above the announcement.", fields: [
    {k: "buttons_per_row", label: "Buttons per row", t: "num"}, {k: "button_width", label: "Button width in Torn (px)", t: "num"},
    {k: "buttons", label: "Buttons", t: "list", title: it => it.label, item: [{k: "label", label: "Text"}, {k: "url", label: "Link ({member_base} = members' folder)"}, Object.assign({k: "icon", label: "Icon"}, ICON)],
     make: () => ({label: "New Button", url: "", icon: "gi-checked-shield"}), templates: BTN_TPL}]}),
  notices: C => ({obj: ann(C), title: "Announcements", help: "The red panel: title, war status and your notice groups.", fields: [
    {k: "title", label: "Title bar text"}, {k: "war_title", label: "War status heading"},
    {k: "groups", label: "Notice groups", t: "list", title: it => it.title, item: [{k: "title", label: "Heading"}, {k: "lines", label: "Lines (one per line)", t: "lines"}],
     make: () => ({title: "New", lines: ["Text"]}), templates: GROUP_TPL}]}),
  wars: C => { const a = ann(C); a.ranked_wars = a.ranked_wars || {}; return {obj: a.ranked_wars, title: "Recent Ranked Wars", fields: [{k: "title", label: "Section title"}, {k: "count", label: "How many wars", t: "num"}]}; },
  leaderboards: C => ({obj: lb(C), title: "Leaderboards", help: "Drag ⠿ to put the leaderboards in the order you want.", fields: [
    {k: "order", label: "Order", t: "order", names: {war: "⚔️ War leaderboards", chain: "⛓️ Chain leaderboards", gym: "🏋️ Gym leaderboards"}},
    {k: "gym", label: "Show the gym leaderboards", t: "check"},
    {k: "war_group_title", label: "War leaderboards heading"}, {k: "chain_group_title", label: "Chain leaderboards heading"},
    {k: "gym_group_title", label: "Gym leaderboards heading"}, {k: "gym_subtitle", label: "Gym note"}]}),
  slackers: C => ({obj: (ann(C).slacker_watch = ann(C).slacker_watch || {}), title: "Slacker Watch", fields: [{t: "note", text: "Filled in automatically from war participation. Use 👁 to show or hide it."}]}),
  footer: C => ({obj: ann(C), title: "Footer", fields: [{k: "footer_text", label: "Footer text ({updated} = last update time)"}]})};
const ANN = {
  sections: C => { const a = ann(C), l = lb(C);
    return [{key: "buttons", icon: "🔘", label: "Navigation buttons", sub: (a.buttons || []).length + " buttons", fixed: true},
      {key: "notices", icon: "📢", label: a.title || "Announcements", sub: "Title, war status, notices", fixed: true},
      {key: "wars", icon: "⚔️", label: "Recent Ranked Wars", fixed: true, shown: a.show_ranked_wars !== false},
      {key: "leaderboards", icon: "🏆", label: "Leaderboards", sub: l.order.join(" › "), fixed: true, shown: l.enabled !== false},
      {key: "slackers", icon: "🐌", label: "Slacker Watch", fixed: true, shown: (a.slacker_watch || {}).enabled !== false},
      {key: "footer", icon: "📝", label: "Footer", fixed: true}]; },
  move: () => {},
  toggle: (C, v, k, on) => { const a = ann(C); if (k === "wars") a.show_ranked_wars = on; else if (k === "leaderboards") lb(C).enabled = on;
    else if (k === "slackers") (a.slacker_watch = a.slacker_watch || {}).enabled = on; },
  form: (C, v, k) => A_FORMS[k](C)};

// ---------------- live preview (Pyodide: Python + Pillow running generate.py in this page) ----------------
// preview/manifest.json lists generate.py, the art, icons and fonts; preview/summary.json is this update's faction data.
// The first preview loads the engine (~10-20 s, then cached by the browser); after that each change redraws in a few s.
let PY = null, pyLoading = null;
const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
function loadScript(src) { return new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }); }
async function engine(status) {
  if (PY) return PY;
  if (pyLoading) return pyLoading;
  pyLoading = (async () => {
    status("Loading the preview engine (first time ~15 s)…");
    await loadScript(PYODIDE + "pyodide.js");
    const py = await loadPyodide({indexURL: PYODIDE});
    await py.loadPackage("pillow");
    const man = await (await fetch("preview/manifest.json", {cache: "no-store"})).json();
    status(`Loading the art (${man.files.length} files)…`);
    const mk = p => { const parts = p.split("/"); let d = "/hb"; try { py.FS.mkdir(d); } catch (e) {}
      for (const x of parts.slice(0, -1)) { d += "/" + x; try { py.FS.mkdir(d); } catch (e) {} } };
    await Promise.all(man.files.concat(["summary.json"]).map(async f => {
      const b = new Uint8Array(await (await fetch("preview/" + f)).arrayBuffer()); mk(f); py.FS.writeFile("/hb/" + f, b); }));
    py.globals.set("MEMBER_DIR", man.member_dir || "");
    await py.runPythonAsync(`
import sys, os, json, io, base64
os.environ["MEMBER_DIR"] = MEMBER_DIR
sys.path.insert(0, "/hb")
import generate as g
S = json.load(open("/hb/summary.json"))
def _png(im):
    b = io.BytesIO(); im.save(b, "PNG", compress_level=1); return base64.b64encode(b.getvalue()).decode()
def preview(cfg_json, tab, all_sections):
    cfg = json.loads(cfg_json)
    g._STAMPS.update({"saved": {}, "new": {}})
    out = {}
    if tab == "D":
        im, _ = g.render_image(S, cfg)
        out["imgs"] = [_png(im)]
        out["map"] = [list(x) for x in im.info.get("sections", [])]
        out["h"] = im.height
        out["html"] = g.description_snippet()
    else:
        a = cfg.get("announcements", {})
        parts = g.render_announcement_header(a, S, only=None if all_sections else {"header", "wars"})
        out["imgs"] = [_png(im) for _slug, im in parts]
        out["slugs"] = [slug for slug, _im in parts]
        out["btns"] = [_png(g.render_button(b.get("label", ""), b.get("icon", "gi-checked-shield"))) for b in a.get("buttons", [])]
        out["per_row"] = int(a.get("buttons_per_row", 2))
        names = ["announce-%s.webp" % sl for sl in g.announcement_slugs(a, S)]
        out["html"] = g.announcement_snippet(a, names, g.member_base())
    return json.dumps(out)
`);
    PY = py; return py;
  })();
  return pyLoading;
}
const SLUG_SEC = {header: "notices", wars: "wars", war: "leaderboards", chain: "leaderboards", gym: "leaderboards", slackers: "slackers"};
async function render(C, view, ctx) {
  const py = await engine(ctx.status);
  ctx.status("Drawing…");
  const t0 = performance.now();
  py.globals.set("CFG_JSON", JSON.stringify(C)); py.globals.set("TAB", D_ ? "D" : "A");
  py.globals.set("ALL", !D_ && !!(document.getElementById("pvAll") || {}).checked);
  const res = JSON.parse(await py.runPythonAsync("preview(CFG_JSON, TAB, ALL)"));
  const box = ctx.box; box.innerHTML = "";
  const add = (b64, parent) => { const im = new Image(); im.src = "data:image/png;base64," + b64; (parent || box).appendChild(im); return im; };
  if (D_) {
    // one tall image; each section is a clickable band (#1 click to edit) from render_image's "sections" map
    const im = add(res.imgs[0]);
    (res.map || []).forEach(([k, y0, y1]) => ctx.region(im, k, y0, y1, res.h));
  } else {
    // navigation buttons first (above the main announcement image), like the HTML for Torn
    if (res.btns.length) { const row = document.createElement("div"); row.style.cssText = "display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:4px 0";
      res.btns.forEach(b => { const im = add(b, row); im.style.cssText = `width:calc(${100 / res.per_row}% - 4px);max-width:320px;margin:0`; });
      box.appendChild(row); ctx.mark(row, "buttons"); }
    res.imgs.forEach((b, i) => { const im = add(b); im.style.margin = "6px auto"; ctx.mark(im, SLUG_SEC[res.slugs[i]] || "notices"); });
  }
  ctx.setHtml(res.html);
  ctx.status(`Up to date (${((performance.now() - t0) / 1000).toFixed(1)} s)`);
}

// ---------------- the page ----------------
const A = D_ ? DESC : ANN;
const kit = PK.mount(Object.assign({
  id: D_ ? "description" : "announcements",
  title: D_ ? "Faction Description" : "Announcements",
  lead: (D_ ? "The banner in the faction <b>description</b> (seen by everyone)." : "The members' <b>announcement</b> panel.")
    + " Pick a section on the left or tap it in the preview. Nothing is saved until <b>Review &amp; save</b>."
    + (GH.hasToken ? "" : " <b style='color:#e4382e'>This device can't save (no access) - showing the published copy.</b>"),
  async load() {
    let C;
    if (GH.hasToken) C = await GH.load();
    else C = await (await fetch("preview/config.json", {cache: "no-store"})).json();   // read-only: the copy published with the last update
    return {data: C};
  },
  async save(C) { await GH.save(C, `${D_ ? "Faction Description" : "Announcements"} edited`); return "Saved ✓ - the site redraws the panel in about 3-5 minutes."; },
  remove: () => {}, placeholders: PLACEHOLDERS,
  saveNote: "The site redraws the panel 3-5 minutes after saving.",
  preview: {render, delay: 900, note: "Drawn in your browser with the site's own drawing code and this update's faction data, so it matches what saving will produce."},
  previewExtra: D_ ? "" : `<label class="pk-l" style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="pvAll" style="width:auto"> Also preview the leaderboards (slower)</label>`,
  html: {help: D_ ? "Paste into the <b>faction description</b> (Torn: Faction → Controls → Description, then the &lt;/&gt; view). It only changes if the address changes - the banner image itself updates on its own."
                  : "Paste into the <b>faction announcement</b> (Torn: Faction → Controls → Announcement, then the &lt;/&gt; view). Re-copy after adding, removing or reordering buttons or sections - text changes update on their own."}
}, A));
const pa = document.getElementById("pvAll"); if (pa) pa.onchange = () => kit.redraw();
if (CFG.html) { const t = document.getElementById("pkHtml"); if (t) t.value = CFG.html; }
</script>
</body></html>
