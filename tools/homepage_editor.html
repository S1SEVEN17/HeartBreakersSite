<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Heart Breakers - Homepage Editor</title>
<!--
  HOMEPAGE EDITOR (leaders' folder: homepage.html, published by generate.py write_homepages).
  Since Nov 14 2026 it runs on the UNIVERSAL PANEL EDITOR (tools/panelkit.js, inlined at /*__PANELKIT__*/ - read its
  notes); this page only describes the homepage (the adapter below).
  Leaders lay out the Hub homepage themselves - sections and tiles - instead of asking for UI changes.
  Saves config.json "homepage" (see the HOMEPAGES note in generate.py) through the gatekeeper (CFG.ghproxy - no
  GitHub token on the device); the data repo's notify workflow then rebuilds the site (a few minutes). The save
  re-reads config.json and only replaces "homepage", so other settings changed meanwhile aren't lost.
    section: {type: "welcome"} | {type: "now", title} | {type: "attention", title} (leaders only)
           | {type: "actions", tiles: [{icon, title, link}]} | {type: "latest", title}
           | {type: "groups", title, groups: [{title, links: [{icon, title, link}]}]}
           | {type: "tiles", title, tiles: [{icon, title, desc, link}]} | {type: "text", title, text}
    (what each one shows: the HOMEPAGES note in generate.py). homepage.v = CFG.layout_v marks a layout saved for the
    redesigned hubs - an older saved layout (no v) is ignored by the site, so the editor starts from the built-in one.
    One home since Nov 12 2026: homepage.members (the leaders' copy is kept as it is).
    link:    "M:<page>" members' folder · "L:<page>" leaders' folder · "G:/" dashboard · full https:// address
  The preview is drawn here with the hub's own CSS + script (CFG.css / CFG.js / CFG.jscfg - so the welcome and
  Needs attention parts show your real numbers) and the current "Latest" (CFG.latest); each section is wrapped in a
  [data-pk-sec] box so tapping it opens it in the editor.
  __CONFIG__ / __MENU__ are filled in by generate.py.
-->
<style>body{background:#100a0b;margin:0 auto;padding:10px;max-width:1700px}</style></head><body>
__MENU__
<div id="pk"></div>
<datalist id="pages"></datalist>
<script>/*__PANELKIT__*/</script>
<script>
const CFG = __CONFIG__;
const {esc, clone} = PK;
const GH = PK.gh(CFG);
const HUB = "members";
const HP = C => { if (!C.homepage || !(C.homepage.v >= CFG.layout_v)) C.homepage = clone(CFG.default); return C.homepage; };
const secs = C => { const h = HP(C); h[HUB] = h[HUB] || {sections: []}; h[HUB].sections = h[HUB].sections || []; return h[HUB].sections; };

const KIND = {welcome: ["👋", "Welcome"], now: ["⚡", "Right now"], attention: ["🔔", "Needs attention"], actions: ["🔘", "Quick actions"],
              latest: ["📰", "Latest"], groups: ["🗂️", "Link groups"], tiles: ["🔗", "Tiles"], text: ["📝", "Text note"]};
const AUTO = {welcome: "Filled in automatically: a greeting with the member's name and position, and their last war hits, gym this month and crime success against the faction average.",
              now: "Live from Torn in each member's browser with their own Public key (asked for once, kept only on their device): the ranked war countdown then score, and the chain timer every 15 seconds.",
              attention: "Filled in automatically: wars with no payout receipt yet and inactive recruits. Leaders only - hidden when it's all clear.",
              latest: "Filled in automatically on every update."};
const LINK = {k: "link", label: "Link", t: "link", pages: CFG.pages};
const TILE = [{k: "icon", label: "Icon (emoji)"}, {k: "title", label: "Title"}, {k: "desc", label: "Description"}, LINK];
const BTN = [{k: "icon", label: "Icon (emoji)"}, {k: "title", label: "Title"}, LINK];
const pg = want => { const p = CFG.pages.find(([t]) => t.toLowerCase().includes(want)); return p ? p[1] : CFG.pages[0][1]; };
const TILE_TPL = [["⚔️", "War history", "Every war and your hits", "history"], ["⛓️", "Chain Watch", "Sign up for a shift", "chain"],
  ["🕵️", "Organized crimes", "Stats and payouts", "oc"], ["🏆", "Leaderboards", "Who's on top this month", "leaderboard"], ["👤", "My profile", "Your stats and reliability", "profile"]]
  .map(([i, t, d, w]) => ({label: `${i} ${t}`, make: () => ({icon: i, title: t, desc: d, link: pg(w)})}));
const BTN_TPL = TILE_TPL.map(x => ({label: x.label, make: () => { const t = x.make(); delete t.desc; return t; }}));
// + Add a section (with templates, #9)
const NEW = [
  {label: "Welcome", icon: "👋", desc: "Greeting + the member's own numbers", make: () => ({type: "welcome", title: ""})},
  {label: "Right now", icon: "⚡", desc: "Live war and chain timers", make: () => ({type: "now", title: "Right now"})},
  {label: "Needs attention", icon: "🔔", desc: "Unpaid payouts, idle recruits (leaders only)", make: () => ({type: "attention", title: "Needs attention"})},
  {label: "Quick actions", icon: "🔘", desc: "Big icon buttons", make: () => ({type: "actions", title: "", tiles: [{icon: "🔗", title: "New link", link: ""}]})},
  {label: "Latest", icon: "📰", desc: "Newest post big, the rest as a list", make: () => ({type: "latest", title: "Latest"})},
  {label: "Link groups", icon: "🗂️", desc: "Pages in labelled groups", make: () => ({type: "groups", title: "Explore", groups: [{title: "New group", links: [{icon: "🔗", title: "New link", link: ""}]}]})},
  {label: "Tiles", icon: "🔗", desc: "Link cards", make: () => ({type: "tiles", title: "New section", tiles: [{icon: "🔗", title: "New tile", desc: "", link: ""}]})},
  {label: "Text note", icon: "📝", desc: "A message to everyone", make: () => ({type: "text", title: "", text: "Your message"})},
  {label: "✨ Faction rules note", icon: "✨", desc: "Template: a rules message", make: () => ({type: "text", title: "Faction rules", text: "Be active daily.\n\nJoin chains and ranked wars.\n\nShare your OC pass rates on the Hub."})},
  {label: "✨ Starter tiles", icon: "✨", desc: "Template: war, chain, OC, leaderboards, profile", make: () => ({type: "tiles", title: "Explore", tiles: TILE_TPL.map(t => t.make())})}];

function form(C, v, k) {
  const s = secs(C)[+k]; if (!s) return {obj: {}, fields: []};
  const ty = s.type || "tiles", head = ty === "welcome" ? [] : [{k: "title", label: "Section heading (optional)"}];
  if (AUTO[ty]) return {obj: s, help: esc(AUTO[ty]), fields: head};
  if (ty === "text") return {obj: s, fields: head.concat([{k: "text", label: "Message (a blank line starts a new paragraph)", t: "area"}])};
  if (ty === "groups") return {obj: s, fields: head.concat([{k: "groups", label: "Groups", t: "list", title: g => g.title,
    item: [{k: "title", label: "Group name"}, {k: "links", label: "Links", t: "list", title: t => `${t.icon || ""} ${t.title || ""}`, item: BTN,
            make: () => ({icon: "🔗", title: "New link", link: ""}), templates: BTN_TPL}],
    make: () => ({title: "New group", links: [{icon: "🔗", title: "New link", link: ""}]})}])};
  const act = ty === "actions";
  return {obj: s, fields: head.concat([{k: "tiles", label: act ? "Buttons" : "Tiles", t: "list", title: t => `${t.icon || ""} ${t.title || ""}`, item: act ? BTN : TILE,
    make: () => act ? {icon: "🔗", title: "New link", link: ""} : {icon: "🔗", title: "New tile", desc: "", link: ""}, templates: act ? BTN_TPL : TILE_TPL}])};
}

// preview: the hub drawn with its own CSS + script (links don't navigate here). Same markup as generate.py _hub_sections.
function hubHtml(C) {
  let live = false;
  const body = secs(C).map((sec, i) => {
    const ty = sec.type || "tiles", h = sec.title ? `<h2>${esc(sec.title)}</h2>` : "";
    let x;
    if (ty === "welcome") { live = true; x = `<div class="hbsec" id="hbWel"><div class="wel"><div class="av">HB</div><div class="wt"><b>Welcome to Heart Breakers</b><span>Loading…</span></div></div><div class="stats"></div></div>`; }
    else if (ty === "now") { live = true; x = `<div class="hbsec" id="hbNow">${h}<div class="nowc"><div class="tag">Live war and chain timers appear here.</div></div></div>`; }
    else if (ty === "attention") { live = true;
      x = `<div class="hbsec" id="hbAtt"><div class="attn"><div class="ah"><b>🔔 ${esc(sec.title || "Needs attention")}</b><span class="cnt"></span></div><div class="rows"></div></div></div><div class="tag" style="font-size:11px">(Leaders only - hidden when it's all clear)</div>`; }
    else if (ty === "actions") x = h + `<div class="qa">${(sec.tiles || []).map(t => `<a href="#"><i>${esc(t.icon)}</i>${esc(t.title)}</a>`).join("")}</div>`;
    else if (ty === "latest") { live = true; x = h + (CFG.latest[HUB] || `<div class="tag">Latest appears here.</div>`); }
    else if (ty === "groups") x = h + `<div class="groups">${(sec.groups || []).map(g => `<div><p>${esc(g.title)}</p>${(g.links || []).map(t => `<a href="#"><i>${esc(t.icon)}</i>${esc(t.title)}</a>`).join("")}</div>`).join("")}</div>`;
    else if (ty === "text") x = h + `<div class="note">${String(sec.text || "").split(/\n\n/).filter(p => p.trim()).map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("")}</div>`;
    else x = h + `<div class="grid">${(sec.tiles || []).map(t => `<a class="tile" href="#"><b><i>${esc(t.icon)}</i>${esc(t.title)}</b><span>${esc(t.desc)}</span></a>`).join("")}</div>`;
    return `<div data-pk-sec="${i}" style="border-radius:10px">${x}</div>`;
  }).join("");
  const top = secs(C).some(x => x.type === "welcome") ? "" : `<div class="top"><h1>Heart Breakers</h1><div class="tag">Members Hub</div></div>`;
  const js = live ? `<script>window.HBH=${JSON.stringify(CFG.jscfg[HUB]).replace(/</g, "\\u003c")};<\/script><script>${CFG.js}<\/script>` : "";
  // <base>: the Latest pictures are addressed from the members' folder; the [data-pk-sec] outline styles live in here too
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><base href="${esc(CFG.member_base)}/"><style>${CFG.css}
    [data-pk-sec]{cursor:pointer;outline-offset:3px}[data-pk-sec]:hover{outline:2px dashed rgba(232,190,90,.6)}[data-pk-sec].pk-hl{outline:2px solid #e8be5a}</style></head><body>
    <div style="text-align:center;color:#9a9a9c;font-size:12px;margin-bottom:8px">[ site header ]</div>${top}<div class="hubw">${body}</div>${js}
    <script>document.addEventListener("click",function(e){if(e.target.closest("a"))e.preventDefault();});<\/script></body></html>`;
}
let frame = null;
PK.mount({
  id: "homepage", title: "Homepage Editor", indexed: true,
  lead: "Lay out the Hub homepage yourself: add, remove and drag sections; tap a section in the preview to edit it. Live on the site a few minutes after saving.",
  async load() { const C = await GH.load(); HP(C); return {data: C}; },
  async save(C) { const hp = HP(C); hp.v = CFG.layout_v; await GH.save(C, "Homepage edited", c => { c.homepage = hp; }); return "Saved ✓ - live in a few minutes"; },
  sections: C => secs(C).map((s, i) => { const k = KIND[s.type || "tiles"] || ["🔗", s.type];
    return {key: String(i), icon: k[0], label: s.title || k[1], sub: k[1] + ((s.tiles || s.groups) ? ` · ${(s.tiles || s.groups).length}` : ""), removable: true}; }),
  move: (C, v, from, to) => { const S = secs(C); const [x] = S.splice(from, 1); S.splice(to, 0, x); },
  toggle: () => {},
  remove: (C, v, k) => { secs(C).splice(+k, 1); },
  addSection: {label: "+ Add a section", options: NEW},
  insert: (C, v, obj) => { secs(C).push(obj); return String(secs(C).length - 1); },
  form,
  actions: [{label: "Reset to built-in", run: async C => { if (!confirm("Put the homepage back to the built-in layout? (Not saved until you save.)")) return;
    HP(C)[HUB] = clone(CFG.default[HUB]); return C; }}],
  saveNote: "The homepage updates a few minutes after saving.",
  preview: {sizes: true, delay: 300, render: async (C, v, ctx) => {
    // one iframe kept between redraws (srcdoc swap) - its sections report taps back to the editor
    if (!frame || !ctx.box.contains(frame)) { ctx.box.innerHTML = ""; frame = document.createElement("iframe"); frame.title = "Preview";
      frame.style.height = "calc(100vh - 190px)"; frame.style.minHeight = "520px"; ctx.box.appendChild(frame); }
    await new Promise(ok => { frame.onload = ok; frame.srcdoc = hubHtml(C); });
    frame.contentDocument.querySelectorAll("[data-pk-sec]").forEach(el => el.addEventListener("click", e => { e.preventDefault(); ctx.select(el.getAttribute("data-pk-sec")); }));
    ctx.status("");
  }}
});
</script>
</body></html>
