<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Member Profile - Heart Breakers</title>
<!--
  MEMBER PROFILE (members' folder: member.html?id=<torn id>, published by generate.py write_profiles)
  Everything is drawn in the browser from the shared databases in db/ (rebuilt every full update):
    db/members.json  totals per member (wars, chains, crimes, payouts, gym)
    db/wars.json     per war, per member [id, hits, respect, assists, hosps, outside]
    db/chains.json   per chain, per member [id, hits, respect, rets]
    db/crimes.json   completed organized crimes (members = list of ids; money split = (1 - tax) / members)
    db/payouts.json  current receipt per war, per member [id, pay, war hits, outside]
  Charts are plain inline SVG (no libraries, works in Torn PDA). __MENU__ is replaced with the site menu.
-->
<style>
:root{--bg:#100a0b;--card:#170d0e;--edge:#5c1c1a;--gold:#e8be5a;--red:#e4382e;--sub:#9a9a9c;--green:#78c878}
*{box-sizing:border-box}body{background:var(--bg);color:#ddd;font:15px system-ui,sans-serif;margin:0 auto;padding:14px;max-width:1100px}
h1{color:var(--red);font-size:26px;letter-spacing:2px;text-transform:uppercase;margin:4px 0 2px;text-align:center}
.sub{color:var(--sub);text-align:center;font-size:13px;margin-bottom:14px}.sub a{color:var(--gold)}
h2{color:var(--gold);font-size:14px;letter-spacing:1.5px;text-transform:uppercase;margin:24px 0 10px;border-bottom:1px solid var(--edge);padding-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:10px;text-align:center}
.tile b{display:block;color:#fff;font-size:20px}.tile span{color:var(--sub);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.tile i{display:block;color:var(--gold);font-style:normal;font-size:11px;margin-top:2px}
.chart{background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:10px;overflow-x:auto}
.chart svg{display:block;margin:0 auto}.legend{color:var(--sub);font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--edge);border-radius:10px;overflow:hidden}
td,th{padding:8px 10px;border-bottom:1px solid #2a1416;text-align:left;font-size:14px}th{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:1px}
td.n,th.n{text-align:right}.w{color:var(--green)}.d{color:var(--red)}.tag{color:var(--sub);font-size:12px}
.scroll{overflow-x:auto}.badge{display:inline-block;background:#2a1416;border:1px solid var(--edge);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--sub);margin-left:6px}
.rng{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:22px 0 0}
.rng span{color:var(--sub);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-right:4px}
.rng button{background:#1a1012;color:#ddd;border:1px solid var(--edge);border-radius:7px;padding:6px 12px;font:13px system-ui;cursor:pointer}
.rng button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
#err{text-align:center;color:var(--sub);margin:30px}
</style></head><body>
__MENU__
<div id="err">Loading…</div>
<div id="p" style="display:none">
  <h1 id="nm"></h1><div class="sub" id="meta"></div>
  <div class="tiles" id="tiles"></div>
  <div class="rng" id="rng"><span>Range</span><button data-r="30">1 Month</button><button data-r="91">3 Months</button>
    <button data-r="182">6 Months</button><button data-r="365" class="on">1 Year</button><button data-r="0">All Time</button></div>
  <h2>⚔️ Hits per war <span class="tag" id="cwt"></span></h2>
  <div class="chart" id="cw"></div>
  <h2>⛓️ Chain hits <span class="tag" id="cct"></span></h2>
  <div class="chart" id="cc"></div>
  <h2>🏋️ Gym energy <span class="tag">(trained while in the faction)</span></h2>
  <div class="tiles" id="gym"></div>
  <h2>⚔️ Wars</h2><div class="scroll"><table id="tw"></table></div>
  <h2>⛓️ Recent chains</h2><div class="scroll"><table id="tc"></table></div>
  <h2>🕵️ Organized crimes</h2><div class="scroll"><table id="to"></table></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const num = n => Math.round(n || 0).toLocaleString("en-US");
const money = n => "$" + num(n);
const day = t => t ? new Date(t * 1000).toLocaleDateString("en-US", {month: "short", day: "2-digit", year: "numeric", timeZone: "UTC"}) : "";
const id = +new URLSearchParams(location.search).get("id");
const get = f => fetch("db/" + f + ".json").then(r => { if (!r.ok) throw new Error(f); return r.json(); });

// bar chart: values [{label, v, sub}] + optional average line
// width = the chart box (so bars spread across it, centred); phones get at least 28 px per bar and scroll sideways
// zeroCol: colour of a 0 bar (red = missed for wars, grey = quiet day for chains)
function bars(el, vals, avg, colour = "#e8be5a", zeroCol = "#e4382e") {
  el._args = [vals, avg, colour, zeroCol];
  const W = Math.max((el.clientWidth || 600) - 22, vals.length * 16), H = 190, pad = 26, mx = Math.max(1, avg || 0, ...vals.map(x => x.v || 0));
  const bw = (W - pad * 2) / vals.length;
  // many bars (long ranges): numbers only on bars wide enough, date labels every few bars (hover/tap shows all)
  const showNum = bw >= 26, every = Math.max(1, Math.ceil(46 / bw));
  let s = `<svg width="${W}" height="${H + 30}" viewBox="0 0 ${W} ${H + 30}" style="margin:0 auto">`;
  vals.forEach((x, k) => {
    const w = Math.min(bw * 0.7, 64), h = (H - 20) * (x.v || 0) / mx, X = pad + k * bw + (bw - w) / 2;   // bars at most 64 px wide
    if (x.v === null) s += `<circle cx="${X + w / 2}" cy="${H - 4}" r="3" fill="#555"><title>${esc(x.label)}: not in the faction</title></circle>`;
    else s += `<rect x="${X}" y="${H - h}" width="${w}" height="${Math.max(h, x.v === 0 ? 3 : 0)}" rx="3" fill="${x.v === 0 ? zeroCol : colour}"><title>${esc(x.label)}: ${num(x.v)}</title></rect>`
      + (x.v && showNum ? `<text x="${X + w / 2}" y="${H - h - 4}" fill="#ccc" font-size="11" text-anchor="middle">${num(x.v)}</text>` : "");
    if (k % every === 0 || k === vals.length - 1 && every === 1)
      s += `<text x="${X + w / 2}" y="${H + 14}" fill="#9a9a9c" font-size="10" text-anchor="middle">${esc(x.short || "")}</text>`;
  });
  if (avg) { const y = H - (H - 20) * avg / mx;
    s += `<line x1="${pad}" x2="${W - pad}" y1="${y}" y2="${y}" stroke="#e4382e" stroke-dasharray="5 4"/>`; }
  el.innerHTML = s + "</svg>";
}
// redraw on resize / rotate so the charts keep filling their box
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() =>
  document.querySelectorAll(".chart").forEach(el => el._args && bars(el, ...el._args)), 150); });

Promise.all(["members", "wars", "chains", "crimes", "payouts"].map(get)).then(([M, W, C, O, P]) => {
  const m = M.members.find(x => x.id === id);
  if (!m) { $("err").textContent = "Member not found - use the search box above."; return; }
  $("err").style.display = "none"; $("p").style.display = "block";
  document.title = m.name + " - Heart Breakers";
  $("nm").textContent = m.name;
  $("meta").innerHTML = [m.position, m.days != null ? m.days + " days in the faction" : "",
    m.current ? "" : '<span class="badge">left the faction</span>',
    `<a href="https://www.torn.com/profiles.php?XID=${m.id}">Torn profile [${m.id}]</a>`].filter(Boolean).join(" · ");
  const t = m.t;
  // rank among current members
  const cur = M.members.filter(x => x.current);
  const rank = key => { const s = cur.map(x => x.t[key]).sort((a, b) => b - a); return m.current ? "#" + (s.indexOf(t[key]) + 1) + " of " + cur.length : ""; };
  const tiles = [
    ["War hits", num(t.war_hits), rank("war_hits")], ["War respect", num(t.war_resp), rank("war_resp")],
    ["Wars hit", `${t.wars - t.wars_zero}/${t.wars}`, t.wars ? Math.round(100 * (t.wars - t.wars_zero) / t.wars) + "%" : ""],
    ["Assists · Hosps", `${num(t.assists)} · ${num(t.hosps)}`, ""],
    ["Chain hits", num(t.chain_hits), rank("chain_hits")], ["Chain respect", num(t.chain_resp), rank("chain_resp")],
    ["Crimes", `${t.crimes_ok}/${t.crimes}`, t.crimes ? Math.round(100 * t.crimes_ok / t.crimes) + "% success" : ""],
    ["Crime earnings", money(t.crime_money), "their share"],
    ["War payouts", money(t.paid), t.payouts ? t.payouts + " war" + (t.payouts > 1 ? "s" : "") : ""]];
  $("tiles").innerHTML = tiles.map(([l, v, i]) => `<div class="tile"><b>${v}</b><span>${l}</span>${i ? `<i>${i}</i>` : ""}</div>`).join("");
  // charts - redrawn for the chosen range (1M / 3M / 6M / 1Y / All). Remembered on this device.
  const DAY = 86400, nowT = Date.now() / 1000;
  const fmtD = (t, o) => new Date(t * 1000).toLocaleDateString("en-US", Object.assign({timeZone: "UTC"}, o));
  function drawCharts(days) {
    const from = days ? nowT - days * DAY : 0;
    // hits per war: every war in the range
    const ws = W.wars.filter(w => w.end >= from);
    const wv = ws.map(w => { const r = w.m.find(x => x[0] === id); return {label: `vs ${w.opponent} (${day(w.end)})`,
      short: fmtD(w.end, {month: "short", day: "numeric"}), v: r ? r[1] : null}; });
    const avgs = ws.map(w => { const h = w.m.filter(x => x[1] > 0); return h.length ? h.reduce((a, x) => a + x[1], 0) / h.length : 0; });
    const fa = avgs.reduce((a, b) => a + b, 0) / (avgs.length || 1);
    $("cwt").textContent = `(${ws.length} war${ws.length !== 1 ? "s" : ""} - gold = their hits, line = faction average)`;
    if (ws.length) bars($("cw"), wv, fa); else $("cw").innerHTML = '<div class="tag" style="text-align:center;padding:30px">No ranked wars in this range.</div>';
    const myA = wv.filter(x => x.v !== null), mine_ = myA.length ? myA.reduce((a, x) => a + x.v, 0) / myA.length : 0;
    $("cwl").innerHTML = ws.length ? `Their average <b style="color:#e8be5a">${mine_.toFixed(1)}</b> hits per war · faction average <b style="color:#e4382e">${fa.toFixed(1)}</b> (dashed line)` : "";
    // chain hits: by day (1 month), by week (3 months), by month (longer)
    const unit = days && days <= 31 ? "day" : days && days <= 92 ? "week" : "month";
    const first = days ? from : Math.min(...C.chains.map(c => c.end), nowT);
    const keyOf = t => { const d = new Date(t * 1000);
      if (unit === "day") return d.toISOString().slice(0, 10);
      if (unit === "week") { const m = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - ((d.getUTCDay() + 6) % 7))); return m.toISOString().slice(0, 10); }
      return d.toISOString().slice(0, 7); };
    const buckets = {};
    const step = unit === "day" ? DAY : unit === "week" ? 7 * DAY : 28 * DAY;
    for (let t = first; t <= nowT + step; t += step) buckets[keyOf(Math.min(t, nowT))] = 0;
    C.chains.forEach(c => { if (c.end < first) return; const k = keyOf(c.end); if (k in buckets) {
      const r = c.m.find(x => x[0] === id); if (r) buckets[k] += r[1]; } });
    const lab = k => unit === "month" ? fmtD(Date.parse(k + "-01T00:00:00Z") / 1000, {month: "short", year: days > 365 || !days ? "2-digit" : undefined})
                                       : fmtD(Date.parse(k + "T00:00:00Z") / 1000, {month: "short", day: "numeric"});
    const cv = Object.entries(buckets).map(([k, v]) => ({label: (unit === "week" ? "Week of " : "") + lab(k), short: lab(k), v}));
    const tot = cv.reduce((a, x) => a + x.v, 0);
    $("cct").textContent = `(per ${unit} - ${tot.toLocaleString("en-US")} in this range)`;
    bars($("cc"), cv, 0, "#e4382e", "#4a3a3a");
  }
  $("cw").insertAdjacentHTML("afterend", '<div class="legend" id="cwl" style="text-align:center"></div>');
  const saved = localStorage.getItem("hb_profile_range");
  document.querySelectorAll("#rng button").forEach(b => {
    if (saved !== null) b.classList.toggle("on", b.dataset.r === saved);
    b.onclick = () => { document.querySelectorAll("#rng button").forEach(x => x.classList.toggle("on", x === b));
      try { localStorage.setItem("hb_profile_range", b.dataset.r); } catch (e) {}
      drawCharts(+b.dataset.r); };
  });
  drawCharts(+(document.querySelector("#rng button.on") || {dataset: {r: 365}}).dataset.r);
  // gym
  const G = [["gymstrength", "Strength"], ["gymspeed", "Speed"], ["gymdefense", "Defense"], ["gymdexterity", "Dexterity"]];
  const gt = G.reduce((a, [k]) => a + (m.gym[k] || 0), 0), gm = G.reduce((a, [k]) => a + (m.gym_month[k] || 0), 0);
  $("gym").innerHTML = G.map(([k, l]) => `<div class="tile"><b>${num(m.gym[k])}</b><span>${l}</span><i>+${num(m.gym_month[k])} this month</i></div>`).join("")
    + `<div class="tile"><b>${num(gt)}</b><span>Total</span><i>+${num(gm)} this month</i></div>`;
  // wars table
  const pay = {}; P.payouts.forEach(p => { const r = p.m.find(x => x[0] === id); if (r) pay[p.war] = r[1]; });
  const mine = W.wars.filter(w => w.m.some(x => x[0] === id)).reverse();
  $("tw").innerHTML = `<tr><th>Date</th><th>War</th><th class="n">Hits</th><th class="n">Respect</th><th class="n">Assists</th><th class="n">Hosps</th><th class="n">Outside</th><th class="n">Payout</th></tr>`
    + (mine.map(w => { const r = w.m.find(x => x[0] === id);
      return `<tr><td>${day(w.end)}</td><td><span class="${w.won ? "w" : "d"}">${w.won ? "Victory" : "Defeat"}</span> vs ${esc(w.opponent)}</td>
        <td class="n">${num(r[1])}</td><td class="n">${num(r[2])}</td><td class="n">${num(r[3])}</td><td class="n">${num(r[4])}</td><td class="n">${num(r[5])}</td>
        <td class="n">${pay[w.id] ? money(pay[w.id]) : "-"}</td></tr>`; }).join("") || `<tr><td colspan="8" class="tag">No ranked wars yet.</td></tr>`);
  // chains table (last 25 they hit in)
  const ch = C.chains.filter(c => c.m.some(x => x[0] === id)).reverse().slice(0, 25);
  $("tc").innerHTML = `<tr><th>Date</th><th class="n">Chain</th><th class="n">Their hits</th><th class="n">Respect</th><th class="n">Retals</th></tr>`
    + (ch.map(c => { const r = c.m.find(x => x[0] === id);
      return `<tr><td>${day(c.end)}</td><td class="n">${num(c.length)}</td><td class="n">${num(r[1])}</td><td class="n">${num(r[2])}</td><td class="n">${num(r[3])}</td></tr>`; }).join("")
      || `<tr><td colspan="5" class="tag">No chain hits yet.</td></tr>`);
  // crimes table
  const cr = O.crimes.filter(c => (c.m || []).includes(id)).reverse().slice(0, 40);
  $("to").innerHTML = `<tr><th>Date</th><th>Crime</th><th>Result</th><th class="n">Their share</th></tr>`
    + (cr.map(c => { const ok = String(c.status).toLowerCase() === "successful";
      const share = ok && c.m.length ? Math.floor(c.money * (1 - O.tax) / c.m.length) : 0;
      return `<tr><td>${day(c.t)}</td><td>${esc(c.name)} <span class="tag">D${c.diff}</span></td><td class="${ok ? "w" : "d"}">${esc(c.status)}</td>
        <td class="n">${share ? money(share) : (ok && c.items ? "Item rewards" : "-")}</td></tr>`; }).join("")
      || `<tr><td colspan="4" class="tag">No organized crimes on record.</td></tr>`);
}).catch(e => { $("err").textContent = "Couldn't load the faction data (" + e.message + ")."; });
</script>
</body></html>
