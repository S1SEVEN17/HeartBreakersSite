<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Armory Monitor - Heart Breakers</title>
<!--
  ARMORY MONITOR (leaders' folder: armory.html, published by generate.py write_armory_page). Replaced the Xanax
  monitor in Nov 2026: faction ARMORY usage only - what each member took from the armory (used, points refills,
  items loaned / given to them) - nothing about gym, attacks or energy.
  CFG (filled in by generate.py, from data/armory_log.json - see ARMORY MONITOR in generate.py):
    cats       category order (Drugs, Medical, Boosters, Refills, Temporary, Weapons, Armor, Other)
    items      item names; item_cat = each item's category (Torn item type)
    months     "YYYY-MM" with any usage, newest first; oldest = earliest news read; done = whole history read
    members    {id: {m: {"YYYY-MM": {item index: count}}}}      names {id: [name, current member?]}
  Pick a period (this month, any month on record, or all time on record - usage is kept by month) -> faction totals by category, every member (sortable, tap a row for their items),
  and the most used items. Placeholders: __CONFIG__, __MENU__.
-->
<style>
:root{--bg:#100a0b;--card:#170d0e;--edge:#5c1c1a;--gold:#e8be5a;--red:#e4382e;--sub:#9a9a9c;--green:#78c878}
*{box-sizing:border-box}body{background:var(--bg);color:#ddd;font:15px system-ui,sans-serif;margin:0 auto;padding:14px;max-width:1200px}
h1{color:var(--red);font-size:26px;letter-spacing:2px;text-transform:uppercase;margin:4px 0 2px;text-align:center}
.sub{color:var(--sub);text-align:center;font-size:13px;margin-bottom:12px}
h2{color:var(--gold);font-size:14px;letter-spacing:1.5px;text-transform:uppercase;margin:24px 0 10px;border-bottom:1px solid var(--edge);padding-bottom:6px}
.rng{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:4px 0 10px}
.rng span{color:var(--sub);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-right:4px}
.rng button,.rng select{background:#1a1012;color:#ddd;border:1px solid var(--edge);border-radius:7px;padding:6px 12px;font:13px system-ui;cursor:pointer}
.rng button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.hst{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:0 0 10px}
.hst div{background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:9px;text-align:center}
.hst b{display:block;color:#fff;font-size:19px}.hst span{color:var(--sub);font-size:11px;text-transform:uppercase;letter-spacing:1px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--edge);border-radius:10px;overflow:hidden}
td,th{padding:8px 10px;border-bottom:1px solid #2a1416;text-align:left;font-size:14px;white-space:nowrap}
th{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;user-select:none}
th.on:after{content:" ▾"}th.on.up:after{content:" ▴"}td.n,th.n{text-align:right}td a{color:var(--gold);text-decoration:none}
tr.mr{cursor:pointer}tr.mr:hover td{background:#1f1214}tr.det td{background:#120a0b;white-space:normal;color:#cfc6c6;font-size:13px}
.tag{color:var(--sub);font-size:12px}.scroll{overflow-x:auto}tr.zero td{color:#6d6264}
.fm{color:var(--sub);font-size:13px;margin:6px 0;display:flex;gap:6px;align-items:center}
.note{background:#1f1608;border:1px solid #6b4a18;color:#e8d6a8;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
.chip{display:inline-block;background:#1f1214;border:1px solid #3a1c1c;border-radius:6px;padding:2px 7px;margin:2px 3px 2px 0}
</style></head><body>
__MENU__
<h1>Armory Monitor</h1>
<div class="sub">Items each member took from the faction armory - used, points refills, and items loaned or given to them</div>
<div class="note" id="cov"></div>
<div class="rng" id="ctl"></div>
<div class="hst" id="tot"></div>
<h2>👥 Members <span class="tag">(tap a column to sort · tap a member for their items)</span></h2>
<label class="fm"><input type="checkbox" id="fmr"> Show former members</label>
<div class="scroll"><table id="tb"></table></div>
<h2>📦 Most used items</h2>
<div class="scroll"><table id="ti"></table></div>
<script>
const CFG = __CONFIG__;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const num = n => Math.round(n || 0).toLocaleString("en-US");
const monthName = m => new Date(m + "-01T00:00:00Z").toLocaleString("en-US", {month: "long", year: "numeric", timeZone: "UTC"});
const thisMonth = new Date().toISOString().slice(0, 7);
const ICON = {Drugs: "💊", Medical: "🩸", Boosters: "🍺", Refills: "⚡", Temporary: "💣", Weapons: "🔫", Armor: "🛡️", Other: "📦"};
let period = "month", key = "total", desc = true, open = {};

// coverage: how far back the armory history has been read (it fills a few pages each update, newest first)
$("cov").innerHTML = CFG.oldest
  ? `History read back to <b>${new Date(CFG.oldest * 1000).toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric", timeZone: "UTC"})}</b>`
    + (CFG.done ? " - the faction's whole armory history." : " - older months are still being filled in, a little more every update (newest months first).")
  : "No armory history read yet - it starts on the next full update.";

// period -> the months it covers
const monthsOf = p => p === "all" ? CFG.months : [p === "month" ? thisMonth : p];
function usage(id, months) {           // {category: n, items: {name: n}, total}
  const m = (CFG.members[id] || {}).m || {}, r = {items: {}, total: 0};
  CFG.cats.forEach(c => r[c] = 0);
  months.forEach(mo => Object.entries(m[mo] || {}).forEach(([it, n]) => {
    const c = CFG.item_cat[+it] || "Other", nm = CFG.items[+it];
    r[c] += n; r.total += n; r.items[nm] = (r.items[nm] || 0) + n; }));
  return r;
}

function draw() {
  const months = monthsOf(period);
  const ids = new Set(Object.keys(CFG.members).concat(Object.keys(CFG.names).filter(i => CFG.names[i][1])));
  const rows = [...ids].map(id => Object.assign({id, name: (CFG.names[id] || ["[" + id + "]"])[0], cur: !!(CFG.names[id] || [0, 0])[1]}, usage(id, months)));
  const shown = rows.filter(r => r.cur || ($("fmr").checked && r.total));
  // faction totals
  const T = {total: 0}; CFG.cats.forEach(c => T[c] = 0);
  rows.forEach(r => { CFG.cats.forEach(c => T[c] += r[c]); T.total += r.total; });
  const cats = CFG.cats.filter(c => T[c] > 0);
  $("tot").innerHTML = `<div><b>${num(T.total)}</b><span>Items taken</span></div>`
    + `<div><b>${rows.filter(r => r.total).length}</b><span>Members</span></div>`
    + cats.map(c => `<div><b>${num(T[c])}</b><span>${ICON[c] || ""} ${c}</span></div>`).join("");
  // members table
  const cols = [["Member", "name"], ["Total", "total"]].concat(cats.map(c => [c, c]));
  shown.sort((a, b) => { const x = a[key], y = b[key]; const r = typeof x === "string" ? x.localeCompare(y) : (x || 0) - (y || 0); return desc ? -r : r; });
  $("tb").innerHTML = `<tr>${cols.map(([l, k]) => `<th class="${k === "name" ? "" : "n"}${k === key ? " on" + (desc ? "" : " up") : ""}" data-k="${k}">${k === "name" || k === "total" ? l : (ICON[l] || "") + " " + l}</th>`).join("")}<th>Top items</th></tr>`
    + shown.map(r => {
      const top = Object.entries(r.items).sort((a, b) => b[1] - a[1]);
      return `<tr class="mr${r.total ? "" : " zero"}" data-id="${r.id}"><td><a href="${CFG.member_base}/member.html?id=${r.id}" onclick="event.stopPropagation()">${esc(r.name)}</a>${r.cur ? "" : ' <span class="tag">former</span>'}</td>`
        + `<td class="n"><b>${num(r.total)}</b></td>` + cats.map(c => `<td class="n">${r[c] ? num(r[c]) : '<span class="tag">-</span>'}</td>`).join("")
        + `<td class="tag">${top.slice(0, 3).map(([n, v]) => `${esc(n)} ×${num(v)}`).join(" · ")}</td></tr>`
        + (open[r.id] ? `<tr class="det"><td colspan="${cols.length + 1}">${top.map(([n, v]) => `<span class="chip">${esc(n)} ×${num(v)}</span>`).join("") || "Nothing in this period."}</td></tr>` : "");
    }).join("") || `<tr><td class="tag" colspan="${cols.length + 1}">No armory usage in this period.</td></tr>`;
  $("tb").querySelectorAll("th[data-k]").forEach(th => th.onclick = () => { if (th.dataset.k === key) desc = !desc; else { key = th.dataset.k; desc = key !== "name"; } draw(); });
  $("tb").querySelectorAll("tr.mr").forEach(tr => tr.onclick = () => { open[tr.dataset.id] = !open[tr.dataset.id]; draw(); });
  // items
  const items = {};
  rows.forEach(r => Object.entries(r.items).forEach(([n, v]) => { const x = items[n] = items[n] || {n: 0, who: 0}; x.n += v; x.who++; }));
  const il = Object.entries(items).sort((a, b) => b[1].n - a[1].n).slice(0, 25);
  $("ti").innerHTML = `<tr><th>Item</th><th>Category</th><th class="n">Taken</th><th class="n">Members</th></tr>`
    + il.map(([n, x]) => `<tr><td>${esc(n)}</td><td class="tag">${ICON[CFG.item_cat[CFG.items.indexOf(n)]] || ""} ${esc(CFG.item_cat[CFG.items.indexOf(n)] || "")}</td><td class="n">${num(x.n)}</td><td class="n">${x.who}</td></tr>`).join("")
    || `<tr><td class="tag" colspan="4">Nothing in this period.</td></tr>`;
}

$("ctl").innerHTML = `<span>Period</span><button data-p="month" class="on">This month</button>`
  + `<select id="mon"><option value="">Pick a month…</option>${CFG.months.map(m => `<option value="${m}">${monthName(m)}</option>`).join("")}</select>`
  + `<button data-p="all">All time on record</button>`;
const pick = p => { period = p; $("ctl").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.p === p));
  if (p === "month" || p === "all") $("mon").value = ""; draw(); };
$("ctl").querySelectorAll("button").forEach(b => b.onclick = () => pick(b.dataset.p));
$("mon").onchange = () => { if ($("mon").value) pick($("mon").value); };
$("fmr").onchange = draw;
draw();
</script>
</body></html>
