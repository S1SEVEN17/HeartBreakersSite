<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Heart Breakers - Header Editor</title>
<!--
  HEADER EDITOR (leaders' folder: header-editor.html, published by generate.py write_homepages). Nov 2026.
  Since Nov 14 2026 it runs on the UNIVERSAL PANEL EDITOR (tools/panelkit.js, inlined at /*__PANELKIT__*/ - read its
  notes); this page only describes the header (the adapter below).
  Leaders set the site header (the menu bar at the top of every page) themselves. Two parts (the editor's views):
    Members header  - what EVERYONE sees (members and leaders)
    Leaders header  - extra items only leaders see, after the members' items (default: one "🛡️ Leaders" dropdown
                      with the leadership tools sorted into folders)
  Saves config.json "site_header" {members: [item], leaders: [item]} ("header" is the banner's own settings - never
  touched) (see header_default / nav_menu in generate.py) through the gatekeeper (CFG.ghproxy - no GitHub token on the
  device); the data repo's notify workflow rebuilds the site. The save re-reads config.json and only replaces
  site_header, so a change someone else made to another part meanwhile isn't lost.
    item:   {label, link}                      a button
            {label, items: [entry, ...]}       a dropdown; entry = {label, link} or a folder {label, items: [{label, link}]}
    link:   "M:<page>" members' folder · "L:<page>" leaders' folder · "G:/" dashboard · a full https:// address
  Each top-level item (button / dropdown) is a "section" in the sidebar: drag to reorder, ✕ to remove, + Add with
  templates. The preview is drawn with the header's own look (folders open by tap); tap an item to edit it.
  "👤 Me" (the account menu) is always at the end and isn't edited here. __CONFIG__ / __MENU__ filled in by generate.py.
-->
<style>body{background:#100a0b;margin:0 auto;padding:10px;max-width:1700px}</style></head><body>
__MENU__
<div id="pk"></div>
<script>/*__PANELKIT__*/</script>
<script>
const CFG = __CONFIG__;
const {esc, clone} = PK;
const GH = PK.gh(CFG);
const H = C => (C.site_header = (C.site_header && Array.isArray(C.site_header.members) && Array.isArray(C.site_header.leaders)) ? C.site_header : clone(CFG.default));
const first = () => CFG.pages[0][1];
const LINK = {k: "link", label: "Opens", t: "link", pages: CFG.pages};
const LINK_F = [{k: "label", label: "Text (emoji welcome)"}, LINK];
// a dropdown's entries: a link, or a folder of links
const ENTRIES = {k: "items", label: "In the dropdown", t: "list", title: it => it.label,
  variants: {folder: {label: "📁 Folder", is: it => Array.isArray(it.items),
                      fields: [{k: "label", label: "Folder name"}, {k: "items", label: "Links in the folder", t: "list", title: it => it.label, item: LINK_F,
                                make: () => ({label: "New link", link: first()})}]},
             link: {label: "🔗 Link", is: it => !Array.isArray(it.items), fields: LINK_F}},
  add: [{label: "+ Link", make: () => ({label: "New link", link: first()})}, {label: "+ Folder", make: () => ({label: "📁 New folder", items: [{label: "New link", link: first()}]})}]};
// section templates (#9)
const pg = (want) => { const p = CFG.pages.find(([t]) => t.toLowerCase().includes(want)); return p ? p[1] : first(); };
const TEMPLATES = [
  {label: "Button", icon: "🔘", desc: "One link in the bar", make: () => ({label: "New button", link: first()})},
  {label: "Dropdown", icon: "▾", desc: "A menu of links", make: () => ({label: "New dropdown ▾", items: [{label: "New link", link: first()}]})},
  {label: "⚔️ Wars dropdown", icon: "✨", desc: "Template: war history + readiness", make: () => ({label: "⚔️ Wars ▾", items: [{label: "History", link: pg("history")}, {label: "War readiness", link: pg("readiness")}]})},
  {label: "🕵️ Crimes dropdown", icon: "✨", desc: "Template: OC pages", make: () => ({label: "🕵️ Crimes ▾", items: [{label: "OC stats", link: pg("oc")}, {label: "Payouts", link: pg("payout")}]})},
  {label: "👤 My profile button", icon: "✨", desc: "Template", make: () => ({label: "👤 My profile", link: "M:me"})}];

let side = "members";
PK.mount({
  id: "header", title: "Header Editor", indexed: true,
  lead: "The menu bar at the top of every page. Members see the <b>Members header</b>; leaders see it plus the <b>Leaders header</b> items. Drag ⠿ to reorder, tap an item in the preview to edit it.",
  views: [{id: "members", label: "👥 Members header"}, {id: "leaders", label: "🛡️ Leaders header"}],
  async load() { return {data: await GH.load()}; },
  async save(C) {
    // drop empty entries, then write only site_header onto the latest config.json
    const clean = row => row.filter(it => it && it.label).map(it => Array.isArray(it.items)
      ? {label: it.label, items: it.items.filter(e => e && e.label).map(e => Array.isArray(e.items) ? {label: e.label, items: e.items.filter(x => x && x.label && x.link)} : {label: e.label, link: e.link})
          .filter(e => e.link || (e.items && e.items.length))}
      : {label: it.label, link: it.link}).filter(it => it.link || (it.items && it.items.length));
    const sh = {members: clean(H(C).members), leaders: clean(H(C).leaders)};
    await GH.save(C, "Header edited", c => { c.site_header = sh; });
    return "Saved ✓ - every page's header updates in a few minutes";
  },
  sections: (C, view) => H(C)[view].map((it, i) => ({key: String(i), icon: Array.isArray(it.items) ? "▾" : "🔘", label: it.label || "(no text)",
    sub: Array.isArray(it.items) ? `Dropdown · ${it.items.length} entr${it.items.length === 1 ? "y" : "ies"}` : "Button", removable: true})),
  move: (C, view, from, to) => { const r = H(C)[view]; const [x] = r.splice(from, 1); r.splice(to, 0, x); },
  toggle: () => {},
  remove: (C, view, k) => { H(C)[view].splice(+k, 1); },
  addSection: {label: "+ Add a button or dropdown", options: TEMPLATES},
  insert: (C, view, obj) => { H(C)[view].push(obj); return String(H(C)[view].length - 1); },
  form: (C, view, k) => { const it = H(C)[view][+k]; if (!it) return {obj: {}, fields: []};
    return Array.isArray(it.items) ? {obj: it, title: "Dropdown", fields: [{k: "label", label: "Dropdown text"}, ENTRIES]}
                                   : {obj: it, title: "Button", fields: LINK_F}; },
  actions: [{label: "Reset to the default", run: async C => { if (!confirm("Put both headers back to the default? (Not saved until you save.)")) return; C.site_header = clone(CFG.default); return C; }}],
  saveNote: "Every page's header updates a few minutes after saving.",
  preview: {sizes: true, delay: 0, render: async (C, view, ctx) => {
    // the header's own markup + CSS (links don't open here); top-level items are tappable (#1)
    const h = H(C), a = e => `<a href="#" onclick="return false">${esc(e.label)}</a>`;
    const entry = e => Array.isArray(e.items) ? `<details><summary>${esc(e.label)}</summary><div>${e.items.map(a).join("")}</div></details>` : a(e);
    const item = (it, lead, i) => Array.isArray(it.items)
      ? `<details${lead ? ' class="ld"' : ""} data-i="${i}"><summary>${esc(it.label)}</summary><div>${it.items.map(entry).join("")}</div></details>`
      : `<a${lead ? ' class="ld"' : ""} data-i="${i}" href="#" onclick="return false">${esc(it.label)}</a>`;
    ctx.box.innerHTML = `<div style="color:#9a9a9c;font-size:12px;text-align:center;margin-bottom:6px">${view === "members" ? "What a member sees" : "What a leader sees (members' items + leaders' items)"}</div>`
      + CFG.css + `<div class="hbm">${h.members.map((x, i) => item(x, false, view === "members" ? i : "")).join("")}${view === "leaders" ? h.leaders.map((x, i) => item(x, true, i)).join("") : ""}`
      + `<details><summary>👤 Me</summary><div><a href="#" onclick="return false">👤 My Profile</a></div></details></div><div style="height:240px"></div>`;
    ctx.box.querySelectorAll(".hbm>[data-i]").forEach(el => { if (el.dataset.i !== "") { const s = el.tagName === "DETAILS" ? el.querySelector("summary") : el;
      s.setAttribute("data-pk-sec", el.dataset.i); s.addEventListener("click", () => ctx.select(el.dataset.i)); } });
    ctx.box.querySelectorAll(".hbm>details").forEach(d => d.addEventListener("toggle", () => { if (d.open) ctx.box.querySelectorAll(".hbm>details").forEach(o => { if (o !== d) o.open = false; }); }));
    ctx.status("");
  }}
});
</script>
</body></html>
