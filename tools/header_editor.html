<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Heart Breakers - Header Editor</title>
<!--
  HEADER EDITOR (leaders' folder: header-editor.html, published by generate.py write_homepages). Nov 2026.
  Leaders set the site header (the menu bar at the top of every page) themselves. Two parts:
    Members header  - what EVERYONE sees (members and leaders)
    Leaders header  - extra items only leaders see, after the members' items (default: one "🛡️ Leaders" dropdown
                      with the leadership tools sorted into folders)
  Saves config.json "header" {members: [item], leaders: [item]} (see header_default / nav_menu in generate.py) through
  the gatekeeper (CFG.ghproxy - no GitHub token on the device); the data repo's notify workflow rebuilds the site.
    item:   {label, link}                      a button
            {label, items: [entry, ...]}       a dropdown; entry = {label, link} or a folder {label, items: [{label, link}]}
    link:   "M:<page>" members' folder · "L:<page>" leaders' folder · "G:/" dashboard · a full https:// address
  The preview below is drawn here with the header's own look (folders open by tap). "👤 Me" (the account menu) is
  always at the end and isn't edited here. Nothing is saved until Save changes. __CONFIG__ / __MENU__ filled in by generate.py.
-->
<style>
:root{--bg:#100a0b;--card:#170d0e;--edge:#5c1c1a;--gold:#e8be5a;--red:#e4382e;--sub:#9a9a9c}
*{box-sizing:border-box}body{background:var(--bg);color:#ddd;font:14px system-ui,sans-serif;margin:0 auto;padding:10px;max-width:900px}
h1{color:var(--red);text-align:center;font-size:24px;letter-spacing:2px;text-transform:uppercase;margin:6px 0 2px}
.lead{color:var(--sub);text-align:center;margin:0 0 10px}
.tabs{display:flex;gap:6px;justify-content:center;margin:8px 0}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:10px;margin-bottom:10px}
.card h2{margin:0 0 8px;color:var(--gold);font-size:13px;text-transform:uppercase;letter-spacing:1.5px}
.it{border:1px solid var(--edge);border-radius:10px;padding:8px;margin-bottom:8px;background:#140b0c}
.sub2{border:1px dashed #3a1c1c;border-radius:8px;padding:6px;margin:6px 0 6px 10px}
.sub3{border-left:2px solid #3a1c1c;padding:4px 0 4px 8px;margin:4px 0 4px 10px}
.bh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.bh b{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:1px;flex:1}
.bh .t{color:var(--sub);font-size:12px;flex:1}
input,select{background:#1a1012;color:#ddd;border:1px solid var(--edge);border-radius:6px;padding:7px;font:13px system-ui;margin:2px 0;width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1 1 180px}
button{background:#1a1012;color:#ddd;border:1px solid var(--edge);border-radius:6px;padding:6px 10px;font:13px system-ui;cursor:pointer}
button.s{padding:3px 8px}button.gold{background:#3a2d12;border-color:#6b4a18;color:var(--gold);font-weight:600}
button.save{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;padding:9px 18px}
.small{color:var(--sub);font-size:12px}#status{color:var(--gold);margin-left:8px}
.pv{background:#0c0708;border:1px solid var(--edge);border-radius:10px;padding:14px 8px 20px;min-height:380px}
.pv .who{color:var(--sub);font-size:12px;text-align:center;margin-bottom:6px}
.bar{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:60;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style></head><body>
__MENU__
<h1>Header Editor</h1>
<div class="lead">The menu bar at the top of every page. Members see the <b>Members header</b>; leaders see it plus the <b>Leaders header</b> items.</div>
<div class="bar"><button class="save" id="save">Save changes</button><button id="reset">Reset to the default</button><span id="status"></span></div>
<div class="tabs"><button id="tM" class="on">👥 Members header</button><button id="tL">🛡️ Leaders header</button></div>
<div class="card"><h2>Preview</h2>
  <div class="pv"><div class="who" id="pvw"></div><div id="pv"></div></div>
  <div class="small" style="margin-top:6px">Tap a dropdown (and a folder inside it) to open it. "👤 Me" is always at the end.</div></div>
<div class="card"><h2 id="fh"></h2><div class="small" id="fhs" style="margin-bottom:8px"></div><div id="form"></div>
  <div class="row" style="margin-top:6px"><button class="gold" id="addB">+ Button</button><button class="gold" id="addD">+ Dropdown</button></div></div>
<script>
const CFG = __CONFIG__;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const GHC = CFG.ghproxy || `https://api.github.com/repos/${CFG.repo}/contents/`;
const tok = CFG.ghproxy ? "gate" : (() => { try { return JSON.parse(localStorage.getItem("hb_gh_token")); } catch (e) { return null; } })();
let C = null, sha = null, side = "members", dirty = false;
const H = () => (C.header = (C.header && Array.isArray(C.header.members) && Array.isArray(C.header.leaders)) ? C.header : JSON.parse(JSON.stringify(CFG.default)));
const changed = () => { dirty = true; $("status").textContent = "Unsaved changes"; preview(); };

// a page picker (known pages) + a custom address box
function linkPick(val, path) {
  const known = CFG.pages.some(([, u]) => u === val);
  return `<div class="row"><select data-p="${path}" data-f="pick">${CFG.pages.map(([t, u]) => `<option value="${esc(u)}"${u === val ? " selected" : ""}>${esc(t)}</option>`).join("")}`
    + `<option value=""${known ? "" : " selected"}>Other address…</option></select>`
    + (known ? "" : `<input data-p="${path}" data-f="link" placeholder="https://… or M:page.html" value="${esc(val || "")}">`) + `</div>`;
}
const moveBtns = path => `<button class="s" data-mv="${path}|-1">▲</button><button class="s" data-mv="${path}|1">▼</button><button class="s" data-del="${path}">✕</button>`;
function linkRow(e, path, kind) {
  return `<div class="${kind}"><div class="bh"><span class="t">${kind === "sub3" ? "Link in folder" : "Link"}</span>${moveBtns(path)}</div>`
    + `<div class="row"><input data-p="${path}" data-f="label" placeholder="Text (emoji welcome)" value="${esc(e.label)}"></div>${linkPick(e.link, path)}</div>`;
}
function render() {
  const row = H()[side];
  $("fh").textContent = side === "members" ? "Members header - everyone sees these" : "Leaders header - only leaders see these (after the members' items)";
  $("fhs").textContent = side === "members" ? "Buttons and dropdowns, left to right." : "Tip: a dropdown can hold folders - tap \"+ Folder\" inside it to group tools.";
  $("form").innerHTML = row.map((it, i) => {
    const p = `${i}`;
    if (Array.isArray(it.items)) {
      return `<div class="it"><div class="bh"><b>Dropdown</b>${moveBtns(p)}</div><input data-p="${p}" data-f="label" placeholder="Dropdown text" value="${esc(it.label)}">`
        + it.items.map((e, j) => Array.isArray(e.items)
          ? `<div class="sub2"><div class="bh"><span class="t">📁 Folder</span>${moveBtns(p + "." + j)}</div><input data-p="${p}.${j}" data-f="label" placeholder="Folder name" value="${esc(e.label)}">`
            + e.items.map((x, k) => linkRow(x, `${p}.${j}.${k}`, "sub3")).join("")
            + `<button class="s" data-add="${p}.${j}|link">+ Link in folder</button></div>`
          : linkRow(e, `${p}.${j}`, "sub2")).join("")
        + `<div class="row" style="margin-top:4px"><button class="s" data-add="${p}|link">+ Link</button><button class="s" data-add="${p}|folder">+ Folder</button></div></div>`;
    }
    return `<div class="it"><div class="bh"><b>Button</b>${moveBtns(p)}</div><input data-p="${p}" data-f="label" placeholder="Button text" value="${esc(it.label)}">${linkPick(it.link, p)}</div>`;
  }).join("") || '<div class="small">Nothing here yet.</div>';
  preview();
}
// path "i" / "i.j" / "i.j.k" -> [parent array, index]
function at(path) {
  const ix = path.split(".").map(Number);
  let arr = H()[side];
  for (let k = 0; k < ix.length - 1; k++) arr = arr[ix[k]].items;
  return [arr, ix[ix.length - 1]];
}
$("form").addEventListener("input", e => {
  const el = e.target, p = el.dataset.p; if (p == null) return;
  const [arr, i] = at(p), o = arr[i];
  if (el.dataset.f === "pick") { if (el.value) { o.link = el.value; if (!o.label) o.label = el.selectedOptions[0].textContent; } else o.link = o.link && !CFG.pages.some(([, u]) => u === o.link) ? o.link : "https://"; render(); changed(); return; }
  o[el.dataset.f] = el.value; changed();
});
$("form").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.mv) { const [p, d] = b.dataset.mv.split("|"), [arr, i] = at(p), j = i + +d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }
  else if (b.dataset.del) { if (!confirm("Remove this?")) return; const [arr, i] = at(b.dataset.del); arr.splice(i, 1); }
  else if (b.dataset.add) { const [p, kind] = b.dataset.add.split("|"), [arr, i] = at(p);
    arr[i].items.push(kind === "folder" ? {label: "📁 New folder", items: [{label: "New link", link: CFG.pages[0][1]}]} : {label: "New link", link: CFG.pages[0][1]}); }
  else return;
  render(); changed();
});
$("addB").onclick = () => { H()[side].push({label: "New button", link: CFG.pages[0][1]}); render(); changed(); };
$("addD").onclick = () => { H()[side].push({label: "New dropdown ▾", items: [{label: "New link", link: CFG.pages[0][1]}]}); render(); changed(); };
$("tM").onclick = () => { side = "members"; $("tM").classList.add("on"); $("tL").classList.remove("on"); render(); };
$("tL").onclick = () => { side = "leaders"; $("tL").classList.add("on"); $("tM").classList.remove("on"); render(); };
$("reset").onclick = () => { if (!C || !confirm("Put both headers back to the default?")) return; C.header = JSON.parse(JSON.stringify(CFG.default)); render(); changed(); };

// ---- preview: the header's own markup + CSS (links don't open here) ----
function preview() {
  const h = H(), a = e => `<a href="#" onclick="return false">${esc(e.label)}</a>`;
  const entry = e => Array.isArray(e.items) ? `<details><summary>${esc(e.label)}</summary><div>${e.items.map(a).join("")}</div></details>` : a(e);
  const item = (it, lead) => Array.isArray(it.items)
    ? `<details${lead ? ' class="ld"' : ""}><summary>${esc(it.label)}</summary><div>${it.items.map(entry).join("")}</div></details>`
    : `<a${lead ? ' class="ld"' : ""} href="#" onclick="return false">${esc(it.label)}</a>`;
  $("pvw").textContent = side === "members" ? "What a member sees" : "What a leader sees (members' items + leaders' items)";
  $("pv").innerHTML = CFG.css + `<div class="hbm">${h.members.map(x => item(x, false)).join("")}${side === "leaders" ? h.leaders.map(x => item(x, true)).join("") : ""}`
    + `<details><summary>👤 Me</summary><div><a href="#" onclick="return false">👤 My Profile</a></div></details></div>`;
  $("pv").querySelectorAll(".hbm>details").forEach(d => d.addEventListener("toggle", () => { if (d.open) $("pv").querySelectorAll(".hbm>details").forEach(o => { if (o !== d) o.open = false; }); }));
}

const b64d = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, "")), c => c.charCodeAt(0)));
const b64e = t => { const u = new TextEncoder().encode(t); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
async function load() {
  try {
    const r = await fetch(`${GHC}config.json?ref=${CFG.branch}`, {headers: {Authorization: "Bearer " + tok, Accept: "application/vnd.github+json"}, cache: "no-store"});
    if (!r.ok) throw new Error("GitHub said " + r.status);
    const j = await r.json(); sha = j.sha; C = JSON.parse(b64d(j.content));
    render();
  } catch (e) { $("form").innerHTML = `<div class="card">Couldn't load the settings: ${esc(e.message)}</div>`; }
}
$("save").onclick = async () => {
  if (!C) return;
  if (!dirty) return alert("Nothing changed yet.");
  // drop empty entries before saving
  const clean = row => row.filter(it => it && it.label).map(it => Array.isArray(it.items)
    ? {label: it.label, items: it.items.filter(e => e && e.label).map(e => Array.isArray(e.items) ? {label: e.label, items: e.items.filter(x => x && x.label && x.link)} : {label: e.label, link: e.link}).filter(e => e.link || (e.items && e.items.length))}
    : {label: it.label, link: it.link}).filter(it => it.link || (it.items && it.items.length));
  C.header = {members: clean(H().members), leaders: clean(H().leaders)};
  $("status").textContent = "Saving…";
  try {
    const r = await fetch(`${GHC}config.json`, {method: "PUT",
      headers: {Authorization: "Bearer " + tok, Accept: "application/vnd.github+json", "Content-Type": "application/json", "X-HB-Save": "1"},
      body: JSON.stringify({message: "Header edited", sha, branch: CFG.branch, content: b64e(JSON.stringify(C, null, 2) + "\n")})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(r.status === 409 ? "the settings changed since you opened this page - reload and redo your change" : (j.message || r.status));
    sha = j.content && j.content.sha; dirty = false;
    $("status").textContent = "Saved ✓ - every page's header updates in a few minutes";
    render();
  } catch (e) { $("status").textContent = "Save failed: " + e.message; }
};
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
load();
</script>
</body></html>
